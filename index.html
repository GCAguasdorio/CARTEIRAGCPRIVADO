<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteira Viva · Grandes Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0A2A43; --navy-2:#123A5C; --navy-3:#1B4E76;
    --water:#1C7EBE; --water-soft:#E4F1FA; --water-line:#C9E3F3;
    --leaf:#2C9A66; --leaf-soft:#E3F5EC; --leaf-line:#BFE6D2;
    --amber:#B9791A; --amber-soft:#FBF1DE; --amber-line:#EFD9AE;
    --rose:#C0492E; --rose-soft:#FBE9E5; --rose-line:#F0C7BC;
    --violet:#7C4FCB; --violet-soft:#F1EAFB;
    --bg:#EEF3F7; --surface:#FFFFFF; --border:#DEE6EC;
    --text:#12232F; --text-mut:#5B7285; --text-faint:#8CA0AF;
    --radius:16px;
    --shadow-xs:0 1px 2px rgba(10,42,67,.05);
    --shadow-sm:0 4px 14px -6px rgba(10,42,67,.14);
    --shadow-md:0 14px 34px -14px rgba(10,42,67,.28);
    --shadow-lg:0 24px 60px -20px rgba(10,42,67,.34);
    --font-display:'Manrope',sans-serif; --font-body:'Inter',sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:#C7D6DF; border-radius:100px; }
  button, input, select, textarea{ font-family:var(--font-body); color:var(--text); }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--water); outline-offset:2px; border-radius:4px; }
  .hidden{ display:none!important; }
  .num{ font-variant-numeric:tabular-nums; }

  /* ── login ── */
  .login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:radial-gradient(900px 500px at 100% 0%, rgba(28,126,190,.35), transparent 55%), linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 55%, var(--navy-3) 100%); }
  .login-card{ background:var(--surface); border-radius:18px; padding:32px; max-width:380px; width:100%; box-shadow:var(--shadow-lg); }
  .login-card .eyebrow{ color:var(--water); margin-bottom:10px; }
  .login-card h1{ font-family:var(--font-display); font-weight:800; color:var(--navy); font-size:18px; margin-bottom:4px; }
  .login-card p.sub{ font-size:13px; color:var(--text-mut); margin-bottom:22px; }

  /* ── campos ── */
  .fld{ margin-bottom:14px; display:flex; flex-direction:column; }
  .fld label{ display:block; font-size:12px; font-weight:700; color:var(--text-mut); margin-bottom:6px; }
  .fld input, .fld select, .fld textarea{ width:100%; font-size:13.5px; padding:9px 11px; border-radius:9px; border:1px solid var(--border); background:#FBFDFE; }
  .fld input[type=radio], .fld input[type=checkbox]{ width:auto; }
  .fld textarea{ min-height:70px; resize:vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus{ outline:none; border-color:var(--water); box-shadow:0 0 0 3px var(--water-soft); }
  .fld input[readonly]{ background:var(--water-soft); border-color:var(--water-line); color:var(--navy); font-weight:600; }
  .fld .help{ font-size:12px; color:var(--text-faint); margin-top:5px; }

  /* ── botões ── */
  .btn{ font-weight:700; font-size:13px; border:none; border-radius:10px; padding:9px 16px; transition:.15s; display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--navy); color:#fff; text-decoration:none; }
  .btn:hover{ background:var(--navy-2); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn.full{ width:100%; }
  .btn.sec{ background:none; border:1px solid var(--border); color:var(--navy); }
  .btn.sec:hover{ border-color:var(--water); color:var(--water); background:var(--water-soft); }
  .btn.ok{ background:var(--leaf); color:#fff; } .btn.ok:hover{ background:#25835A; }
  .btn.bad{ background:none; border:1px solid var(--rose-line); color:var(--rose); } .btn.bad:hover{ background:var(--rose-soft); }
  .btn.sm{ padding:6px 12px; font-size:12px; }
  .link{ background:none; border:none; color:var(--water); font-weight:700; font-size:12.5px; padding:0; }
  .link:hover{ text-decoration:underline; }
  .msg{ font-size:12.5px; font-weight:600; border-radius:10px; padding:9px 12px; margin-bottom:12px; border:1px solid transparent; }
  .msg.err{ background:var(--rose-soft); color:var(--rose); border-color:var(--rose-line); }
  .msg.ok{ background:var(--leaf-soft); color:var(--leaf); border-color:var(--leaf-line); }
  .msg.info{ background:var(--water-soft); color:var(--navy-3); border-color:var(--water-line); }

  /* ── hero ── */
  .hero-wrap{
    background:
      radial-gradient(1100px 420px at 12% -20%, rgba(255,255,255,.08), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(28,126,190,.35), transparent 55%),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
    padding:34px 20px 56px; position:relative; overflow:hidden;
  }
  .hero-inner{ max-width:1200px; margin:0 auto; position:relative; z-index:1; }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:#BFE0F5; font-weight:700; margin-bottom:14px; }
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:#5FC1F0; box-shadow:0 0 0 4px rgba(95,193,240,.22); }
  .hero-top{ display:flex; gap:20px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; }
  .hero-inner h1{ font-family:var(--font-display); font-weight:800; font-size:clamp(24px,3.4vw,32px); color:#fff; margin:0 0 10px; letter-spacing:-.01em; }
  .hero-inner p.lead{ margin:0; color:#CBDCE9; font-size:14px; max-width:700px; line-height:1.65; }
  .hero-chips{ display:flex; gap:10px; flex-wrap:wrap; }
  .hchip{ border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); border-radius:12px; padding:10px 16px; min-width:150px; }
  .hchip .l{ font-size:11px; font-weight:700; color:#BFE0F5; text-transform:uppercase; letter-spacing:.05em; }
  .hchip .v{ font-family:var(--font-display); font-size:22px; font-weight:800; color:#fff; margin-top:2px; }

  .role-switch{ display:flex; gap:8px; margin-top:26px; flex-wrap:wrap; }
  .role-switch button{
    appearance:none; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:#DCEAF4;
    font-weight:700; font-size:13.5px; padding:11px 18px; border-radius:11px; transition:.15s;
    display:flex; align-items:center; gap:8px;
  }
  .role-switch button svg{ width:16px; height:16px; }
  .role-switch button.on{ background:#fff; color:var(--navy); border-color:#fff; }
  .role-switch button:not(.on):hover{ background:rgba(255,255,255,.12); }
  .role-switch .badge{ background:var(--rose); color:#fff; border-radius:100px; font-size:10.5px; padding:0 7px; line-height:17px; }
  .role-switch .sair{ margin-left:auto; }
  .hero-foot{ margin-top:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:12.5px; color:#BFE0F5; }
  .hero-foot select{ background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:9px; padding:6px 10px; font-size:12.5px; font-weight:600; }
  .hero-foot select option{ color:var(--text); }

  .app{ max-width:1200px; margin:-30px auto 60px; padding:0 20px; position:relative; z-index:2; animation:viewIn .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

  /* ── cards e cabeçalhos ── */
  .sec-h, .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 22px 24px; box-shadow:var(--shadow-xs); margin-top:18px; }
  .sec-h{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-bottom:20px; }
  .sec-h:first-child{ margin-top:0; box-shadow:var(--shadow-sm); }
  .sec-h h2, .card h2{ font-family:var(--font-display); font-size:16px; font-weight:800; color:var(--navy); margin:0 0 4px; }
  .sec-h p, .card .sub{ font-size:13px; color:var(--text-mut); margin:0; line-height:1.55; }
  .sec-h .acts{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .card h3{ font-family:var(--font-display); font-size:15px; font-weight:800; color:var(--navy); margin-bottom:12px; }
  .card h3 small{ font-family:var(--font-body); font-weight:500; color:var(--text-faint); font-size:12px; margin-left:6px; }
  .card p{ font-size:13px; color:var(--text-mut); line-height:1.55; }

  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-top:18px; }
  .k{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 16px 14px; position:relative; overflow:hidden; }
  .k::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--water); }
  .k .l{ font-size:11px; color:var(--text-mut); font-weight:700; margin-bottom:6px; }
  .k .v{ font-family:var(--font-display); font-size:23px; font-weight:800; color:var(--navy); }
  .k .s{ font-size:12px; color:var(--text-faint); margin-top:3px; }
  .k.hero-k::before{ background:var(--navy); }
  .k.c1::before{ background:var(--navy-3); } .k.c2::before{ background:var(--water); } .k.c2 .v{ color:var(--water); }
  .k.c3::before{ background:var(--leaf); } .k.c3 .v{ color:var(--leaf); }
  .k.c4::before{ background:var(--rose); } .k.c4 .v{ color:var(--rose); }
  .k.c5::before{ background:var(--amber); } .k.c5 .v{ color:var(--amber); }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 18px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:0 18px; }
  @media(max-width:900px){ .grid2,.grid3{ grid-template-columns:1fr; } .grid3 .card{ grid-column:auto!important; } }
  .chart-box{ position:relative; height:250px; }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:18px 0 12px; }
  .search{ position:relative; flex:1; min-width:220px; }
  .search svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-faint); }
  .search input{ width:100%; font-size:13px; padding:9px 12px 9px 34px; border-radius:10px; border:1px solid var(--border); background:var(--surface); }
  .search input:focus{ outline:none; border-color:var(--water); box-shadow:0 0 0 3px var(--water-soft); }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-size:12.5px; font-weight:700; color:var(--text-mut); white-space:nowrap; }
  .chip:hover{ border-color:var(--water); color:var(--water); }
  .chip.on{ background:var(--navy); border-color:var(--navy); color:#fff; }
  select.sel, input.sel{ font-size:13px; padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); }

  .scroll{ overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-xs); }
  .card .scroll{ border:none; box-shadow:none; border-radius:0; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-mut); font-weight:700; padding:11px 10px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; white-space:nowrap; }
  td{ padding:10px 10px; border-bottom:1px solid #EEF3F6; vertical-align:middle; white-space:nowrap; }
  tbody tr:hover td{ background:#FAFCFD; }
  tr:last-child td{ border-bottom:none; }
  td.r, th.r{ text-align:right; }
  td.wrap-c{ white-space:normal; min-width:170px; max-width:280px; }
  .cli{ font-weight:600; color:var(--text); max-width:260px; overflow:hidden; text-overflow:ellipsis; display:block; }
  .mat{ color:var(--text-faint); font-size:12px; }

  .pill{ display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:100px; font-size:10.5px; font-weight:700; white-space:nowrap; }
  .st-0{ background:#EEF3F7; color:var(--text-mut); }
  .st-1{ background:var(--water-soft); color:var(--water); }
  .st-2{ background:#DCEBF7; color:var(--navy-3); }
  .st-3{ background:var(--leaf-soft); color:var(--leaf); }
  .st-4{ background:var(--rose-soft); color:var(--rose); }
  .st-5{ background:var(--amber-soft); color:var(--amber); }
  .st-6{ background:var(--violet-soft); color:var(--violet); }
  .tag{ display:inline-block; border-radius:6px; padding:2px 7px; font-size:10px; font-weight:700; letter-spacing:.02em; }
  .tag.top{ background:var(--navy); color:#fff; } .tag.b25{ background:var(--water-soft); color:var(--water); }
  .tag.amb{ background:linear-gradient(90deg,var(--navy) 50%,var(--water) 50%); color:#fff; }
  .sit-c{ color:var(--rose); font-weight:700; } .sit-a{ color:var(--leaf); font-weight:700; }
  .empty{ text-align:center; padding:32px 20px; color:var(--text-faint); font-size:13px; }
  .empty b{ display:block; font-family:var(--font-display); color:var(--navy); font-size:15px; margin-bottom:4px; }
  .more{ display:flex; justify-content:center; padding:12px; }

  .pipe{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .pipe button{ flex:1; min-width:118px; border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:10px 12px; text-align:left; transition:.15s; }
  .pipe button:hover{ border-color:var(--water); }
  .pipe button.on{ border-color:var(--navy); box-shadow:inset 0 0 0 1px var(--navy); background:var(--water-soft); }
  .pipe .pl{ font-size:11px; font-weight:700; color:var(--text-mut); display:block; }
  .pipe .pv{ font-family:var(--font-display); font-weight:800; font-size:19px; color:var(--navy); }

  .subtabs{ display:flex; gap:8px; margin:18px 0 0; flex-wrap:wrap; }
  .subtabs button{ padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-weight:700; font-size:12.5px; color:var(--text-mut); }
  .subtabs button.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .subtabs button.on .mat{ color:#BFE0F5; }
  .subtabs + *{ margin-top:14px; }

  /* casos */
  .cases{ display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px; }
  .case{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow-xs); display:flex; flex-direction:column; gap:9px; }
  .case.suc{ border-color:var(--leaf-line); box-shadow:inset 0 3px 0 var(--leaf); }
  .case .top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .case .top b{ font-family:var(--font-display); color:var(--navy); }
  .case .vals{ display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:13px; }
  .case .vals span{ color:var(--text-mut); display:block; font-size:11px; font-weight:700; }
  .case .vals b{ font-family:var(--font-display); font-size:14px; color:var(--navy); }
  .case .res{ font-size:13px; color:var(--text); background:var(--water-soft); border:1px solid var(--water-line); border-radius:12px; padding:10px 12px; white-space:pre-wrap; }
  .case .foot{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; font-size:12px; color:var(--text-faint); }
  .star{ color:var(--leaf); font-weight:700; font-size:11.5px; }

  /* PLR */
  .plr-tb td.c{ text-align:center; padding:5px 3px; }
  .cell{ display:block; border-radius:8px; padding:6px 6px; font-weight:700; font-size:12px; min-width:64px; border:none; width:100%; }
  .cell.ok{ background:var(--leaf-soft); color:var(--leaf); }
  .cell.no{ background:var(--rose-soft); color:var(--rose); }
  .cell.ju{ background:var(--water-soft); color:var(--water); }
  .cell.pe{ background:var(--amber-soft); color:var(--amber); }
  .cell.na{ background:#F3F6F9; color:var(--text-faint); font-weight:500; }
  button.cell:hover{ box-shadow:inset 0 0 0 2px rgba(10,42,67,.18); }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text-mut); margin:16px 0 12px; font-weight:600; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .sw{ width:12px; height:12px; border-radius:3px; display:inline-block; }

  /* modal */
  .ov{ position:fixed; inset:0; background:rgba(10,20,30,.55); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:999; }
  .modal{ background:var(--surface); border-radius:18px; width:100%; max-width:720px; box-shadow:var(--shadow-lg); }
  .modal.sm{ max-width:500px; }
  .mh{ padding:24px 26px 0; display:flex; align-items:flex-start; gap:12px; }
  .mh h3{ font-family:var(--font-display); font-size:16px; font-weight:800; color:var(--navy); margin:0 0 4px; }
  .mh p{ font-size:12.5px; color:var(--text-mut); }
  .mh .x{ margin-left:auto; background:none; border:none; color:var(--text-mut); font-size:22px; line-height:1; }
  .mb{ padding:16px 26px; }
  .mf{ padding:4px 26px 24px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .fgrid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .fgrid .full{ grid-column:1/-1; }
  @media(max-width:640px){ .fgrid{ grid-template-columns:1fr; } }
  .info-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px 14px; background:var(--water-soft); border:1px solid var(--water-line); border-radius:12px; padding:12px 14px; margin-bottom:16px; }
  .info-grid div span{ display:block; font-size:10.5px; color:var(--text-mut); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
  .info-grid div b{ font-size:13px; font-weight:600; color:var(--navy); }
  .hist{ font-size:12.5px; border-left:2px solid var(--water-line); padding-left:12px; display:flex; flex-direction:column; gap:6px; max-height:200px; overflow:auto; }
  .hist div span{ color:var(--text-faint); }
  .radio{ display:flex; gap:8px; }
  .radio label{ flex:1; border:1px solid var(--border); background:#FBFDFE; border-radius:10px; padding:10px 12px; display:flex; gap:8px; align-items:center; cursor:pointer; font-weight:700; font-size:12.5px; color:var(--text-mut); margin:0; }
  .radio label:has(input:checked){ background:var(--navy); color:#fff; border-color:var(--navy); }
  .radio input{ accent-color:var(--water); }
  .check{ display:flex; gap:10px; align-items:center; background:var(--leaf-soft); border:1px solid var(--leaf-line); color:var(--leaf); border-radius:10px; padding:10px 14px; font-weight:700; font-size:13px; cursor:pointer; }
  .check input{ width:17px; height:17px; accent-color:var(--leaf); }
  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:11px 18px; border-radius:12px; font-size:13px; font-weight:600; z-index:1000; box-shadow:var(--shadow-md); max-width:90vw; }
  .toast.err{ background:var(--rose); }
  .prog{ height:8px; background:var(--water-soft); border-radius:99px; overflow:hidden; margin:10px 0 0; }
  .prog i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--navy-3),var(--water)); transition:width .2s; }
  .upl{ display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:0 14px; }
  .upl .card p{ margin-bottom:12px; }
  .drop{ border:1.5px dashed var(--water-line); border-radius:12px; padding:14px; text-align:center; color:var(--water); font-weight:700; font-size:13px; background:var(--water-soft); cursor:pointer; display:block; transition:.15s; }
  .drop:hover{ border-color:var(--water); }
  .drop input{ display:none; }
  .plat{ display:flex; gap:14px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .plat .ic{ width:44px; height:44px; border-radius:12px; background:linear-gradient(160deg,var(--navy),var(--navy-3)); display:grid; place-items:center; color:#fff; flex-shrink:0; }
  .plat h3{ margin:0; }
  .plat p{ font-size:12.5px; color:var(--text-faint); }
  .plat .btn{ margin-left:auto; }
  .cadpes-k{ margin:0; grid-template-columns:1fr 1fr; }
  .cadpes-k .k:first-child{ grid-column:1/-1; }
  .acards{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px; }
  @media(max-width:900px){ .acards{ grid-template-columns:1fr; } }
  .acard{ text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; display:flex; flex-direction:column; gap:4px; transition:.15s; box-shadow:var(--shadow-xs); }
  .acard:hover{ border-color:var(--water); }
  .acard.on{ border-color:var(--navy); box-shadow:inset 0 0 0 1px var(--navy), var(--shadow-sm); background:linear-gradient(180deg,var(--water-soft),var(--surface) 70%); }
  .acard .at{ font-family:var(--font-display); font-weight:800; color:var(--navy); font-size:15px; }
  .acard .as{ font-size:12px; color:var(--text-mut); }
  .acard .an{ font-size:13px; color:var(--text); margin-top:6px; } .acard .an b{ font-family:var(--font-display); font-size:18px; color:var(--navy); }
  .acard .ap{ font-size:12px; color:var(--text-mut); font-weight:600; }
  .xb{ display:inline-block; border-radius:7px; padding:2px 7px; font-size:11px; font-weight:700; margin:1px 0; white-space:normal; }
  .xb1{ background:var(--navy); color:#fff; } .xb2{ background:var(--amber-soft); color:var(--amber); } .xb3{ background:var(--water-soft); color:var(--water); } .xb4{ background:var(--leaf-soft); color:var(--leaf); }
  .avatar{ border-radius:50%; object-fit:cover; flex-shrink:0; display:inline-block; vertical-align:middle; background:var(--water-soft); }
  .avatar.ini{ display:inline-grid; place-items:center; background:linear-gradient(160deg,var(--navy-3),var(--water)); color:#fff; font-family:var(--font-display); font-weight:800; }
  .pessoa{ display:inline-flex; align-items:center; gap:8px; font-weight:600; }
  .hero-id{ display:flex; gap:20px; align-items:center; }
  .time-strip{ display:flex; margin:2px 0 12px; flex-wrap:wrap; }
  .time-strip button{ border:none; background:none; padding:0; margin-right:-8px; border-radius:50%; transition:.15s; }
  .time-strip button .avatar{ box-shadow:0 0 0 2px var(--navy-2); }
  .time-strip button:hover{ transform:translateY(-3px); z-index:2; }
  .loading{ display:flex; align-items:center; gap:10px; color:var(--text-mut); padding:30px; justify-content:center; }
  .spin{ width:18px; height:18px; border:3px solid var(--water-soft); border-top-color:var(--water); border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login hidden">
  <div class="login-card">
    <div class="eyebrow"><span class="dot"></span>Águas do Rio · Grandes Clientes</div>
    <h1>Carteira Viva</h1>
    <p class="sub" id="lsub">Entre com seu e-mail e senha de acesso.</p>
    <div id="lmsg"></div>
    <form id="lform" onsubmit="return doLogin(event)">
      <div class="fld hidden" id="lexecW"><label>Seu nome</label><select id="lexec" onchange="sugEmail()"></select>
        <span class="help">Só aparecem executivos que ainda não criaram acesso.</span></div>
      <div class="fld"><label>E-mail</label><input id="lemail" type="email" autocomplete="username" placeholder="nome.sobrenome@gestaocarteira.local" required></div>
      <div class="fld"><label id="lpassLbl">Senha</label><input id="lpass" type="password" autocomplete="current-password" placeholder="Sua senha" required minlength="6"></div>
      <div class="fld hidden" id="lpass2W"><label>Confirme a senha</label><input id="lpass2" type="password" autocomplete="new-password" minlength="6"></div>
      <button class="btn full" id="lbtn" type="submit">Entrar</button>
    </form>
    <div style="display:flex;justify-content:space-between;margin-top:14px;gap:10px">
      <button class="link" id="ltoggle" onclick="toggleSignup()">Primeiro acesso? Criar minha conta</button>
      <button class="link" onclick="forgot()">Esqueci a senha</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appRoot" class="hidden">
  <div class="hero-wrap"><div class="hero-inner">
    <div class="eyebrow"><span class="dot"></span>Águas do Rio · Grandes Clientes · Carteira Viva</div>
    <div class="hero-top" id="hero"></div>
    <nav class="role-switch" id="nav"></nav>
    <div class="hero-foot"><span id="whoLine"></span><span id="viewAs"></span></div>
  </div></div>
  <main class="app" id="main"></main>
</div>

async function fetchAll(q){
  const out=[]; let from=0; const size=1000;
  while(true){ const {data,error}=await q().range(from,from+size-1); if(error) throw error; out.push(...data); if(data.length<size) break; from+=size; }
  return out;
}

  if(n.length) $('lemail').value=(n.length>1?n[0]+'.'+n[n.length-1]:n[0]).toLowerCase().replace(/[^a-z.]/g,'')+'@gestaocarteira.local';

async function doLogin(ev){
  ev.preventDefault();
  const email=$('lemail').value.trim().toLowerCase(), pass=$('lpass').value;
  const box=$('lmsg'); box.innerHTML=''; $('lbtn').disabled=true;
  try{
    if(signup){
      const exec=$('lexec').value;
      if(!exec) throw new Error('Selecione seu nome.');
      if(pass!==$('lpass2').value) throw new Error('As senhas não conferem.');
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{executivo:exec}}});
      if(error) throw error;
      if(!data.session){
        const r=await sb.auth.signInWithPassword({email,password:pass});
        if(r.error){ box.innerHTML='<div class="msg ok">Conta criada! A confirmação de e-mail está ligada no Supabase — peça para a gestão desligar "Confirm email".</div>'; toggleSignup(); return false; }
      }
    } else {
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw error;
    }
    await start();
  }catch(e){
    let m=e.message||String(e);
    if(/Invalid login/i.test(m)) m='E-mail ou senha incorretos.';
    if(/already registered/i.test(m)) m='Este e-mail já tem conta. Use "Já tenho conta" para entrar.';
    if(/Database error|não está autorizado|já tem acesso/i.test(m)) m='Não foi possível criar a conta: esse executivo já tem acesso ou o e-mail não está autorizado. Fale com a gestão (Day ou Tayene).';
    box.innerHTML=`<div class="msg err">${esc(m)}</div>`;
  } finally { $('lbtn').disabled=false; }
  return false;
}

  $('boot').classList.add('hidden');
  if(!session){ $('login').classList.remove('hidden'); $('appRoot').classList.add('hidden'); return; }
  S.user=session.user;
  const {data:me,error}=await sb.from('usuarios').select('*').eq('email',S.user.email.toLowerCase()).maybeSingle();
  if(error||!me){ $('login').classList.remove('hidden'); $('lmsg').innerHTML='<div class="msg err">Seu usuário não está ativo na Carteira Viva. Fale com a gestão.</div>'; await sb.auth.signOut(); return; }
  S.me=me; S.gestao=me.papel==='gestao'; S.validaPlr=!!me.valida_plr;
  if(S.user.user_metadata?.trocar_senha) S.trocarSenha=true;

  $('whoLine').innerHTML=esc((S.gestao?'Gestão · ':'')+me.nome+' · '+(me.email||''))+' · <button class="link" style="color:#BFE0F5" onclick="openTrocaSenha(false)">Trocar senha</button>';

  const h=location.hash.slice(1); if(h) S.tab=h;

  if(S.trocarSenha) openTrocaSenha(true);
}
async function loadAll(){
  const [acao,recup,just,plr,cargas,consumo]=await Promise.all([
    fetchAll(()=>sb.from('acao_base').select('*').order('saldo_vencido',{ascending:false,nullsFirst:false})),
    fetchAll(()=>sb.from('recuperacoes').select('*').order('criado_em',{ascending:false})),
    fetchAll(()=>sb.from('plr_justificativas').select('*').order('enviado_em',{ascending:false})),
    fetchAll(()=>sb.from('plr_resultados').select('*')),
    fetchAll(()=>sb.from('cargas').select('*').order('enviado_em',{ascending:false})),
    fetchAll(()=>sb.from('plr_consumo').select('*').order('competencia'))
  ]);
  Object.assign(S,{acao,recup,just,plr,cargas,consumo});
  if(S.gestao) S.usuarios=await fetchAll(()=>sb.from('usuarios').select('*').order('papel').order('nome'));
  try{ S.saldo=await fetchAll(()=>sb.from('saldo_contas').select('*').order('matricula')); }catch(_){ S.saldo=[]; }
  idxSaldo();
  try{ const fx=await fetchAll(()=>sb.from('fotos_executivos').select('executivo,foto')); S.fotos=Object.fromEntries(fx.map(f=>[f.executivo,f.foto])); }catch(_){ S.fotos={}; }
  S.loaded=true;
}
async function reload(part){
  if(part==='acao') S.acao=await fetchAll(()=>sb.from('acao_base').select('*').order('saldo_vencido',{ascending:false,nullsFirst:false}));
  else if(part==='recup') S.recup=await fetchAll(()=>sb.from('recuperacoes').select('*').order('criado_em',{ascending:false}));
  else if(part==='just') S.just=await fetchAll(()=>sb.from('plr_justificativas').select('*').order('enviado_em',{ascending:false}));
  else if(part==='plr') S.plr=await fetchAll(()=>sb.from('plr_resultados').select('*'));
  else if(part==='saldo'){ S.saldo=await fetchAll(()=>sb.from('saldo_contas').select('*').order('matricula')); idxSaldo(); }
  else if(part==='consumo') S.consumo=await fetchAll(()=>sb.from('plr_consumo').select('*').order('competencia'));
  else if(part==='cargas') S.cargas=await fetchAll(()=>sb.from('cargas').select('*').order('enviado_em',{ascending:false}));
  else if(part==='usuarios') S.usuarios=await fetchAll(()=>sb.from('usuarios').select('*').order('papel').order('nome'));
}
function execList(){
  const s=new Set(); S.acao.forEach(r=>r.executivo&&s.add(r.executivo)); S.plr.forEach(r=>s.add(r.executivo));
  S.usuarios.forEach(u=>u.executivo&&s.add(u.executivo)); return [...s].sort((a,b)=>a.localeCompare(b,'pt'));
}

}

}

function acaoFiltrada(){
  const f=S.f, q=norm(f.q);

    (!f.cross||(f.cross==='atuada'?emPlano(r.matricula):!emPlano(r.matricula)))&&
    (!q||norm(r.matricula).includes(q)||norm(r.cliente).includes(q))).sort((a,b)=>(+b.saldo_vencido||0)-(+a.saldo_vencido||0));
  return acaoDe(S.acaoSel).filter(r=>
    (!f.origem || r.origem===f.origem || (f.origem!=='TOP 100 + 2500' && r.origem==='TOP 100 + 2500')) &&
    (!f.sit || r.sit_ligacao===f.sit) && (!f.status || r.status===f.status) && (!f.perfil || r.perfil_pagamento===f.perfil) &&
    (!f.motivo || (f.motivo==='__sem'?!r.status_atuacao:r.status_atuacao===f.motivo)) &&

function lacTable(rows){

function opts(list,val,blank='—'){ const l=[...list]; if(val&&!l.includes(val)) l.unshift(val);

function autoStatus(r){
  if(['Em aprovação','Recuperado','Pagamento identificado','Finalizado'].includes(r.status)) return r.status;
  if(r.acao_id===3){
    const m=r.status_atuacao||'';
    if(m==='PAGO') return 'Pagamento identificado';
    if(r.fatura_antecipada==='Sim'||m==='FATURA ANTECIPADA') return 'Fatura antecipada';
    if(/INADIMPLENTE|CORTADO/.test(m)) return 'Em atuação';
    if(m||r.observacao) return 'Em atuação';
    return r.status;
  }
  if(r.acao_id===2){
    const m=r.status_atuacao||'';
    if(/^Pago|parcelamento realizado/i.test(m)) return 'Pagamento identificado';
    if(/Processo Judicial/i.test(m)) return 'Encaminhado jurídico';
    if(/Pagamento agendado/i.test(m)) return 'Acordo aceito';
    if(m||r.observacao||r.data_agendamento) return 'Em atuação';
    return r.status;
  }
  const ret=r.retorno_cliente||'', ac=r.acao_executivo||'';
  if(/Aceite/.test(ret)||/^Negociado/.test(ac)) return 'Acordo aceito';
  if(/Recusa/.test(ret)) return 'Proposta recusada';
  if(r.proposta||r.data_envio||r.estagio) return 'Proposta enviada';
  if(/Não Factível/i.test(r.revalidacao||'')&&!ac) return 'Não factível';
  if(/Cancelamento/.test(ac)) return 'Cancelamento de débito';
  if(/Juridica|Jurídica|Judicial/.test(ac)) return 'Encaminhado jurídico';
  if(ac||r.observacao) return r.status==='Não iniciado'?'Em atuação':r.status;
  return r.status;
}

async function saveAtuar(aid,mat){
  const r=S.acao.find(x=>x.acao_id===aid&&x.matricula===mat);
  const v=id=>$(id).value||null;
  if(aid===3){
    const fa=v('a_fa'), st3=v('a_lst');
    const upd3={status_atuacao:st3, fatura_antecipada: st3==='FATURA ANTECIPADA'?'Sim':fa, novo_vencimento:null, observacao:v('a_obs')};
    if(upd3.fatura_antecipada==='Sim'){ upd3.novo_vencimento=$('a_nv').value||null; if(!upd3.novo_vencimento){ toast('Informe a data do novo vencimento ajustado.',true); return; } }
    return gravarAtuacao(aid,mat,r,upd3);
  }
  const upd = aid===2 ? {status_atuacao:v('a_mot'),data_agendamento:v('a_ag'),observacao:v('a_obs')}
    : {acao_executivo:v('a_acao'),proposta:v('a_prop'),estagio:v('a_est'),retorno_cliente:v('a_ret'),
       data_envio:v('a_env'),prazo_retorno:v('a_pra'),revalidacao:v('a_rev'),observacao:v('a_obs')};
  return gravarAtuacao(aid,mat,r,upd);
}
async function gravarAtuacao(aid,mat,r,upd){
  const st=$('a_st').value;
  if(st==='__auto'){ upd.status=autoStatus({...r,...upd}); upd.status_origem = upd.status!==r.status?'plataforma':r.status_origem; }
  else { upd.status=st; upd.status_origem='manual'; }
  $('a_save').disabled=true;
  const {data,error}=await sb.from('acao_base').update(upd).eq('acao_id',aid).eq('matricula',mat).select().single();
  if(error){ toast('Erro ao salvar: '+error.message,true); $('a_save').disabled=false; return; }
  Object.assign(r,data); closeModal(); toast('Atuação salva · status: '+data.status); render();
}

async function loadCarteira(){
  const comps=compsDisponiveis(); if(!S.cart.comp) S.cart.comp=comps[0]||null;
  const key=S.cart.comp+'|'+execFoco(); if(!S.cart.comp||S.cart.loaded===key) return;

  const q=t=>()=>{ let x=sb.from(t).select('*').eq('competencia',c).order('id'); if(e) x=x.eq('executivo',e); return x; };
  const qh=()=>{ let x=sb.from('carteira_hist').select('matricula,cliente,executivo,curva,carteira,utilizacao,sit_ligacao,bairro').eq('competencia',c).order('matricula'); if(e) x=x.eq('executivo',e); return x; };
  const qb=()=>{ let x=sb.from('carteira_base').select('matricula,cliente,executivo,curva,carteira,utilizacao,sit_ligacao,bairro').order('matricula'); if(e) x=x.eq('executivo',e); return x; };
  let [fat,arr,con,base]=await Promise.all([fetchAll(q('cart_faturamento')),fetchAll(q('cart_arrecadacao')),fetchAll(q('cart_consumo')),fetchAll(qh)]);
  if(!base.length) base=await fetchAll(qb);
  S.cart.fat=fat; S.cart.arr=arr; S.cart.con=con; S.cart.base=Object.fromEntries(base.map(b=>[b.matricula,b])); S.cart.loaded=key;
}

function cartAgg(){
  const F=S.cart.fat, A=S.cart.arr, C=S.cart.con;
  const pagoMat={}; A.forEach(a=>pagoMat[a.matricula]=(pagoMat[a.matricula]||0)+(+a.valor||0));
  const conMat=Object.fromEntries(C.map(c=>[c.matricula,c]));
  const by={Pagou:{n:0,v:0},'A vencer':{n:0,v:0},Vencido:{n:0,v:0}};
  F.forEach(f=>{ const s=by[f.status]||(by[f.status]={n:0,v:0}); s.n++; s.v+=+f.faturamento||0; });
  const fatTot=F.reduce((s,f)=>s+(+f.faturamento||0),0), arrTot=A.reduce((s,a)=>s+(+a.valor||0),0);
  return {F,A,C,by,fatTot,arrTot,pagoMat,conMat};
}

function cartRows(){
  const g=cartAgg(), q=norm(S.cf.q), B=S.cart.base||{};
  let rows=g.F.map(f=>({...f, cliente:B[f.matricula]?.cliente, pago:g.pagoMat[f.matricula]||0, con:g.conMat[f.matricula]}));
  if(S.cf.st==='P12') rows=rows.filter(r=>r.con&&/Prioridade [12]/.test(r.con.prioridade));
  else if(S.cf.st==='VSEM') rows=rows.filter(r=>r.status==='Vencido'&&!emPlano(r.matricula));
  else if(S.cf.st==='VCOM') rows=rows.filter(r=>r.status==='Vencido'&&emPlano(r.matricula));
  else if(S.cf.st) rows=rows.filter(r=>r.status===S.cf.st);
  if(q) rows=rows.filter(r=>norm(r.matricula).includes(q)||norm(r.cliente).includes(q));
  const ord={Vencido:0,'A vencer':1,Pagou:2};
  return rows.sort((a,b)=>(ord[a.status]??3)-(ord[b.status]??3)||(+b.faturamento||0)-(+a.faturamento||0));
}

function caseCard(r){

  </div>`;

function matOptions(){
  const m=new Map();
  doExec(S.acao).forEach(r=>m.set(r.matricula,{c:r.cliente,u:r.utilizacao,e:r.executivo,s:r.sit_ligacao}));
  Object.values(S.cart.base||{}).forEach(b=>{ if(!m.has(b.matricula)&&(!execFoco()||b.executivo===execFoco())) m.set(b.matricula,{c:b.cliente,u:b.utilizacao,e:b.executivo,s:b.sit_ligacao}); });
  return m;
}

function parseMat(v){ const m=String(v||'').match(/\d{6,}/); return m?+m[0]:null; }
function recFill(){
  const m=parseMat($('r_mat').value); const o=m&&matOptions().get(m);
  if(o){ $('r_cli').value=o.c||''; $('r_uti').value=o.u||''; $('r_sol').value=o.e||execFoco()||S.me.executivo||''; }
  else if(!$('r_cli').value){ $('r_sol').value=S.me.executivo||execFoco()||''; }
}
const parseBR = v => { if(v==null||v==='') return null; const s=String(v).replace(/[^\d,.-]/g,''); const n=s.includes(',')?+s.replace(/\./g,'').replace(',','.'):+s; return isFinite(n)?n:null; };
function recDesc(){ const a=parseBR($('r_int').value), b=parseBR($('r_des').value);
  $('r_descH').textContent = (a>0&&b!=null)?`Desconto de ${money2(a-b)} (${pct(1-b/a)})`:''; }
async function saveRec(id){
  const m=parseMat($('r_mat').value), o=matOptions().get(m);
  const msg=t=>$('r_msg').innerHTML=`<div class="msg err">${t}</div>`;
  if(!m) return msg('Informe a matrícula.');
  const exec=$('r_sol').value||o?.e;
  if(!exec) return msg('Não encontrei o executivo desta matrícula. Escolha uma matrícula da sua carteira.');
  const rec={matricula:m,cliente:$('r_cli').value||null,utilizacao:$('r_uti').value||null,executivo:exec,
    tipo_pagamento:document.querySelector('input[name=r_tp]:checked').value,
    parcelas:document.querySelector('input[name=r_tp]:checked').value==='Parcelado'?(+$('r_par').value||null):null,
    saldo_integral:parseBR($('r_int').value),saldo_desconto:parseBR($('r_des').value),resumo:$('r_res').value.trim()||null,caso_sucesso:$('r_suc').checked};
  if(rec.saldo_integral==null||rec.saldo_desconto==null) return msg('Preencha o saldo integral e o saldo com desconto.');
  if(rec.saldo_desconto>rec.saldo_integral) return msg('O saldo com desconto não pode ser maior que o saldo integral.');
  if(!rec.resumo) return msg('Escreva o resumo da negociação.');
  $('r_save').disabled=true;
  const {error}= id ? await sb.from('recuperacoes').update(rec).eq('id',id) : await sb.from('recuperacoes').insert(rec);
  if(error){ $('r_save').disabled=false; return msg(esc(error.message)); }
  closeModal(); toast(id?'Recuperação atualizada':'Recuperação enviada para aprovação da gestão');
  await Promise.all([reload('recup'),reload('acao')]); S.rtab='minhas'; render();
}
async function delRec(id){ if(!confirm('Excluir esta recuperação pendente?')) return;
  const {error}=await sb.from('recuperacoes').delete().eq('id',id); if(error) return toast(error.message,true);
  closeModal(); await reload('recup'); render(); }
async function toggleSucesso(id){ const r=S.recup.find(x=>x.id===id);
  const {error}=await sb.from('recuperacoes').update({caso_sucesso:!r.caso_sucesso}).eq('id',id); if(error) return toast(error.message,true);
  r.caso_sucesso=!r.caso_sucesso; render(); }

const extClients={};
function extOk(k){ const c=INTEGRACOES[k]; return !!(c.supabaseUrl&&c.key&&c.tabela); }
async function extFetch(k,{todos=false}={}){
  const c=INTEGRACOES[k]; if(!extOk(k)) return null;
  extClients[k] ||= supabase.createClient(c.supabaseUrl,c.key,{auth:{persistSession:false,storageKey:'ext-'+k}});
  const e=todos?'':execFoco();
  if(c.rpc) return fetchAll(()=>extClients[k].rpc(c.rpc,{p_executivo:e||null}));
  return fetchAll(()=>{ let q=extClients[k].from(c.tabela).select(c.select||'*').order(c.colData,{ascending:false}); if(e) q=q.eq(c.colExecutivo,e); return q; });
}
async function extCarteira(k){
  const c=INTEGRACOES[k]; if(!c.rpcCarteira) return null; const e=execFoco();
  extClients[k] ||= supabase.createClient(c.supabaseUrl,c.key,{auth:{persistSession:false,storageKey:'ext-'+k}});
  return fetchAll(()=>extClients[k].rpc(c.rpcCarteira,{p_executivo:e||null}));
}
/* Pesquisa: mesma conta da plataforma (cada matrícula adicional conta 1; meta ajustada = meta − impossibilidades validadas) */
const TIPO_IMPOSS='Não foi possível realizar a pesquisa';
const qtdMat = r => 1 + String(r.matriculas_adicionais||'').split(/[,\s]+/).filter(Boolean).length;
async function extMetasPesq(){
  const c=INTEGRACOES.pesquisa; if(!c.rpcMetas&&!c.tabelaMetas) return [];
  extClients.pesquisa ||= supabase.createClient(c.supabaseUrl,c.key,{auth:{persistSession:false,storageKey:'ext-pesquisa'}});
  const {data,error}=c.rpcMetas?await extClients.pesquisa.rpc(c.rpcMetas):await extClients.pesquisa.from(c.tabelaMetas).select('*'); if(error) throw error; return data||[];
}
const IND_MENSAL=['arrecadacao','consumo'];
function pesqResumo(rows,metaQtd){
  const env=rows.reduce((s,r)=>s+qtdMat(r),0), resp=rows.filter(r=>r.status!=='pendente').reduce((s,r)=>s+qtdMat(r),0);
  const val=rows.filter(r=>r.status==='validado'), comNota=val.filter(r=>r.nota_atendimento!=null);
  const valNota=comNota.reduce((s,r)=>s+qtdMat(r),0), imp=val.filter(r=>r.tipo===TIPO_IMPOSS).reduce((s,r)=>s+qtdMat(r),0);
  const metaAj=metaQtd!=null?Math.max(0,metaQtd-imp):null, nota=comNota.length?comNota.reduce((s,r)=>s+(+r.nota_atendimento),0)/comNota.length:null;
  const total=valNota+imp, falta=metaQtd!=null?Math.max(0,metaQtd-total):null, pctM=metaQtd?total/metaQtd:null;
  return {env,resp,valNota,imp,total,falta,pctM,meta:metaQtd,metaAj,nota,aguard:rows.filter(r=>r.status==='aguardando_validacao').reduce((s,r)=>s+qtdMat(r),0)};
}

const META_PESQUISA_EXEC = 292;    // meta de pesquisas por executivo
const META_PESQUISA_TIME = 5542;   // meta do time (PLR)
const META_CADASTRAL = 1;          // atualizar 100% da carteira
async function afterCadPes(){
  for(const k of ['cadastral','pesquisa']){
    if(!extOk(k)) continue; const box=$('ext_'+k);
    try{
      const e=execFoco(); let html='';
      if(k==='cadastral'){
        const cart=await extCarteira(k)||[], n=cart.length, cnt=s=>cart.filter(r=>r.status_fluxo===s).length;
        const at=cnt('cadastro_atualizado'), pend=cnt('pendente_tratamento'), os=cnt('aguardando_execucao_os'), ju=cnt('aguardando_validacao_justificativa');
        const p=n?at/n:0, ok=p>=META_CADASTRAL;
        html=`<div class="kpis cadpes-k">
          <div class="k ${ok?'c3':'c2'}"><div class="l">Meta: carteira 100% atualizada</div><div class="v">${n?pct(p,0):'—'}</div><div class="s">${int(at)} de ${int(n)} matrículas · faltam ${int(n-at)}</div>${barra(at,n,ok?'var(--leaf)':'var(--water)')}</div>
          <div class="k c4"><div class="l">Pendentes de tratamento</div><div class="v">${int(pend)}</div><div class="s">ainda sem atuação</div></div>
          <div class="k c5"><div class="l">Aguardando</div><div class="v">${int(os+ju)}</div><div class="s">${int(os)} execução de OS · ${int(ju)} validação de justificativa</div></div></div>`;
      } else {
        const rows=await extFetch(k)||[];
        const meta = e ? META_PESQUISA_EXEC : META_PESQUISA_TIME;
        const R=pesqResumo(rows,meta), p=R.pctM||0;
        html=`<div class="kpis cadpes-k">
          <div class="k ${p>=1?'c3':'c2'}"><div class="l">Meta de pesquisas (${int(meta)})</div><div class="v">${pct(p,0)}</div><div class="s">${int(R.valNota)} validadas + ${int(R.imp)} não respondidas = ${int(R.total)} · faltam ${int(R.falta)}</div>${barra(R.total,meta,p>=1?'var(--leaf)':'var(--water)')}</div>
          <div class="k c2"><div class="l">Enviadas / respondidas</div><div class="v">${int(R.env)}</div><div class="s">${int(R.resp)} respondidas · ${int(R.aguard)} aguard. validação</div></div>
          <div class="k c5"><div class="l">Nota média</div><div class="v">${R.nota!=null?nf(R.nota,1)+' ★':'—'}</div><div class="s">das pesquisas validadas</div></div></div>`;
      }
      if(box&&S.tab==='cadpes') box.innerHTML=html;
    }catch(err){ if(box) box.innerHTML = /cv_|function|permission|schema cache/i.test(err.message||'')
        ? `<div class="msg err">A leitura ainda não foi liberada.${S.gestao?' Rode o arquivo <b>5_rodar_no_supabase_da_ATUALIZACAO_CADASTRAL.sql</b> no Supabase da Atualização Cadastral.':' A gestão está liberando o acesso.'}<br><span class="mat">${esc(err.message)}</span></div>`
        : `<div class="msg err">Não foi possível ler a plataforma: ${esc(err.message)}</div>`; }
  }
}

/* =====================================================================

function plrRow(e,c,i){ return S.plr.find(r=>r.executivo===e&&r.competencia===c&&r.indicador===i); }
function plrJust(e,c,i){ return S.just.find(j=>j.executivo===e&&j.competencia===c&&j.indicador===i&&j.status!=='Rejeitada') || S.just.find(j=>j.executivo===e&&j.competencia===c&&j.indicador===i); }
function consRow(e,c){ return S.consumo.find(r=>r.executivo===e&&r.competencia===c); }
const consMeta = r => Math.max(150, +r.meta_prioridade||0);
function plrSt(e,c,i){
  if(i==='consumo'){ const r=consRow(e,c);
    if(r){ if(r.status==='Aprovado') return {st:'ok',r};
      if(r.status==='Justificado') return {st:'ju',r,j:{status:'Aprovada',motivo:r.motivo||'Justificado na planilha',descricao:null}};
      const j=plrJust(e,c,i); if(j?.status==='Aprovada') return {st:'ju',r,j}; if(j?.status==='Pendente') return {st:'pe',r,j};
      return {st:'no',r,j}; } }
  const r=plrRow(e,c,i); if(!r||r.realizado==null||r.meta==null) return {st:'na',r};
  if(+r.realizado>=+r.meta) return {st:'ok',r};
  const j=plrJust(e,c,i);
  if(j?.status==='Aprovada') return {st:'ju',r,j}; if(j?.status==='Pendente') return {st:'pe',r,j};
  return {st:'no',r,j};
}
function plrVal(r){ if(r&&r.p1!==undefined) return `${int(r.analise_geral||0)}/${int(consMeta(r))}`; if(!r||r.realizado==null) return '—'; return r.unidade==='qtd'?`${int(r.realizado)}/${int(r.meta)}`:pct(r.realizado); }
function plrMonths(){ const y=String(S.plrAno); const ms=[...new Set([...S.plr,...S.consumo].filter(r=>r.competencia.startsWith(y)).map(r=>r.competencia))];
  const cur=nowComp(); for(let m=1;m<=12;m++){ const c=y+'-'+String(m).padStart(2,'0'); if(c<=cur&&!ms.includes(c)) ms.push(c); } return ms.sort(); }
function plrResumo(e){
  const y=String(S.plrAno); let ok=0,n=0;
  const keys=new Set([...S.plr.map(r=>r.executivo+'|'+r.competencia+'|'+r.indicador),...S.consumo.map(r=>r.executivo+'|'+r.competencia+'|consumo')]);
  keys.forEach(k=>{ const [ex,c,i]=k.split('|'); if(!c.startsWith(y)||(e&&ex!==e)) return; const s=plrSt(ex,c,i).st; if(s==='na') return; n++; if(s==='ok'||s==='ju') ok++; });
  return {ok,n};
}
function plrCell(e,c,i){
  const {st,r,j}=plrSt(e,c,i);
  const lbl={ok:'✓',no:'✗',ju:'justificado',pe:'em análise',na:''}[st];
  const txt = st==='na'?'—':`${plrVal(r)} <span style="font-size:11px">${lbl}</span>`;
  const can = S.gestao || (st==='no'||st==='pe'||st==='ju');
  return can?`<button class="cell ${st}" onclick="plrClick('${esc(e)}','${c}','${i}')">${txt}</button>`:`<span class="cell ${st}">${txt}</span>`;
}

  <div class="sec-h" style="margin-top:22px"><div><h2 style="font-size:18px">Justificativas de não atingimento</h2><p>Validadas e aprovadas por Tayene ou Day</p></div></div>
  ${J.length?`<div class="scroll"><table><thead><tr><th>Mês</th>${S.gestao&&!execFoco()?'<th>Executivo</th>':''}<th>Indicador</th><th>Motivo</th><th>Descrição</th><th>Status</th><th>Parecer</th></tr></thead><tbody>
    ${J.map(j=>`<tr><td>${compLbl(j.competencia)}</td>${S.gestao&&!execFoco()?`<td>${pessoa(j.executivo)}</td>`:''}<td>${IND[j.indicador]?.nome||j.indicador}</td><td>${esc(j.motivo)}</td><td class="wrap-c">${esc(j.descricao||'—')}</td>
      <td><span class="pill ${j.status==='Aprovada'?'st-3':j.status==='Rejeitada'?'st-4':'st-5'}">${j.status}</span></td><td class="wrap-c">${esc(j.parecer||'')}${j.validado_por?`<br><span class="mat">${esc(j.validado_por)} · ${fdate(j.validado_em)}</span>`:''}</td></tr>`).join('')}</tbody></table></div>`
  :'<div class="card empty"><b>Nenhuma justificativa enviada</b>Quando uma meta não for atingida, clique na célula vermelha para justificar.</div>'}`;
}
function fonteInd(k){ if(k==='consumo'&&S.consumo.length) return 'Planilha PLR Consumo Estratégico · total analisado / meta do mês'; const s=new Set(S.plr.filter(r=>r.indicador===k&&r.fonte).map(r=>r.fonte)); return s.size?[...s].join(', '):({cadastral:'Plataforma de Atualização Cadastral',pesquisa:'Plataforma de Pesquisa de Satisfação',arrecadacao:'Painel Time',consumo:'Planilha de Consumo Estratégico'}[k]); }
function plrClick(e,c,i){
  const {st,r,j}=plrSt(e,c,i), mine=!S.gestao||e===S.me.executivo;
  const isC = r&&r.p1!==undefined;
  const head=`<div class="mh"><div><h3>${IND[i].nome} · ${compLbl(c)}</h3><p>${esc(e)} · ${isC?`total analisado ${plrVal(r)}`:`realizado ${plrVal(r)}${r?.meta!=null?` · meta ${r.unidade==='qtd'?int(r.meta):pct(r.meta,0)}`:''}`}</p></div><button class="x" onclick="closeModal()">×</button></div>`;
  let body=isC?consumoMesHTML(r):'', foot='';
  if(j) body+=`<div class="msg ${j.status==='Aprovada'?'ok':j.status==='Rejeitada'?'err':'info'}">Justificativa <b>${j.status.toLowerCase()}</b>: ${esc(j.motivo)}${j.descricao?' — '+esc(j.descricao):''}${j.parecer?`<br>Parecer: ${esc(j.parecer)}`:''}</div>`;
  if((st==='no') && (mine||S.gestao)){
    body+=`<div class="fld"><label>Motivo do não atingimento</label><select id="j_mot">${MOTIVOS_PLR.map(m=>`<option>${m}</option>`).join('')}</select></div>
      <div class="fld"><label>Descreva a justificativa</label><textarea id="j_desc" rows="4" placeholder="Ex.: férias de 10 a 24/10; alinhado com a gestão em…"></textarea></div><div id="j_msg"></div>`;
    foot+=`<button class="btn" onclick="sendJust('${esc(e)}','${c}','${i}')">Enviar justificativa</button>`;
  }
  if(S.gestao&&!isC){
    body+=`<h3 style="font-family:var(--font-display);font-size:14.5px;margin:12px 0 8px">Ajustar resultado (gestão)</h3><div class="fgrid">
      <div class="fld"><label>Realizado ${r?.unidade==='qtd'||IND[i].un==='qtd'?'(qtd)':'(%)'}</label><input id="p_real" inputmode="decimal" value="${r?.realizado!=null?(r.unidade==='pct'?nf(r.realizado*100,2):r.realizado):''}"></div>
      <div class="fld"><label>Meta ${r?.unidade==='qtd'||IND[i].un==='qtd'?'(qtd)':'(%)'}</label><input id="p_meta" inputmode="decimal" value="${r?.meta!=null?(r.unidade==='pct'?nf(r.meta*100,2):r.meta):''}"></div></div>`;
    foot+=`<button class="btn sec" onclick="savePlrCell('${esc(e)}','${c}','${i}')">Salvar resultado</button>`;
  }
  modal(`<div class="modal ${isC?'':'sm'}">${head}<div class="mb">${body||'<p class="mat">Meta atingida.</p>'}</div><div class="mf"><button class="btn sec" onclick="closeModal()">Fechar</button>${foot}</div></div>`);
}
async function sendJust(e,c,i){
  const rec={executivo:e,competencia:c,indicador:i,motivo:$('j_mot').value,descricao:$('j_desc').value.trim()||null};
  if(!rec.descricao){ $('j_msg').innerHTML='<div class="msg err">Descreva a justificativa.</div>'; return; }
  const {error}=await sb.from('plr_justificativas').insert(rec);
  if(error){ $('j_msg').innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
  closeModal(); toast('Justificativa enviada para validação'); await reload('just'); render();
}
async function savePlrCell(e,c,i){
  const un=plrRow(e,c,i)?.unidade||IND[i].un, k=un==='pct'?100:1;
  const re=parseBR($('p_real').value), me=parseBR($('p_meta').value);
  const {error}=await sb.from('plr_resultados').upsert({executivo:e,competencia:c,indicador:i,unidade:un,realizado:re==null?null:re/k,meta:me==null?null:me/k,fonte:plrRow(e,c,i)?.fonte||'Ajuste manual',atualizado_em:new Date().toISOString()});
  if(error) return toast(error.message,true);
  closeModal(); await reload('plr'); render();
}

/* =====================================================================
   APROVAÇÕES (gestão)
   ===================================================================== */
function viewAprov(){
  const R=doExec(S.recup).filter(r=>r.status==='Pendente'), J=doExec(S.just).filter(j=>j.status==='Pendente');
  const hist=doExec(S.recup).filter(r=>r.status!=='Pendente').slice(0,12);
  return `<div class="sec-h"><div><h2>Aprovações</h2><p>Recuperação de cortados e justificativas de PLR</p></div></div>
  <div class="card"><h3>Recuperações de cortados pendentes <small>${R.length}</small></h3>
  ${R.length?`<div class="cases">${R.map(r=>`<div class="case ${r.caso_sucesso?'suc':''}">${caseCard(r).replace(/^<div class="case[^>]*>/,'').replace(/<div class="foot">[\s\S]*$/,'')}
    <div class="fld" style="margin:4px 0 0"><label>Data de religação</label><input type="date" id="dr_${r.id}"></div>
    <div class="fld" style="margin:0"><label>Observação / motivo (obrigatório para rejeitar)</label><input id="mr_${r.id}" placeholder="Opcional na aprovação"></div>
    <div style="display:flex;gap:8px"><button class="btn ok sm" onclick="decRec(${r.id},'Aprovado')">✓ Aprovar</button><button class="btn bad sm" onclick="decRec(${r.id},'Rejeitado')">✗ Rejeitar</button>
      <label style="margin-left:auto;font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="sr_${r.id}" ${r.caso_sucesso?'checked':''}> ★ case de sucesso</label></div></div>`).join('')}</div>`
    :'<div class="empty"><b>Nada pendente</b>Todas as recuperações foram decididas.</div>'}</div>
  ${S.validaPlr?`<div class="card"><h3>Justificativas de PLR pendentes <small>${J.length}</small></h3>
  ${J.length?`<div class="scroll"><table><thead><tr><th>Executivo</th><th>Mês</th><th>Indicador</th><th>Resultado</th><th>Motivo</th><th>Descrição</th><th>Parecer</th><th></th></tr></thead><tbody>
    ${J.map(j=>`<tr><td>${pessoa(j.executivo)}</td><td>${compLbl(j.competencia)}</td><td>${IND[j.indicador]?.nome}</td><td>${plrVal(plrRow(j.executivo,j.competencia,j.indicador))}</td><td>${esc(j.motivo)}</td><td class="wrap-c">${esc(j.descricao||'')}</td>
      <td><input id="pj_${j.id}" class="sel" style="width:180px" placeholder="Parecer"></td>
      <td style="display:flex;gap:6px"><button class="btn ok sm" onclick="decJust(${j.id},'Aprovada')">Aprovar</button><button class="btn bad sm" onclick="decJust(${j.id},'Rejeitada')">Rejeitar</button></td></tr>`).join('')}</tbody></table></div>`
    :'<div class="empty"><b>Nenhuma justificativa pendente</b></div>'}</div>`:''}
  ${hist.length?`<div class="card"><h3>Decididas recentemente</h3><div class="scroll"><table><thead><tr><th>Cliente</th><th>Executivo</th><th>Status</th><th>Religação</th><th>Por</th><th>Em</th></tr></thead><tbody>
    ${hist.map(r=>`<tr><td><span class="cli">${esc(r.cliente||'')}</span><span class="mat">${r.matricula}</span></td><td>${pessoa(r.executivo)}</td><td><span class="pill ${r.status==='Aprovado'?'st-3':'st-4'}">${r.status}</span></td><td>${fdate(r.data_religacao)}</td><td>${esc(r.aprovador||'')}</td><td>${fdt(r.decidido_em)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
}
async function decRec(id,st){
  const dr=$('dr_'+id).value||null, mo=$('mr_'+id).value.trim()||null, suc=$('sr_'+id).checked;
  if(st==='Aprovado'&&!dr) return toast('Informe a data de religação para aprovar.',true);
  if(st==='Rejeitado'&&!mo) return toast('Informe o motivo da rejeição.',true);
  const {error}=await sb.from('recuperacoes').update({status:st,data_religacao:dr,motivo_rejeicao:st==='Rejeitado'?mo:null,caso_sucesso:suc,aprovador:S.me.nome}).eq('id',id);
  if(error) return toast(error.message,true);
  toast(st==='Aprovado'?'Recuperação aprovada · status da matrícula: Recuperado':'Recuperação rejeitada');
  await Promise.all([reload('recup'),reload('acao')]); render();
}
async function decJust(id,st){
  const p=$('pj_'+id).value.trim()||null;
  if(st==='Rejeitada'&&!p) return toast('Escreva o parecer para rejeitar.',true);
  const {error}=await sb.from('plr_justificativas').update({status:st,parecer:p,validado_por:S.me.nome,validado_em:new Date().toISOString()}).eq('id',id);
  if(error) return toast(error.message,true);
  toast('Justificativa '+st.toLowerCase()); await reload('just'); render();
}
</script>

<script>
/* =====================================================================
   CONSUMO ESTRATÉGICO · números do mês
   ===================================================================== */
function consCalc(r){
  const meta=+r.meta_prioridade||0, an=+r.prioridade_analisado||0, geral=+r.analise_geral||0;
  const metaMes=Math.max(150,meta), faltaP12=Math.max(0,-(+r.delta_prioridade||0)), faltaTotal=Math.max(0,150-geral);
  const p3=Math.max(0,geral-an), p3nec=Math.max(0,150-meta);
  return {meta,an,geral,metaMes,faltaP12,faltaTotal,p3,p3nec,prod:r.produtividade!=null?+r.produtividade:(meta?an/meta:null)};
}
function barra(v,m,cor){ const p=m?Math.min(1,v/m):0; return `<div class="bar" style="height:8px;background:var(--water-soft);border-radius:99px;overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:${(p*100).toFixed(0)}%;background:${cor};border-radius:99px"></i></div>`; }
function stPillC(r){ return `<span class="pill ${r.status==='Aprovado'?'st-3':r.status==='Justificado'?'st-1':'st-4'}">${r.status}</span>`; }
function consumoMesHTML(r){
  const k=consCalc(r);
  return `<div class="kpis" style="margin:0 0 14px;grid-template-columns:repeat(3,1fr)">
    <div class="k ${k.faltaP12?'c4':'c3'}"><div class="l">Prioridade 1 e 2 (obrigatório 100%)</div><div class="v">${int(k.an)} / ${int(k.meta)}</div><div class="s">P1 ${int(r.p1)} · P2 ${int(r.p2)} · ${k.faltaP12?`faltaram ${int(k.faltaP12)}`:'todas feitas ✓'}</div>${barra(k.an,k.meta,k.faltaP12?'var(--rose)':'var(--leaf)')}</div>
    <div class="k ${k.faltaTotal?'c4':'c3'}"><div class="l">Total analisado (mínimo 150)</div><div class="v">${int(k.geral)} / 150</div><div class="s">${k.faltaTotal?`faltaram ${int(k.faltaTotal)}`:`${int(r.delta_meta150)} acima do mínimo ✓`}</div>${barra(k.geral,150,k.faltaTotal?'var(--rose)':'var(--leaf)')}</div>
    <div class="k c2"><div class="l">Prioridade 3 (compensação)</div><div class="v">${int(k.p3)}</div><div class="s">${k.p3nec?`precisava de pelo menos ${int(k.p3nec)} P3`:'P1+P2 já passam de 150: P3 não obrigatória'}</div>${k.p3nec?barra(k.p3,k.p3nec,'var(--water)'):''}</div>
  </div>
  <p style="font-size:13px;color:var(--text-mut)">Meta do mês: <b>${int(k.metaMes)}</b> análises, com 100% das P1 e P2 · Produtividade P1+P2: <b>${pct(k.prod,0)}</b> · Resultado: ${stPillC(r)}${r.motivo?` <span class="mat">(${esc(r.motivo)})</span>`:''}</p>`;
}
const COMO_FUNCIONA=`<div class="msg info" style="margin:0 0 14px"><b>Como funciona a meta:</b> todo mês é obrigatório analisar <b>100% das Prioridades 1 e 2</b> e chegar a no mínimo <b>150 análises</b> no total.
  Se P1+P2 somarem menos que 150, a diferença é completada com <b>Prioridade 3</b>. Se P1+P2 passarem de 150, é preciso fazer <b>todas</b> elas (a meta do mês vira P1+P2).
  Elegível ao PLR quem bate a meta em todos os meses que contam (meses justificados não entram na conta).</div>`;
function consElegib(e){
  const rs=S.consumo.filter(r=>r.executivo===e&&r.competencia.startsWith(String(S.plrAno)));
  const st=rs.map(r=>plrSt(e,r.competencia,'consumo').st), ok=st.filter(s=>s==='ok').length, ju=st.filter(s=>s==='ju').length, base=st.length-ju;
  return {ok,ju,base,n:st.length,pctA:base?ok/base:null,eleg:base>0&&ok===base};
}
function consumoExecHTML(e){
  const rs=S.consumo.filter(r=>r.executivo===e&&r.competencia.startsWith(String(S.plrAno)));
  if(!rs.length) return '';
  const ult=rs.at(-1), el=consElegib(e);
  return `<div class="card"><h2>Consumo Estratégico · seus números</h2><p class="sub" style="margin-bottom:14px">Último mês: ${compLbl(ult.competencia)} · aprovação no ano <b>${pct(el.pctA,0)}</b> (${el.ok} de ${el.base} meses que contam${el.ju?`, ${el.ju} justificado(s)`:''}) · ${el.eleg?'<span class="pill st-3">Elegível ao PLR</span>':'<span class="pill st-4">Não elegível ao PLR</span>'}</p>
    ${COMO_FUNCIONA}${consumoMesHTML(ult)}</div>
  <div class="card"><h3>Mês a mês</h3>${consTabela(rs,false)}</div>`;
}
function consTabela(rs,comExec){
  return `<div class="scroll"><table><thead><tr>${comExec?'<th>Executivo</th>':'<th>Mês</th>'}<th class="r">P1</th><th class="r">P2</th><th class="r">Meta P1+P2</th><th class="r">P1+P2 feitas</th><th class="r">Faltaram P1+P2</th><th class="r">Produtiv.</th><th class="r">P3 feitas</th><th class="r">Total analisado</th><th class="r">Meta do mês</th><th class="r">Δ mínimo 150</th><th>Resultado</th></tr></thead><tbody>
    ${rs.map(r=>{ const k=consCalc(r); const e=r.executivo, c=r.competencia;
      return `<tr style="cursor:pointer" onclick="plrClick('${esc(e)}','${c}','consumo')">${comExec?`<td>${pessoa(e)}</td>`:`<td><b>${compLbl(c)}</b></td>`}
      <td class="r">${int(r.p1)}</td><td class="r">${int(r.p2)}</td><td class="r">${int(k.meta)}</td><td class="r">${int(k.an)}</td>
      <td class="r" style="color:${k.faltaP12?'var(--rose)':'var(--leaf)'};font-weight:700">${k.faltaP12?'-'+int(k.faltaP12):'0'}</td>
      <td class="r">${pct(k.prod,0)}</td><td class="r">${int(k.p3)}</td><td class="r"><b>${int(k.geral)}</b></td><td class="r">${int(k.metaMes)}</td>
      <td class="r" style="color:${(+r.delta_meta150||0)<0?'var(--rose)':'var(--leaf)'};font-weight:700">${(+r.delta_meta150||0)>0?'+':''}${int(r.delta_meta150)}</td>
      <td>${(()=>{ const s=plrSt(e,c,'consumo').st; return s==='ok'?'<span class="pill st-3">Aprovado</span>':s==='ju'?'<span class="pill st-1">Justificado</span>':s==='pe'?'<span class="pill st-5">Justif. em análise</span>':'<span class="pill st-4">Reprovado</span>'; })()}</td></tr>`;}).join('')}
  </tbody></table></div>`;
}
S.consMes=null;
function consumoTimeHTML(){
  const y=String(S.plrAno), meses=[...new Set(S.consumo.filter(r=>r.competencia.startsWith(y)).map(r=>r.competencia))].sort();
  if(!meses.length) return '<div class="card empty"><b>Sem dados de Consumo Estratégico</b>Anexe a planilha PLR Consumo Estratégico em Gestão › Cargas.</div>';
  const m=meses.includes(S.consMes)?S.consMes:meses.at(-1);
  const rs=S.consumo.filter(r=>r.competencia===m).sort((a,b)=>(+b.analise_geral||0)-(+a.analise_geral||0));
  const st=rs.map(r=>plrSt(r.executivo,m,'consumo').st);
  const execs=[...new Set(S.consumo.filter(r=>r.competencia.startsWith(y)).map(r=>r.executivo))];
  const eleg=execs.filter(x=>consElegib(x).eleg).length;
  return `<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start"><div><h2>Consumo Estratégico · números do time</h2><p class="sub">Clique numa linha para ver o detalhe do executivo no mês.</p></div>
    <select class="sel" onchange="S.consMes=this.value;render()">${meses.map(x=>`<option value="${x}" ${x===m?'selected':''}>${compLbl(x)}</option>`).join('')}</select></div>
    <div class="kpis">
      <div class="k"><div class="l">Executivos no mês</div><div class="v">${rs.length}</div></div>
      <div class="k c3"><div class="l">Bateram a meta</div><div class="v">${st.filter(s=>s==='ok').length}</div></div>
      <div class="k c4"><div class="l">Não bateram</div><div class="v">${st.filter(s=>s==='no'||s==='pe').length}</div></div>
      <div class="k c2"><div class="l">Justificados</div><div class="v">${st.filter(s=>s==='ju').length}</div></div>
      <div class="k c5"><div class="l">Elegíveis ao PLR (ano)</div><div class="v">${eleg} / ${execs.length}</div><div class="s">${execs.length?pct(eleg/execs.length,0):'—'} de elegibilidade</div></div>
    </div>
    <div style="margin-top:16px">${COMO_FUNCIONA}</div>${consTabela(rs,true)}</div>
  <div class="card"><h3>Aprovação no ano por executivo</h3><div class="scroll"><table><thead><tr><th>Executivo</th><th class="r">Aprovados</th><th class="r">Justificados</th><th class="r">Meses que contam</th><th class="r">% aprovação</th><th>Elegibilidade PLR</th></tr></thead><tbody>
    ${execs.sort().map(x=>{ const el=consElegib(x); return `<tr><td><button class="link pessoa" onclick="setVer('${esc(x)}')">${av(x,28)}<span>${esc(x)}</span></button></td><td class="r">${el.ok}</td><td class="r">${el.ju}</td><td class="r">${el.base}</td><td class="r"><b>${pct(el.pctA,0)}</b></td><td>${el.eleg?'<span class="pill st-3">Elegível</span>':'<span class="pill st-4">Não elegível</span>'}</td></tr>`; }).join('')}
  </tbody></table></div></div>`;
}
</script>

<script>
/* =====================================================================
   PLR · Atualização Cadastral e Pesquisa (metas acumuladas)
   ===================================================================== */
S.extCache={};
async function extDados(){
  const e=execFoco(), key=e||'*', c=S.extCache[key];
  if(c && Date.now()-c.t<5*60*1000) return c;
  const out={t:Date.now(),cart:null,pesq:null,erroCart:null,erroPesq:null};
  await Promise.all([
    (async()=>{ try{ if(extOk('cadastral')) out.cart=await extCarteira('cadastral'); }catch(err){ out.erroCart=err.message; } })(),
    (async()=>{ try{ if(extOk('pesquisa')) out.pesq=await extFetch('pesquisa'); }catch(err){ out.erroPesq=err.message; } })()
  ]);
  S.extCache[key]=out; return out;
}
function cadResumo(rows){
  const n=rows.length, c=s=>rows.filter(r=>r.status_fluxo===s).length, at=c('cadastro_atualizado');
  return {n,at,pend:c('pendente_tratamento'),os:c('aguardando_execucao_os'),ju:c('aguardando_validacao_justificativa'),p:n?at/n:null};
}
function semaforo(p){ return p==null?'var(--text-faint)':p>=1?'var(--leaf)':p>=.7?'var(--amber)':'var(--rose)'; }
function kpi(l,v,s,cls){ return `<div class="k ${cls||''}"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`; }
function blocoCad(R,titulo){
  return `<div class="card"><h2>${titulo}</h2><p class="sub">Meta: atualizar 100% da carteira</p>
    <div class="kpis">${kpi('Total da carteira',int(R.n),'','')}${kpi('Atualizadas',int(R.at),'','c3')}${kpi('Pendentes',int(R.pend),'','c5')}
      ${kpi('Aguard. execução OS',int(R.os),'','c2')}${kpi('Justificativas pendentes',int(R.ju),'','c2')}${kpi('% concluído',R.p!=null?pct(R.p,1):'—',`faltam ${int(R.n-R.at)}`,R.p>=1?'c3':'c4')}</div>
    ${barra(R.at,R.n,semaforo(R.p))}</div>`;
}
function blocoPesq(R,titulo,sub){
  return `<div class="card"><h2>${titulo}</h2><p class="sub">${sub}</p>
    <div class="kpis">${kpi('Meta',int(R.meta),'','')}${kpi('Validados (sem somar)',int(R.valNota),'com nota','c3')}${kpi('Não respondidas',int(R.imp),'validadas como impossibilidade','c4')}

<script>

const POSITIVOS = ['Recuperado','Pagamento identificado','Acordo aceito','Fatura antecipada'];
function atuada(r){ return r.acao_id===1 ? r.status!=='Não iniciado' : !!(r.status_atuacao||r.fatura_antecipada||r.status!=='Não iniciado'); }
function valorAcao(r){ return r.acao_id===1 ? (+r.saldo_vencido||0) : (+r.valor||0); }
function resumoBase(rows){
  const n=rows.length, at=rows.filter(atuada), pos=rows.filter(r=>POSITIVOS.includes(r.status)), v=a=>a.reduce((s,r)=>s+valorAcao(r),0);
  return {n,at:at.length,pos:pos.length,vt:v(rows),vat:v(at),vpos:v(pos),sem:n-at.length,vsem:v(rows)-v(at)};
}
function barrasStatus(rows,campo){
  const cnt={}; rows.forEach(r=>{ const k=(campo==='status'?r.status:(r[campo]||'Sem atuação')); cnt[k]=(cnt[k]||0)+1; });
  const lst=Object.entries(cnt).sort((a,b)=>b[1]-a[1]), mx=Math.max(1,...lst.map(x=>x[1]));
  return lst.map(([k,n])=>`<div style="display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr 44px;gap:10px;align-items:center;margin:5px 0;font-size:12.5px">

      <div style="height:10px;background:var(--water-soft);border-radius:99px;overflow:hidden"><i style="display:block;height:100%;width:${(n/mx*100).toFixed(0)}%;background:${k==='Sem atuação'||k==='Não iniciado'?'var(--rose)':POSITIVOS.includes(k)||k==='PAGO'||k==='FATURA ANTECIPADA'||/^Pago|Pagamento agendado/.test(k)?'var(--leaf)':'var(--water)'};border-radius:99px"></i></div>
      <b style="text-align:right">${n}</b></div>`).join('');
}

    </tbody></table></div></div>

/* ---------- leitura de planilhas ---------- */
async function readBook(file){ const buf=await file.arrayBuffer(); return XLSX.read(buf,{type:'array',cellDates:false}); }
function sheetRows(ws){
  const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
  let h=0; for(let i=0;i<Math.min(15,a.length);i++){ if((a[i]||[]).some(c=>/matr|ligac/i.test(norm(c)))){ h=i; break; } }
  return {head:(a[h]||[]).map(x=>x==null?'':String(x)), rows:a.slice(h+1).filter(r=>r.some(v=>v!=null&&v!==''))};
}
function colIdx(head,aliases){
  const H=head.map(h=>h.trim()==='%'?'%':norm(h));
  for(const a of aliases){ const i=H.indexOf(a); if(i>=0) return i; }
  for(const a of aliases){ if(a.length<4) continue; const i=H.findIndex(h=>h.startsWith(a)); if(i>=0) return i; }
  return -1;
}
function toISO(v){
  if(v==null||v==='') return null;
  if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:null; }
  const s=String(v).trim(); let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:null;
}
const toNum = v => v==null||v===''?null:(typeof v==='number'?v:parseBR(v));
const toMat = v => { const n=parseInt(String(v??'').replace(/\D/g,''),10); return n>0?n:null; };
function toComp(v){
  if(v==null||v==='') return null;
  if(typeof v==='number'){ if(v>20000){ const d=toISO(v); return d.slice(0,7);} return null; }
  const s=norm(v); let m=String(v).match(/^(\d{4})-(\d{1,2})/); if(m) return m[1]+'-'+m[2].padStart(2,'0');

function carteiraRows(wb){
  const execs=new Set(execList().map(norm)); let all=[];
  for(const sn of wb.SheetNames){
    const {head,rows}=sheetRows(wb.Sheets[sn]);
    if(colIdx(head,A_MAT)<0) continue;
    if(colIdx(head,A_EXE)>=0){ all.push(...baseRows(head,rows)); continue; }

    if(execs.has(norm(sn))){ const nome=execList().find(e=>norm(e)===norm(sn));
      all.push(...baseRows([...head,'Executivo'],rows.map(r=>{ const x=[...r]; x[head.length]=nome; return x; }))); }
  }
  return all;
}

    if(!m) throw new Error('Não encontrei os dados de PLR (plr-json) neste arquivo.');

    let novas=0; const mf=txt.match(/<script[^>]*id="photos-json"[^>]*>([\s\S]*?)<\/script>/);

    await sb.from('cargas').insert({tipo:'painel_time',competencia:P.months.at(-1),arquivo:file.name,linhas:rows.length,detalhe:{meta:pct(P.meta,0),base:P.built||''}});

function indDe(v,def){ const s=norm(v); if(!s) return def; if(s.includes('cadastr')) return 'cadastral'; if(s.includes('pesq')) return 'pesquisa'; if(s.includes('arrec')) return 'arrecadacao'; if(s.includes('consum')) return 'consumo'; return def; }
async function upPlanilhaPLR(file){
  if(!file) return;
  try{
    const def=$('plrIndUp').value; const wb=await readBook(file); const rows=[];
    if(await tentaConsumo(wb,file)) return;
    for(const sn of wb.SheetNames){
      const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null,blankrows:false});
      const hi=a.findIndex(r=>(r||[]).some(c=>norm(c).startsWith('executivo'))); if(hi<0) continue;
      const head=a[hi].map(x=>x==null?'':String(x)), c=k=>colIdx(head,k);
      const iE=c(['executivo']), iC=c(['competencia','mes','mesano','periodo','data']), iI=c(['indicador','meta_tipo','tipo']), iR=c(['realizado','resultado','atingido','valor']), iMe=c(['meta']), iU=c(['unidade']);
      if(iC<0||iR<0) continue;
      a.slice(hi+1).forEach(r=>{ const e=String(r[iE]??'').trim(), cp=toComp(r[iC]); if(!e||!cp) return;
        const ind=indDe(iI>=0?r[iI]:null,def); let un=iU>=0&&r[iU]?(/q/i.test(r[iU])?'qtd':'pct'):IND[ind].un;
        let re=toNum(r[iR]), me=iMe>=0?toNum(r[iMe]):(ind==='arrecadacao'?0.95:null);
        if(un==='pct'){ if(re!=null&&re>1.5) re/=100; if(me!=null&&me>1.5) me/=100; }
        rows.push({executivo:e,competencia:cp,indicador:ind,realizado:re,meta:me,unidade:un,fonte:'Planilha · '+file.name,atualizado_em:new Date().toISOString()}); });
    }
    if(!rows.length) throw new Error('Não encontrei colunas Executivo, Competência e Realizado.');
    const uniq=[...new Map(rows.map(r=>[r.executivo+r.competencia+r.indicador,r])).values()];
    const {error}=await sb.from('plr_resultados').upsert(uniq,{onConflict:'executivo,competencia,indicador'}); if(error) throw error;
    await sb.from('cargas').insert({tipo:'plr_planilha',arquivo:file.name,linhas:uniq.length,detalhe:{indicadores:[...new Set(uniq.map(u=>u.indicador))].join(', ')}});
    upMsg(`<div class="msg ok">${uniq.length} resultados de PLR gravados.</div>`); await Promise.all([reload('plr'),reload('cargas')]); render();
  }catch(e){ upMsg(`<div class="msg err">Erro: ${esc(e.message||e)}</div>`); }
}
async function tentaConsumo(wb,file){
  for(const sn of wb.SheetNames){
    const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null,blankrows:false});
    const hi=a.findIndex(r=>(r||[]).some(c=>norm(c)==='prioridade1')&&(r||[]).some(c=>norm(c).startsWith('executivo')));
    if(hi<0) continue;
    const head=a[hi].map(x=>x==null?'':String(x)), c=k=>colIdx(head,k);
    const ix={mes:c(['mes','competencia']),ex:c(['executivo']),p1:c(['prioridade1']),p2:c(['prioridade2']),meta:c(['metaprioridade']),an:c(['prioridadeanalisado','prioridadeanalisada']),
      dp:c(['deltaprioridade']),prod:c(['produtividade%','produtividade']),geral:c(['analisegeral']),d150:c(['deltameta150']),just:c(['justificadosn','justificado'])};
    const iMot=head.length>13&&!head[13]?13:-1;
    const ano=prompt(`Planilha de Consumo Estratégico (aba "${sn}"). A coluna Mês não traz o ano.\n\nDe qual ano são os dados?`,String(S.plrAno));
    if(!ano) return true; if(!/^\d{4}$/.test(ano)) throw new Error('Ano inválido.');
    const out=[], semMes=[];
    a.slice(hi+1).forEach(r=>{ const e=String(r[ix.ex]??'').trim(); if(!e) return;
      const mv=r[ix.mes]; let cp=toComp(mv);
      if(!cp){ const mi=MESES.findIndex(x=>norm(mv).startsWith(norm(x))); if(mi>=0) cp=ano+'-'+String(mi+1).padStart(2,'0'); }
      if(!cp){ semMes.push(e); return; }
      const n=k=>ix[k]>=0?toNum(r[ix[k]]):null;
      const p1=n('p1'), p2=n('p2'), meta=n('meta')??((p1||0)+(p2||0)), an=n('an'), geral=n('geral');
      let prod=ix.prod>=0?r[ix.prod]:null; prod=typeof prod==='string'?(parseBR(prod)??0)/(/%/.test(prod)?100:1):prod;
      const dp=n('dp')??Math.min(0,(an||0)-meta), d150=n('d150')??((geral||0)-150);
      const j=/^s/i.test(String(ix.just>=0?r[ix.just]??'':'').trim());
      out.push({executivo:e,competencia:cp,p1,p2,meta_prioridade:meta,prioridade_analisado:an,delta_prioridade:dp,produtividade:prod,analise_geral:geral,delta_meta150:d150,
        justificado:j,motivo:iMot>=0&&r[iMot]?String(r[iMot]).trim():null,status:j?'Justificado':(dp===0&&d150>=0?'Aprovado':'Reprovado'),fonte:'Planilha · '+file.name,atualizado_em:new Date().toISOString()});
    });
    if(!out.length) throw new Error('A aba de Consumo Estratégico não tem linhas válidas.');
    const uniq=[...new Map(out.map(r=>[r.executivo+r.competencia,r])).values()];
    for(let i=0;i<uniq.length;i+=500){ const {error}=await sb.from('plr_consumo').upsert(uniq.slice(i,i+500),{onConflict:'executivo,competencia'}); if(error) throw error; }
    await sb.from('cargas').insert({tipo:'plr_consumo',competencia:uniq.map(u=>u.competencia).sort().at(-1),arquivo:file.name,linhas:uniq.length,detalhe:{aprovados:uniq.filter(u=>u.status==='Aprovado').length,reprovados:uniq.filter(u=>u.status==='Reprovado').length,justificados:uniq.filter(u=>u.status==='Justificado').length}});
    const conhecidos=new Set(execList()), fora=[...new Set(uniq.map(u=>u.executivo).filter(x=>!conhecidos.has(x)))];
    upMsg(`<div class="msg ok">Consumo Estratégico atualizado · ${uniq.length} linhas (${[...new Set(uniq.map(u=>u.competencia))].sort().map(compLbl).join(', ')}).${fora.length?`<br>Nomes que não batem com nenhum executivo da plataforma: <b>${esc(fora.join(', '))}</b> — confira a grafia na planilha.`:''}</div>`);
    await Promise.all([reload('consumo'),reload('cargas')]); render(); return true;
  }
  return false;
}

async function syncIntegracoes(){
  try{
    const metas={cadastral:+$('mCad').value||null,pesquisa:+$('mPes').value||null}; const out=[];
    for(const k of ['cadastral','pesquisa']){
      if(!extOk(k)) continue; prog('Lendo '+INTEGRACOES[k].nome+'…',.3);
      const c=INTEGRACOES[k], rows=await extFetch(k,{todos:true}), cnt={};
      rows.forEach(r=>{ const e=r[c.colExecutivo], m=String(r[c.colData]||'').slice(0,7); if(!e||!m) return;
        if(k==='pesquisa'){ if(r.status!=='validado'||r.nota_atendimento==null) return; cnt[e+'|'+m]=(cnt[e+'|'+m]||0)+qtdMat(r); }
        else cnt[e+'|'+m]=(cnt[e+'|'+m]||0)+1; });
      for(const [key,n] of Object.entries(cnt)){ const [e,m]=key.split('|'); const old=plrRow(e,m,k);
        out.push({executivo:e,competencia:m,indicador:k,realizado:n,meta:old?.meta??metas[k],unidade:'qtd',fonte:INTEGRACOES[k].nome,atualizado_em:new Date().toISOString()}); }
    }
    if(!out.length) throw new Error('Nenhuma atuação encontrada nas plataformas.');
    const {error}=await sb.from('plr_resultados').upsert(out,{onConflict:'executivo,competencia,indicador'}); if(error) throw error;
    upMsg(`<div class="msg ok">${out.length} resultados de Cadastral/Pesquisa sincronizados.</div>`); await reload('plr'); render();
  }catch(e){ upMsg(`<div class="msg err">Erro: ${esc(e.message||e)}</div>`); }
}

function recortaFoto(src,size=200){
  return new Promise((ok,err)=>{ const im=new Image(); im.onload=()=>{
    const w=im.naturalWidth,h=im.naturalHeight, side=Math.min(w,h)*(h>w*1.15?0.62:0.9);
    const cx=w/2, cy=h>w*1.15?h*0.3:h/2; const l=Math.max(0,Math.min(w-side,cx-side/2)), t=Math.max(0,Math.min(h-side,cy-side/2));
    const c=document.createElement('canvas'); c.width=c.height=size; c.getContext('2d').drawImage(im,l,t,side,side,0,0,size,size);
    ok(c.toDataURL('image/jpeg',.82)); }; im.onerror=err; im.src=src; });
}
async function trocarFoto(exec,file){

  const {error}=await sb.from('fotos_executivos').upsert({executivo:exec,foto,atualizado_em:new Date().toISOString()});
  if(error) return toast(error.message,true);
