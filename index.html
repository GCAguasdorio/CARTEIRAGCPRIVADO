/* modal util */
function modal(html){ $('modalRoot').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()">${html}</div>`; }
function closeModal(){ $('modalRoot').innerHTML=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !S.trocarSenha) closeModal(); });

/* =====================================================================
   ACOMPANHAMENTO DE CARTEIRA
   ===================================================================== */
function compsDisponiveis(){ return [...new Set(S.cargas.filter(c=>c.tipo==='procx'||c.tipo==='carteira_mensal').map(c=>c.competencia))].sort().reverse(); }
async function loadCarteira(){
  const comps=compsDisponiveis(); if(!S.cart.comp) S.cart.comp=comps[0]||null;
  const key=S.cart.comp+'|'+execFoco(); if(!S.cart.comp||S.cart.loaded===key) return;
  const c=S.cart.comp, e=execFoco();
  const q=t=>()=>{ let x=sb.from(t).select('*').eq('competencia',c).order('id'); if(e) x=x.eq('executivo',e); return x; };
  const qh=()=>{ let x=sb.from('carteira_hist').select('matricula,cliente,executivo,curva,carteira,utilizacao,sit_ligacao,bairro').eq('competencia',c).order('matricula'); if(e) x=x.eq('executivo',e); return x; };
  const qb=()=>{ let x=sb.from('carteira_base').select('matricula,cliente,executivo,curva,carteira,utilizacao,sit_ligacao,bairro').order('matricula'); if(e) x=x.eq('executivo',e); return x; };
  let [fat,arr,con,base]=await Promise.all([fetchAll(q('cart_faturamento')),fetchAll(q('cart_arrecadacao')),fetchAll(q('cart_consumo')),fetchAll(qh)]);
  if(!base.length) base=await fetchAll(qb);
  S.cart.fat=fat; S.cart.arr=arr; S.cart.con=con; S.cart.base=Object.fromEntries(base.map(b=>[b.matricula,b])); S.cart.loaded=key;
}
function viewCarteira(){ return '<div id="cartBox"><div class="loading"><div class="spin"></div>Lendo a carteira…</div></div>'; }
async function afterCarteira(){
  try{ await loadCarteira(); }catch(e){ $('cartBox').innerHTML=`<div class="msg err">${esc(e.message)}</div>`; return; }
  if(S.tab!=='carteira') return;
  $('cartBox').innerHTML=carteiraHTML(); drawCartCharts();
}
function cartAgg(){
  const F=S.cart.fat, A=S.cart.arr, C=S.cart.con;
  const pagoMat={}; A.forEach(a=>pagoMat[a.matricula]=(pagoMat[a.matricula]||0)+(+a.valor||0));
  const conMat=Object.fromEntries(C.map(c=>[c.matricula,c]));
  const by={Pagou:{n:0,v:0},'A vencer':{n:0,v:0},Vencido:{n:0,v:0}};
  F.forEach(f=>{ const s=by[f.status]||(by[f.status]={n:0,v:0}); s.n++; s.v+=+f.faturamento||0; });
  const fatTot=F.reduce((s,f)=>s+(+f.faturamento||0),0), arrTot=A.reduce((s,a)=>s+(+a.valor||0),0);
  return {F,A,C,by,fatTot,arrTot,pagoMat,conMat};
}
function setCF(k,v){ S.cf[k]=v; S.cf.lim=60; $('cartTb').innerHTML=cartTable(); }
function carteiraHTML(){
  const comps=compsDisponiveis();
  if(!comps.length) return `<div class="sec-h"><div><h2>Acompanhamento de Carteira</h2></div></div><div class="card empty"><b>Nenhuma carteira anexada ainda</b>${S.gestao?'Anexe a carteira do mês e a base Procx em Gestão › Cargas.':'A gestão ainda não anexou a carteira do mês.'}</div>`;
  const g=cartAgg(); const nMat=new Set(g.F.map(f=>f.matricula)).size;
  const carga=S.cargas.find(c=>(c.tipo==='procx'||c.tipo==='carteira_mensal')&&c.competencia===S.cart.comp);
  const semExec = S.gestao && !execFoco() ? g.F.filter(f=>!f.executivo).length : 0;
  const p1=g.C.filter(c=>c.prioridade==='Prioridade 1').length, p2=g.C.filter(c=>c.prioridade==='Prioridade 2').length;
  return `
  <div class="sec-h"><div><h2>Acompanhamento de Carteira</h2><p>Carteira de ${compLbl(S.cart.comp)} · anexada em ${fdt(carga?.enviado_em)}</p></div>
    <div class="acts"><select class="sel" onchange="S.cart.comp=this.value;S.cart.loaded=null;render()">${comps.map(c=>`<option value="${c}" ${c===S.cart.comp?'selected':''}>${compLbl(c)}</option>`).join('')}</select></div></div>
  ${semExec?`<div class="msg info">${int(semExec)} matrículas desta carteira não estão vinculadas a nenhum executivo. Anexe a carteira do mês em Gestão › Cargas para cruzar.</div>`:''}
  <div class="kpis">
    <div class="k hero-k"><div class="l">Matrículas faturadas</div><div class="v">${int(nMat)}</div><div class="s">${money(g.fatTot)} faturado</div></div>
    <div class="k c3"><div class="l">Pagos</div><div class="v">${int(g.by.Pagou.n)}</div><div class="s">${money(g.by.Pagou.v)} · ${nMat?pct(g.by.Pagou.n/nMat,0):'—'}</div></div>
    <div class="k c2"><div class="l">A vencer</div><div class="v">${int(g.by['A vencer'].n)}</div><div class="s">${money(g.by['A vencer'].v)}</div></div>
    <div class="k c4"><div class="l">Vencidos</div><div class="v">${int(g.by.Vencido.n)}</div><div class="s">${money(g.by.Vencido.v)}</div></div>
    <div class="k c1"><div class="l">Arrecadado no mês</div><div class="v">${money(g.arrTot)}</div><div class="s">${g.fatTot?pct(g.arrTot/g.fatTot):'—'} do faturado</div></div>
    <div class="k c5"><div class="l">Consumo P1 + P2</div><div class="v">${int(p1+p2)}</div><div class="s">${p1} P1 · ${p2} P2 de ${int(g.C.length)} leituras</div></div>
  </div>
  <div class="grid3">
    <div class="card"><h3>Vencimentos <small>quantidade</small></h3><div class="chart-box"><canvas id="chSt"></canvas></div></div>
    <div class="card" style="grid-column:span 2"><h3>Faturamento por data de vencimento <small>R$</small></h3><div class="chart-box"><canvas id="chVenc"></canvas></div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Variação de consumo <small>matrículas lidas</small></h3><div class="chart-box"><canvas id="chCond"></canvas></div></div>
    <div class="card"><h3>Arrecadação por data de pagamento <small>R$</small></h3><div class="chart-box"><canvas id="chArr"></canvas></div></div>
  </div>
  <div class="sec-h" style="margin-top:8px"><div><h2 style="font-size:18px">🔍 Lupa da carteira</h2><p>Pesquise uma matrícula ou cliente e veja vencimento, pagamento e consumo</p></div></div>
  <div class="toolbar">
    <div class="search">${ICON_SEARCH}<input placeholder="Matrícula ou nome do cliente" value="${esc(S.cf.q)}" oninput="setCF('q',this.value)"></div>
    <div class="chips" id="cfChips">${[['','Todos'],['A vencer','A vencer'],['Vencido','Vencidos'],['Pagou','Pagos'],['P12','Consumo P1/P2']].map(([v,l])=>`<button class="chip ${S.cf.st===v?'on':''}" onclick="S.cf.st='${v}';document.querySelectorAll('#cfChips .chip').forEach(b=>b.classList.remove('on'));this.classList.add('on');setCF('st','${v}')">${l}</button>`).join('')}</div>
  </div>
  <div id="cartTb">${cartTable()}</div>`;
}
function cartRows(){
  const g=cartAgg(), q=norm(S.cf.q), B=S.cart.base||{};
  let rows=g.F.map(f=>({...f, cliente:B[f.matricula]?.cliente, pago:g.pagoMat[f.matricula]||0, con:g.conMat[f.matricula]}));
  if(S.cf.st==='P12') rows=rows.filter(r=>r.con&&/Prioridade [12]/.test(r.con.prioridade));
  else if(S.cf.st) rows=rows.filter(r=>r.status===S.cf.st);
  if(q) rows=rows.filter(r=>norm(r.matricula).includes(q)||norm(r.cliente).includes(q));
  const ord={Vencido:0,'A vencer':1,Pagou:2};
  return rows.sort((a,b)=>(ord[a.status]??3)-(ord[b.status]??3)||(+b.faturamento||0)-(+a.faturamento||0));
}
function cartTable(){
  const rows=cartRows(); if(!rows.length) return '<div class="card empty"><b>Nada encontrado</b>Tente outra matrícula ou filtro.</div>';
  const ge=S.gestao&&!execFoco();
  return `<div class="scroll"><table><thead><tr><th>Cliente / matrícula</th>${ge?'<th>Executivo</th>':''}<th>Vencimento</th><th class="r">Faturamento</th><th>Status</th><th class="r">Pago no mês</th><th>Consumo</th><th></th></tr></thead><tbody>
  ${rows.slice(0,S.cf.lim).map(r=>`<tr>
    <td><span class="cli">${esc(r.cliente||'—')}</span><span class="mat">${r.matricula}</span></td>${ge?`<td>${esc(r.executivo||'—')}</td>`:''}
    <td>${fdate(r.vencimento)}</td><td class="r num">${money2(r.faturamento)}</td>
    <td><span class="pill ${r.status==='Pagou'?'st-3':r.status==='Vencido'?'st-4':'st-1'}">${esc(r.status==='Pagou'?'Pago':r.status)}</span></td>
    <td class="r num">${r.pago?money2(r.pago):'—'}</td>
    <td>${r.con?`<span class="pill nopt ${/1/.test(r.con.prioridade)?'st-4':/2/.test(r.con.prioridade)?'st-5':'st-0'}">${esc(r.con.prioridade||'')}</span> <span class="mat">${esc(r.con.condicional||'')}</span>`:'<span class="mat">sem leitura</span>'}</td>
    <td><button class="btn sec sm" onclick="openMat(${r.matricula})">Ver</button></td></tr>`).join('')}
  </tbody></table></div>
  ${rows.length>S.cf.lim?`<div class="more"><button class="btn sec sm" onclick="S.cf.lim+=200;$('cartTb').innerHTML=cartTable()">Mostrar mais (${rows.length-S.cf.lim} restantes)</button></div>`:''}
  <p class="mat" style="margin-top:8px">${int(rows.length)} matrícula(s) · ${money2(rows.reduce((s,r)=>s+(+r.faturamento||0),0))}</p>`;
}
function openMat(m){
  const g=cartAgg(), f=g.F.filter(x=>x.matricula===m), a=g.A.filter(x=>x.matricula===m), c=g.C.find(x=>x.matricula===m);
  const b=(S.cart.base||{})[m]||{}, ac=S.acao.find(x=>x.matricula===m);
  modal(`<div class="modal"><div class="mh"><div><h3>${esc(b.cliente||'Matrícula '+m)}</h3><p>Matrícula ${m} · ${esc(b.executivo||f[0]?.executivo||'')} · ${compLbl(S.cart.comp)}</p></div><button class="x" onclick="closeModal()">×</button></div>
  <div class="mb">
    <div class="info-grid">${[['Curva',b.curva],['Carteira',b.carteira],['Utilização',b.utilizacao],['Situação',b.sit_ligacao],['Bairro',b.bairro]].filter(x=>x[1]).map(([l,v])=>`<div><span>${l}</span><b>${esc(v)}</b></div>`).join('')||'<div><span>Base</span><b>Sem dados cadastrais</b></div>'}</div>
    <div class="grid2">
      <div class="card"><h3>Faturamento</h3>${f.map(x=>`<p>${fdate(x.vencimento)} · <b>${money2(x.faturamento)}</b> · ${esc(x.status)}</p>`).join('')||'<p class="mat">Sem faturamento</p>'}</div>
      <div class="card"><h3>Pagamentos</h3>${a.map(x=>`<p>${fdate(x.data_pgto)} · <b>${money2(x.valor)}</b> <span class="mat">(venc. ${fdate(x.data_venc)})</span></p>`).join('')||'<p class="mat">Nenhum pagamento no mês</p>'}</div>
    </div>
    ${c?`<div class="card"><h3>Consumo</h3><div class="info-grid" style="margin:0">${[['Leitura',fdate(c.data_leitura)],['Ocorrência',c.ocorrencia],['Medido atual',int(c.cm_atual)+' m³'],['Medido ant.',int(c.cm_ant)+' m³'],['Faturado atual',int(c.cf_atual)+' m³'],['Faturado ant.',int(c.cf_ant)+' m³'],['Fat. atual',money2(c.fat_atual)],['Fat. anterior',money2(c.fat_ant)],['Variação',pct(c.variacao)],['Condicional',c.condicional],['Prioridade',c.prioridade],['Status',c.status]].map(([l,v])=>`<div><span>${l}</span><b>${esc(v??'—')}</b></div>`).join('')}</div></div>`:''}
    ${ac?`<div class="msg info">Esta matrícula está na Ação 1 · status ${esc(ac.status)} · <button class="link" onclick="closeModal();go('acao');setTimeout(()=>openAtuar(${ac.acao_id},${m}),50)">abrir plano de atuação</button></div>`:''}
  </div></div>`);
}
function chartBase(){ Chart.defaults.font.family="'Inter',system-ui,sans-serif"; Chart.defaults.color='#5B7285'; }
function drawCartCharts(){
  if(!$('chSt')) return; chartBase();
  const g=cartAgg();
  charts.st=new Chart($('chSt'),{type:'doughnut',data:{labels:['Pagos','A vencer','Vencidos'],datasets:[{data:[g.by.Pagou.n,g.by['A vencer'].n,g.by.Vencido.n],backgroundColor:['#2C9A66','#1C7EBE','#C0492E'],borderWidth:2,borderColor:'#fff'}]},options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom'}}}});
  const dias=[...new Set(g.F.map(f=>f.vencimento).filter(Boolean))].sort();
  const ser=st=>dias.map(d=>g.F.filter(f=>f.vencimento===d&&f.status===st).reduce((s,f)=>s+(+f.faturamento||0),0));
  const yMoney={ticks:{callback:v=>money(v)},grid:{color:'#EEF3F6'}};
  charts.v=new Chart($('chVenc'),{type:'bar',data:{labels:dias.map(fdate).map(x=>x.slice(0,5)),datasets:[
    {label:'Pagos',data:ser('Pagou'),backgroundColor:'#2C9A66'},{label:'A vencer',data:ser('A vencer'),backgroundColor:'#1C7EBE'},{label:'Vencidos',data:ser('Vencido'),backgroundColor:'#C0492E'}]},
    options:{maintainAspectRatio:false,scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,...yMoney}},plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.dataset.label+': '+money2(c.raw)}}}}});
  const conds=['Queda maior que 100%','Queda entre 60% e 100%','Queda menor que 60%','Fatura igual a anterior','Aumento menor que 60%','Aumento entre 60% e 100%','Aumento maior que 100%'];
  const outros=[...new Set(g.C.map(c=>c.condicional).filter(c=>c&&!conds.includes(c)))];
  const cl=[...conds,...outros].filter(c=>g.C.some(x=>x.condicional===c));
  charts.c=new Chart($('chCond'),{type:'bar',data:{labels:cl,datasets:[{data:cl.map(c=>g.C.filter(x=>x.condicional===c).length),backgroundColor:cl.map(c=>/maior que 100|entre 60/.test(c)?'#C0492E':/igual/.test(c)?'#C9E3F3':'#1B4E76'),borderRadius:6}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#EEF3F6'}},y:{grid:{display:false}}}}});
  const dp=[...new Set(g.A.map(a=>a.data_pgto).filter(Boolean))].sort();
  charts.a=new Chart($('chArr'),{type:'line',data:{labels:dp.map(fdate).map(x=>x.slice(0,5)),datasets:[{label:'Arrecadado',data:dp.map(d=>g.A.filter(a=>a.data_pgto===d).reduce((s,a)=>s+(+a.valor||0),0)),borderColor:'#1C7EBE',backgroundColor:'rgba(28,126,190,.12)',fill:true,tension:.3,pointRadius:3}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>money2(c.raw)}}},scales:{x:{grid:{display:false}},y:yMoney}}});
}
</script>
<script>
/* =====================================================================
   RECUPERAÇÃO DE CORTADOS (PCLD) + CASES DE SUCESSO
   ===================================================================== */
function viewRecup(){
  const R=doExec(S.recup), cort=doExec(S.acao).filter(r=>r.sit_ligacao==='Cortada');
  const ap=R.filter(r=>r.status==='Aprovado'), pend=R.filter(r=>r.status==='Pendente'), suc=R.filter(r=>r.caso_sucesso);
  const recVal=ap.reduce((s,r)=>s+(+r.saldo_desconto||0),0);
  const semRec=cort.filter(c=>!S.recup.some(r=>r.matricula===c.matricula&&r.status!=='Rejeitado'));
  const tabs=[['minhas',S.gestao&&!execFoco()?'Recuperações do time':'Minhas recuperações',R.length],['cases',S.gestao&&!execFoco()?'Cases de sucesso':'Seus cases de sucesso',suc.length],['cortados','Cortados para atuar',semRec.length]];
  let body='';
  if(S.rtab==='minhas') body = R.length?`<div class="cases">${R.map(caseCard).join('')}</div>`:`<div class="card empty"><b>Nenhuma recuperação registrada</b>Clique em "Registrar recuperação" para começar.</div>`;
  if(S.rtab==='cases') body = suc.length?`<div class="cases">${suc.map(caseCard).join('')}</div>`:`<div class="card empty"><b>Nenhum case de sucesso ainda</b>Marque "case de sucesso" ao registrar uma recuperação que mereça destaque.</div>`;
  if(S.rtab==='cortados') body = semRec.length?`<div class="scroll"><table><thead><tr><th>Cliente / matrícula</th>${S.gestao&&!execFoco()?'<th>Executivo</th>':''}<th>Cluster cortado</th><th class="r">Saldo vencido</th><th>Status na ação</th><th></th></tr></thead><tbody>
    ${semRec.map(r=>`<tr><td><span class="cli">${esc(r.cliente)}</span><span class="mat">${r.matricula} · ${esc(r.bairro||'')}</span></td>${S.gestao&&!execFoco()?`<td>${esc(r.executivo||'—')}</td>`:''}
      <td>${esc(r.cluster_cortado||'—')}</td><td class="r num">${money2(r.saldo_vencido)}</td><td>${stPill(r.status)}</td>
      <td><button class="btn sm" onclick="openRecForm(${r.matricula})">Registrar recuperação</button></td></tr>`).join('')}</tbody></table></div>`
    :`<div class="card empty"><b>Todos os cortados da ação já têm recuperação registrada</b></div>`;
  return `
  <div class="sec-h"><div><h2>Recuperação de Cortados · PCLD</h2><p>Registre a negociação; a gestão aprova e indica a data de religação</p></div>
    <div class="acts"><button class="btn" onclick="openRecForm()">+ Registrar recuperação</button></div></div>
  <div class="kpis">
    <div class="k hero-k"><div class="l">Cortados na ação</div><div class="v">${int(cort.length)}</div><div class="s">${money(cort.reduce((s,r)=>s+(+r.saldo_vencido||0),0))} em saldo</div></div>
    <div class="k c5"><div class="l">Pendentes de aprovação</div><div class="v">${pend.length}</div><div class="s">aguardando gestão</div></div>
    <div class="k c3"><div class="l">Aprovadas</div><div class="v">${ap.length}</div><div class="s">${money(recVal)} negociado c/ desconto</div></div>
    <div class="k c1"><div class="l">Cases de sucesso</div><div class="v">★ ${suc.length}</div><div class="s">${suc.filter(s=>s.status==='Aprovado').length} confirmados</div></div>
  </div>
  <div class="subtabs">${tabs.map(([k,l,n])=>`<button class="${S.rtab===k?'on':''}" onclick="S.rtab='${k}';render()">${l} <span class="mat">(${n})</span></button>`).join('')}</div>
  ${body}`;
}
function caseCard(r){
  const desc = (+r.saldo_integral>0 && r.saldo_desconto!=null) ? 1-(+r.saldo_desconto)/(+r.saldo_integral) : null;
  const pill = r.status==='Aprovado'?'st-3':r.status==='Rejeitado'?'st-4':'st-5';
  const podeEditar = r.status==='Pendente' && (S.gestao || r.executivo===S.me.executivo);
  return `<div class="case ${r.caso_sucesso?'suc':''}">
    <div class="top"><div><b>${esc(r.cliente||'—')}</b><br><span class="mat">${r.matricula} · ${esc(r.utilizacao||'')}</span></div>
      <div style="text-align:right"><span class="pill ${pill}">${r.status}</span>${r.caso_sucesso?'<br><span class="star" title="Case de sucesso">★ case de sucesso</span>':''}</div></div>
    <div class="vals">
      <div><span>Tipo de pagamento</span><b>${esc(r.tipo_pagamento||'—')}${r.parcelas?` · ${r.parcelas}x`:''}</b></div>
      <div><span>Solicitante</span><b>${esc(r.executivo)}</b></div>
      <div><span>Saldo integral negociado</span><b>${money2(r.saldo_integral)}</b></div>
      <div><span>C/ desconto aplicado</span><b>${money2(r.saldo_desconto)}</b>${desc!=null?` <span class="mat">(-${pct(desc,0)})</span>`:''}</div>
    </div>
    ${r.resumo?`<div class="res">${esc(r.resumo)}</div>`:''}
    ${r.status==='Aprovado'?`<div class="msg ok" style="margin:0">Aprovado por ${esc(r.aprovador||'')} em ${fdate(r.decidido_em)} · religação: <b>${fdate(r.data_religacao)}</b></div>`:''}
    ${r.status==='Rejeitado'?`<div class="msg err" style="margin:0">Rejeitado${r.motivo_rejeicao?': '+esc(r.motivo_rejeicao):''}</div>`:''}
    <div class="foot"><span>${r.tipo} · ${fdt(r.criado_em)}</span>
      <span style="display:flex;gap:6px">${podeEditar?`<button class="btn sec sm" onclick="openRecForm(null,${r.id})">Editar</button>`:''}
      ${S.gestao?`<button class="btn sec sm" onclick="toggleSucesso(${r.id})">${r.caso_sucesso?'Desmarcar ★':'Marcar ★'}</button>`:''}
      ${S.gestao&&r.status==='Pendente'?`<button class="btn sm" onclick="go('aprov')">Decidir</button>`:''}</span></div>
  </div>`;
}
function matOptions(){
  const m=new Map();
  doExec(S.acao).forEach(r=>m.set(r.matricula,{c:r.cliente,u:r.utilizacao,e:r.executivo,s:r.sit_ligacao}));
  Object.values(S.cart.base||{}).forEach(b=>{ if(!m.has(b.matricula)&&(!execFoco()||b.executivo===execFoco())) m.set(b.matricula,{c:b.cliente,u:b.utilizacao,e:b.executivo,s:b.sit_ligacao}); });
  return m;
}
async function openRecForm(mat,id){
  if(!S.cart.base){ try{ const e=execFoco(); const b=await fetchAll(()=>{ let x=sb.from('carteira_base').select('matricula,cliente,executivo,utilizacao,sit_ligacao').order('matricula'); if(e) x=x.eq('executivo',e); return x; }); S.cart.base=Object.fromEntries(b.map(r=>[r.matricula,r])); }catch(_){ S.cart.base={}; } }
  const ed = id ? S.recup.find(r=>r.id===id) : null;
  const M=matOptions();
  $('dlMat').innerHTML=[...M.entries()].sort((a,b)=>(a[1].s==='Cortada'?0:1)-(b[1].s==='Cortada'?0:1)).map(([k,v])=>`<option value="${k}">${esc(v.c||'')}${v.s?' · '+esc(v.s):''}</option>`).join('');
  const m = ed?ed.matricula:(mat||'');
  modal(`<div class="modal"><div class="mh"><div><h3>${ed?'Editar':'Registrar'} recuperação</h3><p>Recuperação de cortados · PCLD</p></div><button class="x" onclick="closeModal()">×</button></div>
  <div class="mb"><div class="fgrid">
    <div class="fld"><label>Tipo de recuperação</label><input value="Recuperação de Cortados" readonly></div>
    <div class="fld"><label>Matrícula</label><input id="r_mat" list="dlMat" value="${m}" placeholder="Digite a matrícula ou o nome" oninput="recFill()" autocomplete="off"></div>
    <div class="fld full"><label>Cliente</label><input id="r_cli" readonly value="${esc(ed?.cliente||'')}"></div>
    <div class="fld"><label>Utilização</label><input id="r_uti" readonly value="${esc(ed?.utilizacao||'')}"></div>
    <div class="fld"><label>Solicitante</label><input id="r_sol" readonly value="${esc(ed?.executivo||'')}"></div>
    <div class="fld full"><label>Tipo de pagamento</label><div class="radio">
      <label><input type="radio" name="r_tp" value="À vista" ${ed?.tipo_pagamento!=='Parcelado'?'checked':''} onchange="$('r_parW').classList.add('hidden')"> À vista</label>
      <label><input type="radio" name="r_tp" value="Parcelado" ${ed?.tipo_pagamento==='Parcelado'?'checked':''} onchange="$('r_parW').classList.remove('hidden')"> Parcelado</label></div></div>
    <div class="fld ${ed?.tipo_pagamento==='Parcelado'?'':'hidden'}" id="r_parW"><label>Nº de parcelas</label><input id="r_par" type="number" min="2" value="${ed?.parcelas||''}"></div>
    <div class="fld"><label>Saldo integral negociado (R$)</label><input id="r_int" inputmode="decimal" value="${ed?.saldo_integral!=null?nf(ed.saldo_integral,2):''}" oninput="recDesc()"></div>
    <div class="fld"><label>Saldo negociado c/ desconto aplicado (R$)</label><input id="r_des" inputmode="decimal" value="${ed?.saldo_desconto!=null?nf(ed.saldo_desconto,2):''}" oninput="recDesc()"><span class="help" id="r_descH"></span></div>
    <div class="fld full"><label>Resumo da negociação</label><textarea id="r_res" rows="4" placeholder="Como foi a negociação, condições, contatos…">${esc(ed?.resumo||'')}</textarea></div>
    <label class="check full" style="margin-bottom:6px"><input type="checkbox" id="r_suc" ${ed?.caso_sucesso?'checked':''}> ★ Marcar como case de sucesso</label>
    <div id="r_msg" class="full"></div>
  </div></div>
  <div class="mf">${ed?`<button class="btn bad" style="margin-right:auto" onclick="delRec(${ed.id})">Excluir</button>`:''}<button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" id="r_save" onclick="saveRec(${ed?ed.id:'null'})">${ed?'Salvar':'Enviar para aprovação'}</button></div></div>`);
  recFill(); recDesc();
}
function parseMat(v){ const m=String(v||'').match(/\d{6,}/); return m?+m[0]:null; }
function recFill(){
  const m=parseMat($('r_mat').value); const o=m&&matOptions().get(m);
  if(o){ $('r_cli').value=o.c||''; $('r_uti').value=o.u||''; $('r_sol').value=o.e||execFoco()||S.me.executivo||''; }
  else if(!$('r_cli').value){ $('r_sol').value=S.me.executivo||execFoco()||''; }
}
const parseBR = v => { if(v==null||v==='') return null; const s=String(v).replace(/[^\d,.-]/g,''); const n=s.includes(',')?+s.replace(/\./g,'').replace(',','.'):+s; return isFinite(n)?n:null; };
function recDesc(){ const a=parseBR($('r_int').value), b=parseBR($('r_des').value);
  $('r_descH').textContent = (a>0&&b!=null)?`Desconto de ${money2(a-b)} (${pct(1-b/a)})`:''; }
async function saveRec(id){
  const m=parseMat($('r_mat').value), o=matOptions().get(m);
  const msg=t=>$('r_msg').innerHTML=`<div class="msg err">${t}</div>`;
  if(!m) return msg('Informe a matrícula.');
  const exec=$('r_sol').value||o?.e;
  if(!exec) return msg('Não encontrei o executivo desta matrícula. Escolha uma matrícula da sua carteira.');
  const rec={matricula:m,cliente:$('r_cli').value||null,utilizacao:$('r_uti').value||null,executivo:exec,
    tipo_pagamento:document.querySelector('input[name=r_tp]:checked').value,
    parcelas:document.querySelector('input[name=r_tp]:checked').value==='Parcelado'?(+$('r_par').value||null):null,
    saldo_integral:parseBR($('r_int').value),saldo_desconto:parseBR($('r_des').value),resumo:$('r_res').value.trim()||null,caso_sucesso:$('r_suc').checked};
  if(rec.saldo_integral==null||rec.saldo_desconto==null) return msg('Preencha o saldo integral e o saldo com desconto.');
  if(rec.saldo_desconto>rec.saldo_integral) return msg('O saldo com desconto não pode ser maior que o saldo integral.');
  if(!rec.resumo) return msg('Escreva o resumo da negociação.');
  $('r_save').disabled=true;
  const {error}= id ? await sb.from('recuperacoes').update(rec).eq('id',id) : await sb.from('recuperacoes').insert(rec);
  if(error){ $('r_save').disabled=false; return msg(esc(error.message)); }
  closeModal(); toast(id?'Recuperação atualizada':'Recuperação enviada para aprovação da gestão');
  await Promise.all([reload('recup'),reload('acao')]); S.rtab='minhas'; render();
}
async function delRec(id){ if(!confirm('Excluir esta recuperação pendente?')) return;
  const {error}=await sb.from('recuperacoes').delete().eq('id',id); if(error) return toast(error.message,true);
  closeModal(); await reload('recup'); render(); }
async function toggleSucesso(id){ const r=S.recup.find(x=>x.id===id);
  const {error}=await sb.from('recuperacoes').update({caso_sucesso:!r.caso_sucesso}).eq('id',id); if(error) return toast(error.message,true);
  r.caso_sucesso=!r.caso_sucesso; render(); }

/* =====================================================================
   CADASTRAL & PESQUISA (integração com as plataformas existentes)
   ===================================================================== */
const extClients={};
function extOk(k){ const c=INTEGRACOES[k]; return !!(c.supabaseUrl&&c.key&&c.tabela); }
async function extFetch(k,{todos=false}={}){
  const c=INTEGRACOES[k]; if(!extOk(k)) return null;
  extClients[k] ||= supabase.createClient(c.supabaseUrl,c.key,{auth:{persistSession:false,storageKey:'ext-'+k}});
  const e=todos?'':execFoco();
  return fetchAll(()=>{ let q=extClients[k].from(c.tabela).select('*').order(c.colData,{ascending:false}); if(e) q=q.eq(c.colExecutivo,e); return q; });
}
function viewCadPes(){
  return `<div class="sec-h"><div><h2>Atualização Cadastral & Pesquisa de Satisfação</h2><p>Acesse as plataformas e acompanhe o que você já atuou</p></div></div>
  <div class="grid2">${['cadastral','pesquisa'].map(k=>{ const c=INTEGRACOES[k];
    return `<div class="card"><div class="plat"><div class="ic">${k==='cadastral'?'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>':'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17.3 6.2 21l1.6-6.6L2.6 10l6.8-.6L12 3l2.6 6.4 6.8.6-5.2 4.4 1.6 6.6z"/></svg>'}</div>
      <div><h3>${c.nome}</h3><p>${extOk(k)?'Integrada':'Integração não configurada'}</p></div>
      ${c.link?`<a class="btn" href="${esc(c.link)}" target="_blank" rel="noopener">Abrir plataforma ↗</a>`:'<span class="btn sec" style="margin-left:auto;opacity:.6" title="Informe o link em INTEGRACOES no HTML">Link não configurado</span>'}</div>
      <div id="ext_${k}">${extOk(k)?'<div class="loading"><div class="spin"></div>Buscando atuações…</div>':`<div class="empty"><b>Sem leitura automática ainda</b>${S.gestao?'Preencha supabaseUrl, key e tabela em INTEGRACOES (topo do script) para mostrar aqui o que cada executivo já atuou.':'A gestão está configurando a leitura das atuações.'}</div>`}</div></div>`;}).join('')}</div>`;
}
async function afterCadPes(){
  for(const k of ['cadastral','pesquisa']){
    if(!extOk(k)) continue; const c=INTEGRACOES[k], box=$('ext_'+k);
    try{
      const rows=await extFetch(k); if(!box||S.tab!=='cadpes') return;
      const mes=nowComp(); const noMes=rows.filter(r=>String(r[c.colData]||'').slice(0,7)===mes);
      const porMes={}; rows.forEach(r=>{ const m=String(r[c.colData]||'').slice(0,7); if(m) porMes[m]=(porMes[m]||0)+1; });
      const meses=Object.keys(porMes).sort().slice(-6);
      box.innerHTML=`<div class="kpis" style="margin-bottom:12px">
          <div class="k c1"><div class="l">Total atuado</div><div class="v">${int(rows.length)}</div></div>
          <div class="k c3"><div class="l">Em ${compLbl(mes)}</div><div class="v">${int(noMes.length)}</div></div></div>
        ${meses.length?`<div style="display:flex;gap:6px;align-items:flex-end;height:70px;margin-bottom:12px">${meses.map(m=>{const mx=Math.max(...meses.map(x=>porMes[x]));return `<div style="flex:1;text-align:center;font-size:11.5px;color:var(--text-faint)"><div style="height:${Math.max(4,porMes[m]/mx*48)}px;background:var(--water);border-radius:5px 5px 0 0"></div>${compLbl(m)}<br><b style="color:var(--text)">${porMes[m]}</b></div>`}).join('')}</div>`:''}
        <div class="scroll" style="max-height:340px;overflow:auto"><table><thead><tr><th>Matrícula</th><th>Data</th>${c.colStatus?'<th>Status</th>':''}${S.gestao&&!execFoco()?'<th>Executivo</th>':''}</tr></thead><tbody>
        ${rows.slice(0,150).map(r=>`<tr><td>${esc(r[c.colMatricula]??'—')}</td><td>${fdt(r[c.colData])}</td>${c.colStatus?`<td>${esc(r[c.colStatus]??'—')}</td>`:''}${S.gestao&&!execFoco()?`<td>${esc(r[c.colExecutivo]??'—')}</td>`:''}</tr>`).join('')||'<tr><td colspan="4" class="mat">Nenhuma atuação encontrada.</td></tr>'}
        </tbody></table></div>`;
    }catch(e){ if(box) box.innerHTML=`<div class="msg err">Não foi possível ler a plataforma: ${esc(e.message)}. Verifique se a tabela permite leitura com a chave pública.</div>`; }
  }
}

/* =====================================================================
   METAS PLR
   ===================================================================== */
function plrRow(e,c,i){ return S.plr.find(r=>r.executivo===e&&r.competencia===c&&r.indicador===i); }
function plrJust(e,c,i){ return S.just.find(j=>j.executivo===e&&j.competencia===c&&j.indicador===i&&j.status!=='Rejeitada') || S.just.find(j=>j.executivo===e&&j.competencia===c&&j.indicador===i); }
function consRow(e,c){ return S.consumo.find(r=>r.executivo===e&&r.competencia===c); }
const consMeta = r => Math.max(150, +r.meta_prioridade||0);
function plrSt(e,c,i){
  if(i==='consumo'){ const r=consRow(e,c);
    if(r){ if(r.status==='Aprovado') return {st:'ok',r};
      if(r.status==='Justificado') return {st:'ju',r,j:{status:'Aprovada',motivo:r.motivo||'Justificado na planilha',descricao:null}};
      const j=plrJust(e,c,i); if(j?.status==='Aprovada') return {st:'ju',r,j}; if(j?.status==='Pendente') return {st:'pe',r,j};
      return {st:'no',r,j}; } }
  const r=plrRow(e,c,i); if(!r||r.realizado==null||r.meta==null) return {st:'na',r};
  if(+r.realizado>=+r.meta) return {st:'ok',r};
  const j=plrJust(e,c,i);
  if(j?.status==='Aprovada') return {st:'ju',r,j}; if(j?.status==='Pendente') return {st:'pe',r,j};
  return {st:'no',r,j};
}
function plrVal(r){ if(r&&r.p1!==undefined) return `${int(r.analise_geral||0)}/${int(consMeta(r))}`; if(!r||r.realizado==null) return '—'; return r.unidade==='qtd'?`${int(r.realizado)}/${int(r.meta)}`:pct(r.realizado); }
function plrMonths(){ const y=String(S.plrAno); const ms=[...new Set([...S.plr,...S.consumo].filter(r=>r.competencia.startsWith(y)).map(r=>r.competencia))];
  const cur=nowComp(); for(let m=1;m<=12;m++){ const c=y+'-'+String(m).padStart(2,'0'); if(c<=cur&&!ms.includes(c)) ms.push(c); } return ms.sort(); }
function plrResumo(e){
  const y=String(S.plrAno); let ok=0,n=0;
  const keys=new Set([...S.plr.map(r=>r.executivo+'|'+r.competencia+'|'+r.indicador),...S.consumo.map(r=>r.executivo+'|'+r.competencia+'|consumo')]);
  keys.forEach(k=>{ const [ex,c,i]=k.split('|'); if(!c.startsWith(y)||(e&&ex!==e)) return; const s=plrSt(ex,c,i).st; if(s==='na') return; n++; if(s==='ok'||s==='ju') ok++; });
  return {ok,n};
}
function plrCell(e,c,i){
  const {st,r,j}=plrSt(e,c,i);
  const lbl={ok:'✓',no:'✗',ju:'justificado',pe:'em análise',na:''}[st];
  const txt = st==='na'?'—':`${plrVal(r)} <span style="font-size:11px">${lbl}</span>`;
  const can = S.gestao || (st==='no'||st==='pe'||st==='ju');
  return can?`<button class="cell ${st}" onclick="plrClick('${esc(e)}','${c}','${i}')">${txt}</button>`:`<span class="cell ${st}">${txt}</span>`;
}
function viewPlr(){
  const e=execFoco(), ms=plrMonths();
  const anos=[...new Set([...S.plr,...S.consumo].map(r=>+r.competencia.slice(0,4)).concat([new Date().getFullYear()]))].sort();
  const legend=`<div class="legend"><span><i class="sw" style="background:var(--leaf-soft)"></i>Atingida</span><span><i class="sw" style="background:var(--rose-soft)"></i>Não atingida — clique para justificar</span><span><i class="sw" style="background:var(--amber-soft)"></i>Justificativa em análise</span><span><i class="sw" style="background:var(--water-soft)"></i>Justificativa aprovada</span><span><i class="sw" style="background:var(--bg)"></i>Sem dado</span></div>`;
  let tb;
  if(e){
    tb=`<div class="scroll"><table class="plr-tb"><thead><tr><th>Indicador</th>${ms.map(m=>`<th style="text-align:center">${compLbl(m)}</th>`).join('')}<th class="r">Atingidas</th></tr></thead><tbody>
      ${Object.entries(IND).map(([k,v])=>{ const st=ms.map(m=>plrSt(e,m,k).st), ok=st.filter(s=>s==='ok'||s==='ju').length, n=st.filter(s=>s!=='na').length;
        return `<tr><td><b>${v.nome}</b><br><span class="mat">${fonteInd(k)}</span></td>${ms.map(m=>`<td class="c">${plrCell(e,m,k)}</td>`).join('')}<td class="r"><b>${n?`${ok}/${n}`:'—'}</b></td></tr>`;}).join('')}
      </tbody></table></div>`;
  } else {
    const ex=execList().filter(x=>!['Carteira Público','Judicial'].includes(x)), i=S.plrInd;
    tb=`<div class="chips" style="margin-bottom:12px">${Object.entries(IND).map(([k,v])=>`<button class="chip ${i===k?'on':''}" onclick="S.plrInd='${k}';render()">${v.nome}</button>`).join('')}</div>
      <div class="scroll"><table class="plr-tb"><thead><tr><th>Executivo</th>${ms.map(m=>`<th style="text-align:center">${compLbl(m)}</th>`).join('')}<th class="r">Atingidas</th></tr></thead><tbody>
      ${ex.map(x=>{ const st=ms.map(m=>plrSt(x,m,i).st), ok=st.filter(s=>s==='ok'||s==='ju').length, n=st.filter(s=>s!=='na').length;
        return `<tr><td><button class="link" onclick="setVer('${esc(x)}')">${esc(x)}</button></td>${ms.map(m=>`<td class="c">${plrCell(x,m,i)}</td>`).join('')}<td class="r"><b>${n?`${ok}/${n}`:'—'}</b></td></tr>`;}).join('')}
      </tbody></table></div><p class="note mat" style="margin-top:8px">Fonte: ${fonteInd(i)}. ${S.gestao?'Clique numa célula para ajustar realizado/meta.':''}</p>`;
  }
  const J=doExec(S.just);
  return `<div class="sec-h"><div><h2>Acompanhamento das Metas PLR</h2><p>Cadastral · Pesquisa · Arrecadação · Consumo estratégico</p></div>
    <div class="acts"><select class="sel" onchange="S.plrAno=+this.value;render()">${anos.map(a=>`<option ${a===S.plrAno?'selected':''}>${a}</option>`).join('')}</select></div></div>
  ${legend}${tb}
  ${e?consumoExecHTML(e):(S.plrInd==='consumo'?consumoTimeHTML():'')}
  <div class="sec-h" style="margin-top:22px"><div><h2 style="font-size:18px">Justificativas de não atingimento</h2><p>Validadas e aprovadas por Tayene ou Day</p></div></div>
  ${J.length?`<div class="scroll"><table><thead><tr><th>Mês</th>${S.gestao&&!execFoco()?'<th>Executivo</th>':''}<th>Indicador</th><th>Motivo</th><th>Descrição</th><th>Status</th><th>Parecer</th></tr></thead><tbody>
    ${J.map(j=>`<tr><td>${compLbl(j.competencia)}</td>${S.gestao&&!execFoco()?`<td>${esc(j.executivo)}</td>`:''}<td>${IND[j.indicador]?.nome||j.indicador}</td><td>${esc(j.motivo)}</td><td class="wrap-c">${esc(j.descricao||'—')}</td>
      <td><span class="pill ${j.status==='Aprovada'?'st-3':j.status==='Rejeitada'?'st-4':'st-5'}">${j.status}</span></td><td class="wrap-c">${esc(j.parecer||'')}${j.validado_por?`<br><span class="mat">${esc(j.validado_por)} · ${fdate(j.validado_em)}</span>`:''}</td></tr>`).join('')}</tbody></table></div>`
  :'<div class="card empty"><b>Nenhuma justificativa enviada</b>Quando uma meta não for atingida, clique na célula vermelha para justificar.</div>'}`;
}
function fonteInd(k){ if(k==='consumo'&&S.consumo.length) return 'Planilha PLR Consumo Estratégico · total analisado / meta do mês'; const s=new Set(S.plr.filter(r=>r.indicador===k&&r.fonte).map(r=>r.fonte)); return s.size?[...s].join(', '):({cadastral:'Plataforma de Atualização Cadastral',pesquisa:'Plataforma de Pesquisa de Satisfação',arrecadacao:'Painel Time',consumo:'Planilha de Consumo Estratégico'}[k]); }
function plrClick(e,c,i){
  const {st,r,j}=plrSt(e,c,i), mine=!S.gestao||e===S.me.executivo;
  const isC = r&&r.p1!==undefined;
  const head=`<div class="mh"><div><h3>${IND[i].nome} · ${compLbl(c)}</h3><p>${esc(e)} · ${isC?`total analisado ${plrVal(r)}`:`realizado ${plrVal(r)}${r?.meta!=null?` · meta ${r.unidade==='qtd'?int(r.meta):pct(r.meta,0)}`:''}`}</p></div><button class="x" onclick="closeModal()">×</button></div>`;
  let body=isC?consumoMesHTML(r):'', foot='';
  if(j) body+=`<div class="msg ${j.status==='Aprovada'?'ok':j.status==='Rejeitada'?'err':'info'}">Justificativa <b>${j.status.toLowerCase()}</b>: ${esc(j.motivo)}${j.descricao?' — '+esc(j.descricao):''}${j.parecer?`<br>Parecer: ${esc(j.parecer)}`:''}</div>`;
  if((st==='no') && (mine||S.gestao)){
    body+=`<div class="fld"><label>Motivo do não atingimento</label><select id="j_mot">${MOTIVOS_PLR.map(m=>`<option>${m}</option>`).join('')}</select></div>
      <div class="fld"><label>Descreva a justificativa</label><textarea id="j_desc" rows="4" placeholder="Ex.: férias de 10 a 24/10; alinhado com a gestão em…"></textarea></div><div id="j_msg"></div>`;
    foot+=`<button class="btn" onclick="sendJust('${esc(e)}','${c}','${i}')">Enviar justificativa</button>`;
  }
  if(S.gestao&&!isC){
    body+=`<h3 style="font-family:var(--font-display);font-size:14.5px;margin:12px 0 8px">Ajustar resultado (gestão)</h3><div class="fgrid">
      <div class="fld"><label>Realizado ${r?.unidade==='qtd'||IND[i].un==='qtd'?'(qtd)':'(%)'}</label><input id="p_real" inputmode="decimal" value="${r?.realizado!=null?(r.unidade==='pct'?nf(r.realizado*100,2):r.realizado):''}"></div>
      <div class="fld"><label>Meta ${r?.unidade==='qtd'||IND[i].un==='qtd'?'(qtd)':'(%)'}</label><input id="p_meta" inputmode="decimal" value="${r?.meta!=null?(r.unidade==='pct'?nf(r.meta*100,2):r.meta):''}"></div></div>`;
    foot+=`<button class="btn sec" onclick="savePlrCell('${esc(e)}','${c}','${i}')">Salvar resultado</button>`;
  }
  modal(`<div class="modal ${isC?'':'sm'}">${head}<div class="mb">${body||'<p class="mat">Meta atingida.</p>'}</div><div class="mf"><button class="btn sec" onclick="closeModal()">Fechar</button>${foot}</div></div>`);
}
async function sendJust(e,c,i){
  const rec={executivo:e,competencia:c,indicador:i,motivo:$('j_mot').value,descricao:$('j_desc').value.trim()||null};
  if(!rec.descricao){ $('j_msg').innerHTML='<div class="msg err">Descreva a justificativa.</div>'; return; }
  const {error}=await sb.from('plr_justificativas').insert(rec);
  if(error){ $('j_msg').innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
  closeModal(); toast('Justificativa enviada para validação'); await reload('just'); render();
}
async function savePlrCell(e,c,i){
  const un=plrRow(e,c,i)?.unidade||IND[i].un, k=un==='pct'?100:1;
  const re=parseBR($('p_real').value), me=parseBR($('p_meta').value);
  const {error}=await sb.from('plr_resultados').upsert({executivo:e,competencia:c,indicador:i,unidade:un,realizado:re==null?null:re/k,meta:me==null?null:me/k,fonte:plrRow(e,c,i)?.fonte||'Ajuste manual',atualizado_em:new Date().toISOString()});
  if(error) return toast(error.message,true);
  closeModal(); await reload('plr'); render();
}

/* =====================================================================
   APROVAÇÕES (gestão)
   ===================================================================== */
function viewAprov(){
  const R=doExec(S.recup).filter(r=>r.status==='Pendente'), J=doExec(S.just).filter(j=>j.status==='Pendente');
  const hist=doExec(S.recup).filter(r=>r.status!=='Pendente').slice(0,12);
  return `<div class="sec-h"><div><h2>Aprovações</h2><p>Recuperação de cortados e justificativas de PLR</p></div></div>
  <div class="card"><h3>Recuperações de cortados pendentes <small>${R.length}</small></h3>
  ${R.length?`<div class="cases">${R.map(r=>`<div class="case ${r.caso_sucesso?'suc':''}">${caseCard(r).replace(/^<div class="case[^>]*>/,'').replace(/<div class="foot">[\s\S]*$/,'')}
    <div class="fld" style="margin:4px 0 0"><label>Data de religação</label><input type="date" id="dr_${r.id}"></div>
    <div class="fld" style="margin:0"><label>Observação / motivo (obrigatório para rejeitar)</label><input id="mr_${r.id}" placeholder="Opcional na aprovação"></div>
    <div style="display:flex;gap:8px"><button class="btn ok sm" onclick="decRec(${r.id},'Aprovado')">✓ Aprovar</button><button class="btn bad sm" onclick="decRec(${r.id},'Rejeitado')">✗ Rejeitar</button>
      <label style="margin-left:auto;font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="sr_${r.id}" ${r.caso_sucesso?'checked':''}> ★ case de sucesso</label></div></div>`).join('')}</div>`
    :'<div class="empty"><b>Nada pendente</b>Todas as recuperações foram decididas.</div>'}</div>
  ${S.validaPlr?`<div class="card"><h3>Justificativas de PLR pendentes <small>${J.length}</small></h3>
  ${J.length?`<div class="scroll"><table><thead><tr><th>Executivo</th><th>Mês</th><th>Indicador</th><th>Resultado</th><th>Motivo</th><th>Descrição</th><th>Parecer</th><th></th></tr></thead><tbody>
    ${J.map(j=>`<tr><td>${esc(j.executivo)}</td><td>${compLbl(j.competencia)}</td><td>${IND[j.indicador]?.nome}</td><td>${plrVal(plrRow(j.executivo,j.competencia,j.indicador))}</td><td>${esc(j.motivo)}</td><td class="wrap-c">${esc(j.descricao||'')}</td>
      <td><input id="pj_${j.id}" class="sel" style="width:180px" placeholder="Parecer"></td>
      <td style="display:flex;gap:6px"><button class="btn ok sm" onclick="decJust(${j.id},'Aprovada')">Aprovar</button><button class="btn bad sm" onclick="decJust(${j.id},'Rejeitada')">Rejeitar</button></td></tr>`).join('')}</tbody></table></div>`
    :'<div class="empty"><b>Nenhuma justificativa pendente</b></div>'}</div>`:''}
  ${hist.length?`<div class="card"><h3>Decididas recentemente</h3><div class="scroll"><table><thead><tr><th>Cliente</th><th>Executivo</th><th>Status</th><th>Religação</th><th>Por</th><th>Em</th></tr></thead><tbody>
    ${hist.map(r=>`<tr><td><span class="cli">${esc(r.cliente||'')}</span><span class="mat">${r.matricula}</span></td><td>${esc(r.executivo)}</td><td><span class="pill ${r.status==='Aprovado'?'st-3':'st-4'}">${r.status}</span></td><td>${fdate(r.data_religacao)}</td><td>${esc(r.aprovador||'')}</td><td>${fdt(r.decidido_em)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
}
async function decRec(id,st){
  const dr=$('dr_'+id).value||null, mo=$('mr_'+id).value.trim()||null, suc=$('sr_'+id).checked;
  if(st==='Aprovado'&&!dr) return toast('Informe a data de religação para aprovar.',true);
  if(st==='Rejeitado'&&!mo) return toast('Informe o motivo da rejeição.',true);
  const {error}=await sb.from('recuperacoes').update({status:st,data_religacao:dr,motivo_rejeicao:st==='Rejeitado'?mo:null,caso_sucesso:suc,aprovador:S.me.nome}).eq('id',id);
  if(error) return toast(error.message,true);
  toast(st==='Aprovado'?'Recuperação aprovada · status da matrícula: Recuperado':'Recuperação rejeitada');
  await Promise.all([reload('recup'),reload('acao')]); render();
}
async function decJust(id,st){
  const p=$('pj_'+id).value.trim()||null;
  if(st==='Rejeitada'&&!p) return toast('Escreva o parecer para rejeitar.',true);
  const {error}=await sb.from('plr_justificativas').update({status:st,parecer:p,validado_por:S.me.nome,validado_em:new Date().toISOString()}).eq('id',id);
  if(error) return toast(error.message,true);
  toast('Justificativa '+st.toLowerCase()); await reload('just'); render();
}
</script>

<script>
/* =====================================================================
   CONSUMO ESTRATÉGICO · números do mês
   ===================================================================== */
function consCalc(r){
  const meta=+r.meta_prioridade||0, an=+r.prioridade_analisado||0, geral=+r.analise_geral||0;
  const metaMes=Math.max(150,meta), faltaP12=Math.max(0,-(+r.delta_prioridade||0)), faltaTotal=Math.max(0,150-geral);
  const p3=Math.max(0,geral-an), p3nec=Math.max(0,150-meta);
  return {meta,an,geral,metaMes,faltaP12,faltaTotal,p3,p3nec,prod:r.produtividade!=null?+r.produtividade:(meta?an/meta:null)};
}
function barra(v,m,cor){ const p=m?Math.min(1,v/m):0; return `<div class="bar" style="height:8px;background:var(--water-soft);border-radius:99px;overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:${(p*100).toFixed(0)}%;background:${cor};border-radius:99px"></i></div>`; }
function stPillC(r){ return `<span class="pill ${r.status==='Aprovado'?'st-3':r.status==='Justificado'?'st-1':'st-4'}">${r.status}</span>`; }
function consumoMesHTML(r){
  const k=consCalc(r);
  return `<div class="kpis" style="margin:0 0 14px;grid-template-columns:repeat(3,1fr)">
    <div class="k ${k.faltaP12?'c4':'c3'}"><div class="l">Prioridade 1 e 2 (obrigatório 100%)</div><div class="v">${int(k.an)} / ${int(k.meta)}</div><div class="s">P1 ${int(r.p1)} · P2 ${int(r.p2)} · ${k.faltaP12?`faltaram ${int(k.faltaP12)}`:'todas feitas ✓'}</div>${barra(k.an,k.meta,k.faltaP12?'var(--rose)':'var(--leaf)')}</div>
    <div class="k ${k.faltaTotal?'c4':'c3'}"><div class="l">Total analisado (mínimo 150)</div><div class="v">${int(k.geral)} / 150</div><div class="s">${k.faltaTotal?`faltaram ${int(k.faltaTotal)}`:`${int(r.delta_meta150)} acima do mínimo ✓`}</div>${barra(k.geral,150,k.faltaTotal?'var(--rose)':'var(--leaf)')}</div>
    <div class="k c2"><div class="l">Prioridade 3 (compensação)</div><div class="v">${int(k.p3)}</div><div class="s">${k.p3nec?`precisava de pelo menos ${int(k.p3nec)} P3`:'P1+P2 já passam de 150: P3 não obrigatória'}</div>${k.p3nec?barra(k.p3,k.p3nec,'var(--water)'):''}</div>
  </div>
  <p style="font-size:13px;color:var(--text-mut)">Meta do mês: <b>${int(k.metaMes)}</b> análises, com 100% das P1 e P2 · Produtividade P1+P2: <b>${pct(k.prod,0)}</b> · Resultado: ${stPillC(r)}${r.motivo?` <span class="mat">(${esc(r.motivo)})</span>`:''}</p>`;
}
const COMO_FUNCIONA=`<div class="msg info" style="margin:0 0 14px"><b>Como funciona a meta:</b> todo mês é obrigatório analisar <b>100% das Prioridades 1 e 2</b> e chegar a no mínimo <b>150 análises</b> no total.
  Se P1+P2 somarem menos que 150, a diferença é completada com <b>Prioridade 3</b>. Se P1+P2 passarem de 150, é preciso fazer <b>todas</b> elas (a meta do mês vira P1+P2).
  Elegível ao PLR quem bate a meta em todos os meses que contam (meses justificados não entram na conta).</div>`;
function consElegib(e){
  const rs=S.consumo.filter(r=>r.executivo===e&&r.competencia.startsWith(String(S.plrAno)));
  const st=rs.map(r=>plrSt(e,r.competencia,'consumo').st), ok=st.filter(s=>s==='ok').length, ju=st.filter(s=>s==='ju').length, base=st.length-ju;
  return {ok,ju,base,n:st.length,pctA:base?ok/base:null,eleg:base>0&&ok===base};

function consTabela(rs,comExec){

  </tbody></table></div>`;
}

    <select class="sel" onchange="S.consMes=this.value;render()">${meses.map(x=>`<option value="${x}" ${x===m?'selected':''}>${compLbl(x)}</option>`).join('')}</select></div>

    </div>

  <div class="card"><h3>Aprovação no ano por executivo</h3><div class="scroll"><table><thead><tr><th>Executivo</th><th class="r">Aprovados</th><th class="r">Justificados</th><th class="r">Meses que contam</th><th class="r">% aprovação</th><th>Elegibilidade PLR</th></tr></thead><tbody>
    ${execs.sort().map(x=>{ const el=consElegib(x); return `<tr><td><button class="link" onclick="setVer('${esc(x)}')">${esc(x)}</button></td><td class="r">${el.ok}</td><td class="r">${el.ju}</td><td class="r">${el.base}</td><td class="r"><b>${pct(el.pctA,0)}</b></td><td>${el.eleg?'<span class="pill st-3">Elegível</span>':'<span class="pill st-4">Não elegível</span>'}</td></tr>`; }).join('')}
  </tbody></table></div></div>`;
}

      <div class="fld"><select id="plrIndUp" class="sel">${Object.entries(IND).map(([k,v])=>`<option value="${k}" ${k==='consumo'?'selected':''}>${v.nome}</option>`).join('')}</select></div>

      <div class="fgrid"><div class="fld"><label>Meta mensal cadastral</label><input id="mCad" type="number" min="0" placeholder="qtd"></div><div class="fld"><label>Meta mensal pesquisa</label><input id="mPes" type="number" min="0" placeholder="qtd"></div></div>
      <button class="btn sm" onclick="syncIntegracoes()" ${extOk('cadastral')||extOk('pesquisa')?'':'disabled title="Configure INTEGRACOES no HTML"'}>Sincronizar agora</button></div>

    ${S.cargas.slice(0,40).map(c=>`<tr><td>${esc(c.tipo.replace('_',' '))}</td><td>${compLbl(c.competencia)}</td><td>${esc(c.arquivo||'')}</td><td class="r">${int(c.linhas)}</td><td class="wrap-c mat">${esc(c.detalhe?Object.entries(c.detalhe).map(([k,v])=>k+': '+v).join(' · '):'')}</td><td>${esc(c.enviado_por||'')}</td><td>${fdt(c.enviado_em)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mat">Nenhuma carga ainda.</p>'}</div>`;
}

/* ---------- leitura de planilhas ---------- */
async function readBook(file){ const buf=await file.arrayBuffer(); return XLSX.read(buf,{type:'array',cellDates:false}); }
function sheetRows(ws){
  const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
  let h=0; for(let i=0;i<Math.min(15,a.length);i++){ if((a[i]||[]).some(c=>/matr|ligac/i.test(norm(c)))){ h=i; break; } }
  return {head:(a[h]||[]).map(x=>x==null?'':String(x)), rows:a.slice(h+1).filter(r=>r.some(v=>v!=null&&v!==''))};
}
function colIdx(head,aliases){
  const H=head.map(h=>h.trim()==='%'?'%':norm(h));
  for(const a of aliases){ const i=H.indexOf(a); if(i>=0) return i; }
  for(const a of aliases){ if(a.length<4) continue; const i=H.findIndex(h=>h.startsWith(a)); if(i>=0) return i; }
  return -1;
}
function toISO(v){
  if(v==null||v==='') return null;
  if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:null; }
  const s=String(v).trim(); let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:null;
}
const toNum = v => v==null||v===''?null:(typeof v==='number'?v:parseBR(v));
const toMat = v => { const n=parseInt(String(v??'').replace(/\D/g,''),10); return n>0?n:null; };
function toComp(v){
  if(v==null||v==='') return null;
  if(typeof v==='number'){ if(v>20000){ const d=toISO(v); return d.slice(0,7);} return null; }
  const s=norm(v); let m=String(v).match(/^(\d{4})-(\d{1,2})/); if(m) return m[1]+'-'+m[2].padStart(2,'0');
  m=String(v).match(/^(\d{1,2})\/(\d{4})$/); if(m) return m[2]+'-'+m[1].padStart(2,'0');
  m=String(v).match(/^\d{1,2}\/(\d{1,2})\/(\d{4})/); if(m) return m[2]+'-'+m[1].padStart(2,'0');
  const mi=MESES.findIndex(x=>s.startsWith(norm(x))); m=s.match(/(\d{2,4})$/);
  if(mi>=0&&m) return (m[1].length===2?'20'+m[1]:m[1])+'-'+String(mi+1).padStart(2,'0');
  return null;
}
const A_MAT=['matricula','numligacao','ligacao','matriculacliente'];
const A_EXE=['executivo','executivoresponsavel','executivodecontas','nomeexecutivo','executivoatual','responsavel','consultor','analista'];

function upMsg(h){ S.upMsg=h; if($('upProg')) $('upProg').innerHTML=h; }
function prog(t,p){ $('upProg').innerHTML=`<div class="card"><b>${esc(t)}</b><div class="prog"><i style="width:${Math.round(p*100)}%"></i></div></div>`; }
async function insertChunks(table,rows,label,base=0,tot=1,size=500){
  for(let i=0;i<rows.length;i+=size){
    const {error}=await sb.from(table).insert(rows.slice(i,i+size)); if(error) throw new Error(table+': '+error.message);
    prog(label,(base+Math.min(i+size,rows.length)/rows.length)/tot);
  }
}

/* ---------- identifica o arquivo (carteira do mês x base Procx) ---------- */
async function upArquivo(file){
  if(!file) return;
  try{
    const wb=await readBook(file);
    const temProcx=wb.SheetNames.some(n=>/fatur|arrec/.test(norm(n)));
    if(temProcx) return await upProcx(file,wb);
    const linhas=carteiraRows(wb);
    if(linhas.length) return await upCarteiraMensal(file,linhas);
    const resumo=wb.SheetNames.slice(0,6).map(n=>{ const {head}=sheetRows(wb.Sheets[n]); return `<b>${esc(n)}</b>: ${esc(head.filter(Boolean).slice(0,14).join(', '))}`; }).join('<br>');
    throw new Error(`Não reconheci este arquivo. Preciso de uma coluna de Matrícula e outra de Executivo (carteira do mês) ou das abas Faturamento/Arrecadação (base Procx).<br><span class="mat">Abas e colunas encontradas:</span><br>${resumo}`);
  }catch(e){ upMsg(`<div class="msg err">Erro: ${e.message?e.message:esc(e)}</div>`); }
}
function carteiraRows(wb){
  const execs=new Set(execList().map(norm)); let all=[];
  for(const sn of wb.SheetNames){
    const {head,rows}=sheetRows(wb.Sheets[sn]);
    if(colIdx(head,A_MAT)<0) continue;
    if(colIdx(head,A_EXE)>=0){ all.push(...baseRows(head,rows)); continue; }
    // uma aba por executivo: usa o nome da aba
    if(execs.has(norm(sn))){ const nome=execList().find(e=>norm(e)===norm(sn));
      all.push(...baseRows([...head,'Executivo'],rows.map(r=>{ const x=[...r]; x[head.length]=nome; return x; }))); }
  }
  return all;
}
async function upCarteiraMensal(file,linhas){
  const uniq=[...new Map(linhas.map(r=>[r.matricula,r])).values()];
  const nEx=new Set(uniq.map(u=>u.executivo)).size;
  const comp=prompt(`Carteira do mês: ${int(uniq.length)} matrículas de ${nEx} executivos.\n\nQual a competência (AAAA-MM)?`,nowComp());
  if(!comp) return; if(!/^\d{4}-\d{2}$/.test(comp)) throw new Error('Competência inválida. Use AAAA-MM.');
  prog('Gravando carteira do mês…',0);
  { const {error}=await sb.from('carteira_hist').delete().eq('competencia',comp); if(error) throw error; }
  await insertChunks('carteira_hist',uniq.map(r=>({...r,competencia:comp})),'Gravando carteira do mês…',0,2);
  const ult=S.cargas.filter(c=>c.tipo==='carteira_exec').map(c=>c.competencia).sort().at(-1);
  if(!ult||comp>=ult){ // carteira mais recente vira a base atual
    for(let i=0;i<uniq.length;i+=500){ const {error}=await sb.from('carteira_base').upsert(uniq.slice(i,i+500).map(r=>({...r,atualizado_em:new Date().toISOString()})),{onConflict:'matricula'}); if(error) throw error; prog('Atualizando carteira atual…',.5+.5*Math.min(i+500,uniq.length)/uniq.length); }
  }
  for(const c of compsDisponiveis()) await sb.rpc('fn_vincular_executivo',{p_comp:c});
  await sb.from('cargas').insert({tipo:'carteira_exec',competencia:comp,arquivo:file.name,linhas:uniq.length,detalhe:{executivos:nEx}});
  const temProcx=compsDisponiveis().includes(comp);
  upMsg(`<div class="msg ok">Carteira de ${compLbl(comp)} gravada · ${int(uniq.length)} matrículas de ${nEx} executivos.${temProcx?' Faturamento e arrecadação do mês já foram cruzados.':' Agora anexe a base Procx do mês para cruzar faturamento e arrecadação.'}</div>`);
  S.cart.base=null; S.cart.loaded=null; await reload('cargas'); render();
}
/* ---------- 2 · base Procx (faturamento / arrecadação / consumo) ---------- */
async function upProcx(file,wb){
  {
    const out={fat:[],arr:[],con:[],base:[]};
    for(const sn of wb.SheetNames){
      const {head,rows}=sheetRows(wb.Sheets[sn]); const n=norm(sn);
      const iM=colIdx(head,A_MAT); if(iM<0) continue;
      const iE=colIdx(head,A_EXE); const ex=r=>iE>=0?(String(r[iE]||'').trim()||null):null;
      if(n.includes('fatur')){
        const iF=colIdx(head,['faturamento','valorfaturado','valorfatura','valor']), iV=colIdx(head,['vencimento','datavencimento','dtvencimento','datadevencimento']), iS=colIdx(head,['status','situacao','statuspagamento']);
        rows.forEach(r=>{ const m=toMat(r[iM]); if(m) out.fat.push({matricula:m,executivo:ex(r),faturamento:toNum(r[iF]),vencimento:toISO(r[iV]),status:iS>=0?(r[iS]||null):null}); });
      } else if(n.includes('arrec')){
        const iA=colIdx(head,['arrecadacao','valorautenticado','valorpago','valorarrecadado','valor']), iP=colIdx(head,['datapgto','datapagamento','datacredito','datadepagamento','datadecredito']), iV=colIdx(head,['datavencimento','vencimento','vencimentopago']);
        rows.forEach(r=>{ const m=toMat(r[iM]); if(m) out.arr.push({matricula:m,executivo:ex(r),valor:toNum(r[iA]),data_pgto:toISO(r[iP]),data_venc:toISO(r[iV])}); });
      } else if(n.includes('consum')){
        const c=k=>colIdx(head,k);
        const ix={data_leitura:c(['datadeleitura','dataleitura']),ocorrencia:c(['ocorrencia']),cm_atual:c(['consumomedidomesatual']),cm_ant:c(['consumomedidomesant','consumomedidomesanterior']),
          cf_atual:c(['consumofaturadomesatual']),cf_ant:c(['consumofaturadomesant','consumofaturadomesanterior']),fat_atual:c(['faturamentomesatual']),fat_ant:c(['faturamentomesant','faturamentomesanterior']),
          delta:c(['delta']),condicional:c(['condicional']),variacao:c(['%','variacao','percentual']),prioridade:c(['prioridade']),status:c(['status'])};
        rows.forEach(r=>{ const m=toMat(r[iM]); if(!m) return; const g=k=>ix[k]>=0?r[ix[k]]:null;
          if(g('data_leitura')==null&&g('condicional')==null&&g('prioridade')==null) return;
          out.con.push({matricula:m,executivo:ex(r),data_leitura:toISO(g('data_leitura')),ocorrencia:g('ocorrencia'),cm_atual:toNum(g('cm_atual')),cm_ant:toNum(g('cm_ant')),cf_atual:toNum(g('cf_atual')),cf_ant:toNum(g('cf_ant')),
            fat_atual:toNum(g('fat_atual')),fat_ant:toNum(g('fat_ant')),delta:toNum(g('delta')),condicional:g('condicional'),variacao:toNum(g('variacao')),prioridade:g('prioridade'),status:g('status')}); });
      } else if(iE>=0){
        out.base.push(...baseRows(head,rows));
      }
    }
    if(!out.fat.length&&!out.arr.length) throw new Error('Achei as abas de Faturamento/Arrecadação, mas sem a coluna Matrícula.');
    // status quando a planilha não traz
    const pagos=new Set(out.arr.map(a=>a.matricula)), hoje=new Date().toISOString().slice(0,10);
    out.fat.forEach(f=>{ if(!f.status) f.status=pagos.has(f.matricula)?'Pagou':(f.vencimento&&f.vencimento<hoje?'Vencido':'A vencer');
      else if(/pag/i.test(f.status)) f.status='Pagou'; else if(/venc/i.test(f.status)&&/a venc/i.test(f.status)) f.status='A vencer'; else if(/vencid/i.test(f.status)) f.status='Vencido'; });
    const cnt={}; out.fat.forEach(f=>{ const k=(f.vencimento||'').slice(0,7); if(k) cnt[k]=(cnt[k]||0)+1; });
    const sug=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0]||nowComp();
    const comp=prompt(`Arquivo lido: ${out.fat.length} faturas, ${out.arr.length} pagamentos, ${out.con.length} leituras de consumo${out.base.length?`, ${out.base.length} linhas de carteira`:''}.\n\nQual a competência (AAAA-MM)?`,sug);
    if(!comp) return; if(!/^\d{4}-\d{2}$/.test(comp)) throw new Error('Competência inválida. Use AAAA-MM.');
    const existe=compsDisponiveis().includes(comp);
    if(existe&&!confirm(`Já existe base Procx de ${compLbl(comp)}. Substituir?`)) return;
    prog('Preparando…',0);
    if(out.base.length) await upsertBase(out.base,file.name+' (aba carteira)');
    { const {error}=await sb.rpc('fn_limpar_competencia',{p_comp:comp}); if(error) throw error; }
    const add=a=>a.map(r=>({...r,competencia:comp}));
    await insertChunks('cart_faturamento',add(out.fat),'Enviando faturamento…',0,3);
    await insertChunks('cart_arrecadacao',add(out.arr),'Enviando arrecadação…',1,3);
    if(out.con.length) await insertChunks('cart_consumo',add(out.con),'Enviando consumo…',2,3);
    prog('Vinculando executivos e atualizando a Ação 1…',1);
    { const {error}=await sb.rpc('fn_vincular_executivo',{p_comp:comp}); if(error) throw error; }
    const {data:nPag,error:e2}=await sb.rpc('fn_aplicar_pagamentos',{p_comp:comp}); if(e2) throw e2;
    await sb.from('cargas').insert({tipo:'procx',competencia:comp,arquivo:file.name,linhas:out.fat.length,detalhe:{faturas:out.fat.length,pagamentos:out.arr.length,consumo:out.con.length,'ação 1 pagas':nPag}});
    const semExec=await sb.from('cart_faturamento').select('id',{count:'exact',head:true}).eq('competencia',comp).is('executivo',null);
    const temCart=S.cargas.some(c=>c.tipo==='carteira_exec'&&c.competencia===comp);
    upMsg(`<div class="msg ok">Base Procx de ${compLbl(comp)} carregada e cruzada com a carteira${temCart?' do mês':' mais recente'} · ${nPag} matrícula(s) da Ação 1 passaram para "Pagamento identificado".${semExec.count?` <br>${int(semExec.count)} faturas sem executivo (matrícula fora da carteira).`:''}</div>`);
    await Promise.all([reload('cargas'),reload('acao')]); S.cart.comp=comp; S.cart.loaded=null; render();
  }
}
/* ---------- 2 · base matrícula → executivo ---------- */
function baseRows(head,rows){
  const c=k=>colIdx(head,k), iM=c(A_MAT), iE=c(A_EXE);
  const ix={cliente:c(['cliente','nomcliente','nomedocliente','razaosocial','nome']),curva:c(['curvafinal','curva']),carteira:c(['carteira']),utilizacao:c(['utilizacao','subcategoria','segmento']),
    sit_ligacao:c(['sitligacao','situacaoligacao','situacao']),bairro:c(['bairro','nombairro']),regiao:c(['regiao','diretoria','spe','superintendencia'])};
  return rows.map(r=>{ const m=toMat(r[iM]), e=String(r[iE]??'').trim(); if(!m||!e||e==='#N/A') return null;
    const o={matricula:m,executivo:e}; for(const k in ix) o[k]=ix[k]>=0&&r[ix[k]]!=null?String(r[ix[k]]).trim():null; return o; }).filter(Boolean);
}
async function upsertBase(rows,arquivo){
  const uniq=[...new Map(rows.map(r=>[r.matricula,{...r,atualizado_em:new Date().toISOString()}])).values()];
  for(let i=0;i<uniq.length;i+=500){ const {error}=await sb.from('carteira_base').upsert(uniq.slice(i,i+500),{onConflict:'matricula'}); if(error) throw error; prog('Atualizando base de carteira…',Math.min(i+500,uniq.length)/uniq.length); }
  for(const comp of compsDisponiveis()) await sb.rpc('fn_vincular_executivo',{p_comp:comp});
  await sb.from('cargas').insert({tipo:'carteira_base',arquivo,linhas:uniq.length,detalhe:{executivos:new Set(uniq.map(u=>u.executivo)).size}});
  S.cart.base=null; S.cart.loaded=null;
  return uniq.length;
}
async function upCarteiraBase(file){
  if(!file) return;
  try{
    const wb=await readBook(file); let all=[];
    for(const sn of wb.SheetNames){ const {head,rows}=sheetRows(wb.Sheets[sn]); if(colIdx(head,A_MAT)>=0&&colIdx(head,A_EXE)>=0) all.push(...baseRows(head,rows)); }
    if(!all.length) throw new Error('Não encontrei colunas Matrícula e Executivo.');
    if(!confirm(`${all.length} matrículas de ${new Set(all.map(a=>a.executivo)).size} executivos. Atualizar a base?`)) return;
    const n=await upsertBase(all,file.name);
    upMsg(`<div class="msg ok">Base atualizada · ${int(n)} matrículas.</div>`); await reload('cargas'); render();
  }catch(e){ upMsg(`<div class="msg err">Erro: ${esc(e.message||e)}</div>`); }
}
/* ---------- 3 · Painel Time ---------- */
async function upPainelTime(file){
  if(!file) return;
  try{
    const txt=await file.text(); const m=txt.match(/<script[^>]*id="plr-json"[^>]*>([\s\S]*?)<\/script>/);
    if(!m) throw new Error('Não encontrei os dados de PLR (plr-json) neste arquivo.');
    const P=JSON.parse(m[1]); const rows=[];
    for(const [e,arr] of Object.entries(P.execs)) arr.forEach((v,i)=>{ if(v!=null) rows.push({executivo:e,competencia:P.months[i],indicador:'arrecadacao',realizado:v,meta:P.meta,unidade:'pct',fonte:'Painel Time',atualizado_em:new Date().toISOString()}); });
    const {error}=await sb.from('plr_resultados').upsert(rows,{onConflict:'executivo,competencia,indicador'}); if(error) throw error;
    await sb.from('cargas').insert({tipo:'painel_time',competencia:P.months.at(-1),arquivo:file.name,linhas:rows.length,detalhe:{meta:pct(P.meta,0),base:P.built||''}});
    upMsg(`<div class="msg ok">PLR Arrecadação atualizada · ${rows.length} resultados (${Object.keys(P.execs).length} executivos, até ${compLbl(P.months.at(-1))}).</div>`);
    await Promise.all([reload('plr'),reload('cargas')]); render();
  }catch(e){ upMsg(`<div class="msg err">Erro: ${esc(e.message||e)}</div>`); }
}
/* ---------- 4 · planilha PLR ---------- */
function indDe(v,def){ const s=norm(v); if(!s) return def; if(s.includes('cadastr')) return 'cadastral'; if(s.includes('pesq')) return 'pesquisa'; if(s.includes('arrec')) return 'arrecadacao'; if(s.includes('consum')) return 'consumo'; return def; }
async function upPlanilhaPLR(file){
  if(!file) return;
  try{
    const def=$('plrIndUp').value; const wb=await readBook(file); const rows=[];
    if(await tentaConsumo(wb,file)) return;
    for(const sn of wb.SheetNames){
      const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null,blankrows:false});
      const hi=a.findIndex(r=>(r||[]).some(c=>norm(c).startsWith('executivo'))); if(hi<0) continue;
      const head=a[hi].map(x=>x==null?'':String(x)), c=k=>colIdx(head,k);
      const iE=c(['executivo']), iC=c(['competencia','mes','mesano','periodo','data']), iI=c(['indicador','meta_tipo','tipo']), iR=c(['realizado','resultado','atingido','valor']), iMe=c(['meta']), iU=c(['unidade']);
      if(iC<0||iR<0) continue;
      a.slice(hi+1).forEach(r=>{ const e=String(r[iE]??'').trim(), cp=toComp(r[iC]); if(!e||!cp) return;
        const ind=indDe(iI>=0?r[iI]:null,def); let un=iU>=0&&r[iU]?(/q/i.test(r[iU])?'qtd':'pct'):IND[ind].un;
        let re=toNum(r[iR]), me=iMe>=0?toNum(r[iMe]):(ind==='arrecadacao'?0.95:null);
        if(un==='pct'){ if(re!=null&&re>1.5) re/=100; if(me!=null&&me>1.5) me/=100; }
        rows.push({executivo:e,competencia:cp,indicador:ind,realizado:re,meta:me,unidade:un,fonte:'Planilha · '+file.name,atualizado_em:new Date().toISOString()}); });
    }
    if(!rows.length) throw new Error('Não encontrei colunas Executivo, Competência e Realizado.');
    const uniq=[...new Map(rows.map(r=>[r.executivo+r.competencia+r.indicador,r])).values()];
    const {error}=await sb.from('plr_resultados').upsert(uniq,{onConflict:'executivo,competencia,indicador'}); if(error) throw error;
    await sb.from('cargas').insert({tipo:'plr_planilha',arquivo:file.name,linhas:uniq.length,detalhe:{indicadores:[...new Set(uniq.map(u=>u.indicador))].join(', ')}});
    upMsg(`<div class="msg ok">${uniq.length} resultados de PLR gravados.</div>`); await Promise.all([reload('plr'),reload('cargas')]); render();
  }catch(e){ upMsg(`<div class="msg err">Erro: ${esc(e.message||e)}</div>`); }
}
async function tentaConsumo(wb,file){
  for(const sn of wb.SheetNames){
    const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null,blankrows:false});
    const hi=a.findIndex(r=>(r||[]).some(c=>norm(c)==='prioridade1')&&(r||[]).some(c=>norm(c).startsWith('executivo')));
    if(hi<0) continue;
    const head=a[hi].map(x=>x==null?'':String(x)), c=k=>colIdx(head,k);
    const ix={mes:c(['mes','competencia']),ex:c(['executivo']),p1:c(['prioridade1']),p2:c(['prioridade2']),meta:c(['metaprioridade']),an:c(['prioridadeanalisado','prioridadeanalisada']),
      dp:c(['deltaprioridade']),prod:c(['produtividade%','produtividade']),geral:c(['analisegeral']),d150:c(['deltameta150']),just:c(['justificadosn','justificado'])};
    const iMot=head.length>13&&!head[13]?13:-1;
    const ano=prompt(`Planilha de Consumo Estratégico (aba "${sn}"). A coluna Mês não traz o ano.\n\nDe qual ano são os dados?`,String(S.plrAno));
    if(!ano) return true; if(!/^\d{4}$/.test(ano)) throw new Error('Ano inválido.');
    const out=[], semMes=[];
    a.slice(hi+1).forEach(r=>{ const e=String(r[ix.ex]??'').trim(); if(!e) return;
      const mv=r[ix.mes]; let cp=toComp(mv);
      if(!cp){ const mi=MESES.findIndex(x=>norm(mv).startsWith(norm(x))); if(mi>=0) cp=ano+'-'+String(mi+1).padStart(2,'0'); }
      if(!cp){ semMes.push(e); return; }
      const n=k=>ix[k]>=0?toNum(r[ix[k]]):null;
      const p1=n('p1'), p2=n('p2'), meta=n('meta')??((p1||0)+(p2||0)), an=n('an'), geral=n('geral');
      let prod=ix.prod>=0?r[ix.prod]:null; prod=typeof prod==='string'?(parseBR(prod)??0)/(/%/.test(prod)?100:1):prod;
      const dp=n('dp')??Math.min(0,(an||0)-meta), d150=n('d150')??((geral||0)-150);
      const j=/^s/i.test(String(ix.just>=0?r[ix.just]??'':'').trim());
      out.push({executivo:e,competencia:cp,p1,p2,meta_prioridade:meta,prioridade_analisado:an,delta_prioridade:dp,produtividade:prod,analise_geral:geral,delta_meta150:d150,
        justificado:j,motivo:iMot>=0&&r[iMot]?String(r[iMot]).trim():null,status:j?'Justificado':(dp===0&&d150>=0?'Aprovado':'Reprovado'),fonte:'Planilha · '+file.name,atualizado_em:new Date().toISOString()});
    });
    if(!out.length) throw new Error('A aba de Consumo Estratégico não tem linhas válidas.');
    const uniq=[...new Map(out.map(r=>[r.executivo+r.competencia,r])).values()];
    for(let i=0;i<uniq.length;i+=500){ const {error}=await sb.from('plr_consumo').upsert(uniq.slice(i,i+500),{onConflict:'executivo,competencia'}); if(error) throw error; }
    await sb.from('cargas').insert({tipo:'plr_consumo',competencia:uniq.map(u=>u.competencia).sort().at(-1),arquivo:file.name,linhas:uniq.length,detalhe:{aprovados:uniq.filter(u=>u.status==='Aprovado').length,reprovados:uniq.filter(u=>u.status==='Reprovado').length,justificados:uniq.filter(u=>u.status==='Justificado').length}});
    const conhecidos=new Set(execList()), fora=[...new Set(uniq.map(u=>u.executivo).filter(x=>!conhecidos.has(x)))];
    upMsg(`<div class="msg ok">Consumo Estratégico atualizado · ${uniq.length} linhas (${[...new Set(uniq.map(u=>u.competencia))].sort().map(compLbl).join(', ')}).${fora.length?`<br>Nomes que não batem com nenhum executivo da plataforma: <b>${esc(fora.join(', '))}</b> — confira a grafia na planilha.`:''}</div>`);
    await Promise.all([reload('consumo'),reload('cargas')]); render(); return true;
  }
  return false;
}
function modeloPLR(){
  const ex=execList(), c=nowComp();
  const rows=ex.map(e=>({Executivo:e,'Competência':c,Indicador:'Consumo Estratégico',Realizado:'',Meta:''}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'PLR'); XLSX.writeFile(wb,'modelo_PLR.xlsx');
}
/* ---------- 5 · integrações ---------- */
async function syncIntegracoes(){
  try{
    const metas={cadastral:+$('mCad').value||null,pesquisa:+$('mPes').value||null}; const out=[];
    for(const k of ['cadastral','pesquisa']){
      if(!extOk(k)) continue; prog('Lendo '+INTEGRACOES[k].nome+'…',.3);
      const c=INTEGRACOES[k], rows=await extFetch(k,{todos:true}), cnt={};
      rows.forEach(r=>{ const e=r[c.colExecutivo], m=String(r[c.colData]||'').slice(0,7); if(e&&m) cnt[e+'|'+m]=(cnt[e+'|'+m]||0)+1; });
      for(const [key,n] of Object.entries(cnt)){ const [e,m]=key.split('|'); const old=plrRow(e,m,k);
        out.push({executivo:e,competencia:m,indicador:k,realizado:n,meta:old?.meta??metas[k],unidade:'qtd',fonte:INTEGRACOES[k].nome,atualizado_em:new Date().toISOString()}); }
    }
    if(!out.length) throw new Error('Nenhuma atuação encontrada nas plataformas.');
    const {error}=await sb.from('plr_resultados').upsert(out,{onConflict:'executivo,competencia,indicador'}); if(error) throw error;
    upMsg(`<div class="msg ok">${out.length} resultados de Cadastral/Pesquisa sincronizados.</div>`); await reload('plr'); render();
  }catch(e){ upMsg(`<div class="msg err">Erro: ${esc(e.message||e)}</div>`); }
}

/* ---------- usuários ---------- */
const SENHA_INICIAL='Carteira@2026';
function emailPadrao(nome){
  const p=String(nome||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '';
  const n=p.length>1?`${p[0]}.${p[p.length-1]}`:p[0];
  return n.toLowerCase().replace(/[^a-z.]/g,'')+'@gestaocarteira.local';
}
async function loadLogins(){
  const {data,error}=await sb.rpc('fn_logins'); if(error){ toast('Não consegui ler os logins: '+error.message,true); return; }
  S.logins=Object.fromEntries((data||[]).map(l=>[l.email,l])); if(S.tab==='gestao'&&S.gtab==='usuarios') $('main').innerHTML=viewGestao();
}
function usuariosHTML(){
  if(!S.logins){ S.logins={}; loadLogins(); }
  const ex=execList().filter(x=>!['Carteira Público','Judicial'].includes(x));
  const acesso=u=>{ const l=u.email&&S.logins[u.email.toLowerCase()];
    if(!u.email) return '<span class="pill st-0">ainda não criou</span>';
    if(!l) return '<span class="pill st-5">sem login</span>';
    return `<span class="pill st-3">ativo</span><br><span class="mat">${l.ultimo_acesso?'último acesso '+fdt(l.ultimo_acesso):'nunca entrou'}</span>`; };
  return `<div class="card"><h2>Logins da Carteira Viva</h2>
    <p class="sub">Cada executivo cria a própria conta em <b>Primeiro acesso</b> (escolhe o nome dele e cria e-mail e senha) e vê só a própria carteira. Enquanto não criar, aparece como <b>ainda não criou</b> aqui. A gestão não se cadastra por fora: adicione com papel <b>Gestão</b> e o acesso é criado na hora (senha provisória <b>${SENHA_INICIAL}</b>, trocada no primeiro acesso).
    Se alguém esquecer a senha, clique em <b>Redefinir senha</b>: ela volta para a provisória e a pessoa troca de novo ao entrar.
    O campo <b>Executivo</b> precisa ser o nome exatamente como aparece nas bases.</p></div>
  <div class="scroll" style="margin-top:14px"><table><thead><tr><th>Nome</th><th>Executivo (nas bases)</th><th>E-mail de acesso</th><th>Papel</th><th>Valida PLR</th><th>Ativo</th><th>Acesso</th><th></th></tr></thead><tbody>
  ${S.usuarios.map(u=>`<tr>
    <td><input class="sel" id="un_${u.id}" value="${esc(u.nome)}" style="width:140px"></td>
    <td><input class="sel" id="ue_${u.id}" value="${esc(u.executivo||'')}" list="dlExec" style="width:150px"></td>
    <td><input class="sel" id="um_${u.id}" value="${esc(u.email||'')}" style="width:250px"></td>
    <td><select class="sel" id="up_${u.id}"><option value="executivo" ${u.papel==='executivo'?'selected':''}>Executivo</option><option value="gestao" ${u.papel==='gestao'?'selected':''}>Gestão</option></select></td>
    <td style="text-align:center"><input type="checkbox" id="uv_${u.id}" ${u.valida_plr?'checked':''}></td>
    <td style="text-align:center"><input type="checkbox" id="ua_${u.id}" ${u.ativo?'checked':''}></td>
    <td>${acesso(u)}</td>
    <td style="display:flex;gap:6px"><button class="btn sm" onclick="saveUser(${u.id})">Salvar</button>
      ${u.email?`<button class="btn sec sm" onclick="criarLogin('${esc(u.email)}',${!!S.logins[u.email.toLowerCase()]})">${S.logins[u.email.toLowerCase()]?'Redefinir senha':'Criar acesso'}</button>`:''}</td></tr>`).join('')}
  <tr><td><input class="sel" id="un_new" placeholder="Novo usuário" style="width:140px"></td>
    <td><input class="sel" id="ue_new" list="dlExec" style="width:150px"></td>
    <td><input class="sel" id="um_new" style="width:250px" placeholder="executivo: deixe vazio"></td>
    <td><select class="sel" id="up_new"><option value="executivo">Executivo</option><option value="gestao">Gestão</option></select></td>
    <td style="text-align:center"><input type="checkbox" id="uv_new"></td><td style="text-align:center"><input type="checkbox" id="ua_new" checked></td><td></td>
    <td><button class="btn ok sm" onclick="saveUser('new')">Adicionar</button></td></tr>
  </tbody></table></div><datalist id="dlExec">${ex.map(e=>`<option>${esc(e)}</option>`).join('')}</datalist>`;
}
async function criarLogin(email,existe){
  if(existe&&!confirm(`Redefinir a senha de ${email} para a provisória (${SENHA_INICIAL})?`)) return;
  const {data,error}=await sb.rpc('fn_criar_login',{p_email:email,p_senha:SENHA_INICIAL});
  if(error) return toast(error.message,true);
  toast(`${email}: ${data} · senha provisória ${SENHA_INICIAL}`); S.logins=null; render();
}
async function saveUser(id){
  const g=p=>$(p+'_'+id);
  const rec={nome:g('un').value.trim(),executivo:g('ue').value.trim()||null,email:(g('um').value.trim().toLowerCase()||(g('up').value==='gestao'?emailPadrao(g('un').value):''))||null,papel:g('up').value,valida_plr:g('uv').checked,ativo:g('ua').checked};
  if(!rec.nome) return toast('Informe o nome.',true);
  const {error}= id==='new' ? await sb.from('usuarios').insert(rec) : await sb.from('usuarios').update(rec).eq('id',id);
  if(error) return toast(error.message,true);
  if(id==='new'&&rec.email){ const r=await sb.rpc('fn_criar_login',{p_email:rec.email,p_senha:SENHA_INICIAL}); if(r.error) toast(r.error.message,true); else toast(`Acesso criado: ${rec.email} · senha provisória ${SENHA_INICIAL}`); }
  else toast('Usuário salvo');
  await reload('usuarios'); S.logins=null; render();
}

start().catch(e=>{ $('boot').innerHTML=`<div class="msg err">Erro ao iniciar: ${esc(e.message)}</div>`; });
