<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteira Viva · Grandes Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0A2A43; --navy-2:#123A5C; --navy-3:#1B4E76;
    --water:#1C7EBE; --water-soft:#E4F1FA; --water-line:#C9E3F3;
    --leaf:#2C9A66; --leaf-soft:#E3F5EC; --leaf-line:#BFE6D2;
    --amber:#B9791A; --amber-soft:#FBF1DE; --amber-line:#EFD9AE;
    --rose:#C0492E; --rose-soft:#FBE9E5; --rose-line:#F0C7BC;
    --violet:#7C4FCB; --violet-soft:#F1EAFB;
    --bg:#EEF3F7; --surface:#FFFFFF; --border:#DEE6EC;
    --text:#12232F; --text-mut:#5B7285; --text-faint:#8CA0AF;
    --radius:16px;
    --shadow-xs:0 1px 2px rgba(10,42,67,.05);
    --shadow-sm:0 4px 14px -6px rgba(10,42,67,.14);
    --shadow-md:0 14px 34px -14px rgba(10,42,67,.28);
    --shadow-lg:0 24px 60px -20px rgba(10,42,67,.34);
    --font-display:'Manrope',sans-serif; --font-body:'Inter',sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:#C7D6DF; border-radius:100px; }
  button, input, select, textarea{ font-family:var(--font-body); color:var(--text); }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--water); outline-offset:2px; border-radius:4px; }
  .hidden{ display:none!important; }
  .num{ font-variant-numeric:tabular-nums; }

  /* ── login ── */
  .login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:radial-gradient(900px 500px at 100% 0%, rgba(28,126,190,.35), transparent 55%), linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 55%, var(--navy-3) 100%); }
  .login-card{ background:var(--surface); border-radius:18px; padding:32px; max-width:380px; width:100%; box-shadow:var(--shadow-lg); }
  .login-card .eyebrow{ color:var(--water); margin-bottom:10px; }
  .login-card h1{ font-family:var(--font-display); font-weight:800; color:var(--navy); font-size:18px; margin-bottom:4px; }
  .login-card p.sub{ font-size:13px; color:var(--text-mut); margin-bottom:22px; }

  /* ── campos ── */
  .fld{ margin-bottom:14px; display:flex; flex-direction:column; }
  .fld label{ display:block; font-size:12px; font-weight:700; color:var(--text-mut); margin-bottom:6px; }
  .fld input, .fld select, .fld textarea{ width:100%; font-size:13.5px; padding:9px 11px; border-radius:9px; border:1px solid var(--border); background:#FBFDFE; }
  .fld input[type=radio], .fld input[type=checkbox]{ width:auto; }
  .fld textarea{ min-height:70px; resize:vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus{ outline:none; border-color:var(--water); box-shadow:0 0 0 3px var(--water-soft); }
  .fld input[readonly]{ background:var(--water-soft); border-color:var(--water-line); color:var(--navy); font-weight:600; }
  .fld .help{ font-size:12px; color:var(--text-faint); margin-top:5px; }

  /* ── botões ── */
  .btn{ font-weight:700; font-size:13px; border:none; border-radius:10px; padding:9px 16px; transition:.15s; display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--navy); color:#fff; text-decoration:none; }
  .btn:hover{ background:var(--navy-2); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn.full{ width:100%; }
  .btn.sec{ background:none; border:1px solid var(--border); color:var(--navy); }
  .btn.sec:hover{ border-color:var(--water); color:var(--water); background:var(--water-soft); }
  .btn.ok{ background:var(--leaf); color:#fff; } .btn.ok:hover{ background:#25835A; }
  .btn.bad{ background:none; border:1px solid var(--rose-line); color:var(--rose); } .btn.bad:hover{ background:var(--rose-soft); }
  .btn.sm{ padding:6px 12px; font-size:12px; }
  .link{ background:none; border:none; color:var(--water); font-weight:700; font-size:12.5px; padding:0; }
  .link:hover{ text-decoration:underline; }
  .msg{ font-size:12.5px; font-weight:600; border-radius:10px; padding:9px 12px; margin-bottom:12px; border:1px solid transparent; }
  .msg.err{ background:var(--rose-soft); color:var(--rose); border-color:var(--rose-line); }
  .msg.ok{ background:var(--leaf-soft); color:var(--leaf); border-color:var(--leaf-line); }
  .msg.info{ background:var(--water-soft); color:var(--navy-3); border-color:var(--water-line); }

  /* ── hero ── */
  .hero-wrap{
    background:
      radial-gradient(1100px 420px at 12% -20%, rgba(255,255,255,.08), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(28,126,190,.35), transparent 55%),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
    padding:34px 20px 56px; position:relative; overflow:hidden;
  }
  .hero-inner{ max-width:1200px; margin:0 auto; position:relative; z-index:1; }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:#BFE0F5; font-weight:700; margin-bottom:14px; }
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:#5FC1F0; box-shadow:0 0 0 4px rgba(95,193,240,.22); }
  .hero-top{ display:flex; gap:20px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; }
  .hero-inner h1{ font-family:var(--font-display); font-weight:800; font-size:clamp(24px,3.4vw,32px); color:#fff; margin:0 0 10px; letter-spacing:-.01em; }
  .hero-inner p.lead{ margin:0; color:#CBDCE9; font-size:14px; max-width:700px; line-height:1.65; }
  .hero-chips{ display:flex; gap:10px; flex-wrap:wrap; }
  .hchip{ border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); border-radius:12px; padding:10px 16px; min-width:150px; }
  .hchip .l{ font-size:11px; font-weight:700; color:#BFE0F5; text-transform:uppercase; letter-spacing:.05em; }
  .hchip .v{ font-family:var(--font-display); font-size:22px; font-weight:800; color:#fff; margin-top:2px; }

  .role-switch{ display:flex; gap:8px; margin-top:26px; flex-wrap:wrap; }
  .role-switch button{
    appearance:none; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:#DCEAF4;
    font-weight:700; font-size:13.5px; padding:11px 18px; border-radius:11px; transition:.15s;
    display:flex; align-items:center; gap:8px;
  }
  .role-switch button svg{ width:16px; height:16px; }
  .role-switch button.on{ background:#fff; color:var(--navy); border-color:#fff; }
  .role-switch button:not(.on):hover{ background:rgba(255,255,255,.12); }
  .role-switch .badge{ background:var(--rose); color:#fff; border-radius:100px; font-size:10.5px; padding:0 7px; line-height:17px; }
  .role-switch .sair{ margin-left:auto; }
  .hero-foot{ margin-top:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:12.5px; color:#BFE0F5; }
  .hero-foot select{ background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:9px; padding:6px 10px; font-size:12.5px; font-weight:600; }
  .hero-foot select option{ color:var(--text); }

  .app{ max-width:1200px; margin:-30px auto 60px; padding:0 20px; position:relative; z-index:2; animation:viewIn .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

  /* ── cards e cabeçalhos ── */
  .sec-h, .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 22px 24px; box-shadow:var(--shadow-xs); margin-top:18px; }
  .sec-h{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-bottom:20px; }
  .sec-h:first-child{ margin-top:0; box-shadow:var(--shadow-sm); }
  .sec-h h2, .card h2{ font-family:var(--font-display); font-size:16px; font-weight:800; color:var(--navy); margin:0 0 4px; }
  .sec-h p, .card .sub{ font-size:13px; color:var(--text-mut); margin:0; line-height:1.55; }
  .sec-h .acts{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .card h3{ font-family:var(--font-display); font-size:15px; font-weight:800; color:var(--navy); margin-bottom:12px; }
  .card h3 small{ font-family:var(--font-body); font-weight:500; color:var(--text-faint); font-size:12px; margin-left:6px; }
  .card p{ font-size:13px; color:var(--text-mut); line-height:1.55; }

  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-top:18px; }
  .k{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 16px 14px; position:relative; overflow:hidden; }
  .k::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--water); }
  .k .l{ font-size:11px; color:var(--text-mut); font-weight:700; margin-bottom:6px; }
  .k .v{ font-family:var(--font-display); font-size:23px; font-weight:800; color:var(--navy); }
  .k .s{ font-size:12px; color:var(--text-faint); margin-top:3px; }
  .k.hero-k::before{ background:var(--navy); }
  .k.c1::before{ background:var(--navy-3); } .k.c2::before{ background:var(--water); } .k.c2 .v{ color:var(--water); }
  .k.c3::before{ background:var(--leaf); } .k.c3 .v{ color:var(--leaf); }
  .k.c4::before{ background:var(--rose); } .k.c4 .v{ color:var(--rose); }
  .k.c5::before{ background:var(--amber); } .k.c5 .v{ color:var(--amber); }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 18px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:0 18px; }
  @media(max-width:900px){ .grid2,.grid3{ grid-template-columns:1fr; } .grid3 .card{ grid-column:auto!important; } }
  .chart-box{ position:relative; height:250px; }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:18px 0 12px; }
  .search{ position:relative; flex:1; min-width:220px; }
  .search svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-faint); }
  .search input{ width:100%; font-size:13px; padding:9px 12px 9px 34px; border-radius:10px; border:1px solid var(--border); background:var(--surface); }
  .search input:focus{ outline:none; border-color:var(--water); box-shadow:0 0 0 3px var(--water-soft); }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-size:12.5px; font-weight:700; color:var(--text-mut); white-space:nowrap; }
  .chip:hover{ border-color:var(--water); color:var(--water); }
  .chip.on{ background:var(--navy); border-color:var(--navy); color:#fff; }
  select.sel, input.sel{ font-size:13px; padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); }

  .scroll{ overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-xs); }
  .card .scroll{ border:none; box-shadow:none; border-radius:0; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-mut); font-weight:700; padding:11px 10px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; white-space:nowrap; }
  td{ padding:10px 10px; border-bottom:1px solid #EEF3F6; vertical-align:middle; white-space:nowrap; }
  tbody tr:hover td{ background:#FAFCFD; }
  tr:last-child td{ border-bottom:none; }
  td.r, th.r{ text-align:right; }
  td.wrap-c{ white-space:normal; min-width:170px; max-width:280px; }
  .cli{ font-weight:600; color:var(--text); max-width:260px; overflow:hidden; text-overflow:ellipsis; display:block; }
  .mat{ color:var(--text-faint); font-size:12px; }

  .pill{ display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:100px; font-size:10.5px; font-weight:700; white-space:nowrap; }
  .st-0{ background:#EEF3F7; color:var(--text-mut); }
  .st-1{ background:var(--water-soft); color:var(--water); }
  .st-2{ background:#DCEBF7; color:var(--navy-3); }
  .st-3{ background:var(--leaf-soft); color:var(--leaf); }
  .st-4{ background:var(--rose-soft); color:var(--rose); }
  .st-5{ background:var(--amber-soft); color:var(--amber); }
  .st-6{ background:var(--violet-soft); color:var(--violet); }
  .tag{ display:inline-block; border-radius:6px; padding:2px 7px; font-size:10px; font-weight:700; letter-spacing:.02em; }
  .tag.top{ background:var(--navy); color:#fff; } .tag.b25{ background:var(--water-soft); color:var(--water); }
  .tag.amb{ background:linear-gradient(90deg,var(--navy) 50%,var(--water) 50%); color:#fff; }
  .sit-c{ color:var(--rose); font-weight:700; } .sit-a{ color:var(--leaf); font-weight:700; }
  .empty{ text-align:center; padding:32px 20px; color:var(--text-faint); font-size:13px; }
  .empty b{ display:block; font-family:var(--font-display); color:var(--navy); font-size:15px; margin-bottom:4px; }
  .more{ display:flex; justify-content:center; padding:12px; }

  .pipe{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .pipe button{ flex:1; min-width:118px; border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:10px 12px; text-align:left; transition:.15s; }
  .pipe button:hover{ border-color:var(--water); }
  .pipe button.on{ border-color:var(--navy); box-shadow:inset 0 0 0 1px var(--navy); background:var(--water-soft); }
  .pipe .pl{ font-size:11px; font-weight:700; color:var(--text-mut); display:block; }
  .pipe .pv{ font-family:var(--font-display); font-weight:800; font-size:19px; color:var(--navy); }

  .subtabs{ display:flex; gap:8px; margin:18px 0 0; flex-wrap:wrap; }
  .subtabs button{ padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-weight:700; font-size:12.5px; color:var(--text-mut); }
  .subtabs button.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .subtabs button.on .mat{ color:#BFE0F5; }
  .subtabs + *{ margin-top:14px; }

  /* casos */
  .cases{ display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px; }
  .case{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow-xs); display:flex; flex-direction:column; gap:9px; }
  .case.suc{ border-color:var(--leaf-line); box-shadow:inset 0 3px 0 var(--leaf); }
  .case .top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .case .top b{ font-family:var(--font-display); color:var(--navy); }
  .case .vals{ display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:13px; }
  .case .vals span{ color:var(--text-mut); display:block; font-size:11px; font-weight:700; }
  .case .vals b{ font-family:var(--font-display); font-size:14px; color:var(--navy); }
  .case .res{ font-size:13px; color:var(--text); background:var(--water-soft); border:1px solid var(--water-line); border-radius:12px; padding:10px 12px; white-space:pre-wrap; }
  .case .foot{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; font-size:12px; color:var(--text-faint); }
  .star{ color:var(--leaf); font-weight:700; font-size:11.5px; }

  /* PLR */
  .plr-tb td.c{ text-align:center; padding:5px 3px; }
  .cell{ display:block; border-radius:8px; padding:6px 6px; font-weight:700; font-size:12px; min-width:64px; border:none; width:100%; }
  .cell.ok{ background:var(--leaf-soft); color:var(--leaf); }
  .cell.no{ background:var(--rose-soft); color:var(--rose); }
  .cell.ju{ background:var(--water-soft); color:var(--water); }
  .cell.pe{ background:var(--amber-soft); color:var(--amber); }
  .cell.na{ background:#F3F6F9; color:var(--text-faint); font-weight:500; }
  button.cell:hover{ box-shadow:inset 0 0 0 2px rgba(10,42,67,.18); }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text-mut); margin:16px 0 12px; font-weight:600; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .sw{ width:12px; height:12px; border-radius:3px; display:inline-block; }

  /* modal */
  .ov{ position:fixed; inset:0; background:rgba(10,20,30,.55); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:999; }
  .modal{ background:var(--surface); border-radius:18px; width:100%; max-width:720px; box-shadow:var(--shadow-lg); }
  .modal.sm{ max-width:500px; }
  .mh{ padding:24px 26px 0; display:flex; align-items:flex-start; gap:12px; }
  .mh h3{ font-family:var(--font-display); font-size:16px; font-weight:800; color:var(--navy); margin:0 0 4px; }
  .mh p{ font-size:12.5px; color:var(--text-mut); }
  .mh .x{ margin-left:auto; background:none; border:none; color:var(--text-mut); font-size:22px; line-height:1; }
  .mb{ padding:16px 26px; }
  .mf{ padding:4px 26px 24px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .fgrid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .fgrid .full{ grid-column:1/-1; }
  @media(max-width:640px){ .fgrid{ grid-template-columns:1fr; } }
  .info-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px 14px; background:var(--water-soft); border:1px solid var(--water-line); border-radius:12px; padding:12px 14px; margin-bottom:16px; }
  .info-grid div span{ display:block; font-size:10.5px; color:var(--text-mut); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
  .info-grid div b{ font-size:13px; font-weight:600; color:var(--navy); }
  .hist{ font-size:12.5px; border-left:2px solid var(--water-line); padding-left:12px; display:flex; flex-direction:column; gap:6px; max-height:200px; overflow:auto; }
  .hist div span{ color:var(--text-faint); }
  .radio{ display:flex; gap:8px; }
  .radio label{ flex:1; border:1px solid var(--border); background:#FBFDFE; border-radius:10px; padding:10px 12px; display:flex; gap:8px; align-items:center; cursor:pointer; font-weight:700; font-size:12.5px; color:var(--text-mut); margin:0; }
  .radio label:has(input:checked){ background:var(--navy); color:#fff; border-color:var(--navy); }
  .radio input{ accent-color:var(--water); }
  .check{ display:flex; gap:10px; align-items:center; background:var(--leaf-soft); border:1px solid var(--leaf-line); color:var(--leaf); border-radius:10px; padding:10px 14px; font-weight:700; font-size:13px; cursor:pointer; }
  .check input{ width:17px; height:17px; accent-color:var(--leaf); }
  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:11px 18px; border-radius:12px; font-size:13px; font-weight:600; z-index:1000; box-shadow:var(--shadow-md); max-width:90vw; }
  .toast.err{ background:var(--rose); }
  .prog{ height:8px; background:var(--water-soft); border-radius:99px; overflow:hidden; margin:10px 0 0; }
  .prog i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--navy-3),var(--water)); transition:width .2s; }
  .upl{ display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:0 14px; }
  .upl .card p{ margin-bottom:12px; }
  .drop{ border:1.5px dashed var(--water-line); border-radius:12px; padding:14px; text-align:center; color:var(--water); font-weight:700; font-size:13px; background:var(--water-soft); cursor:pointer; display:block; transition:.15s; }
  .drop:hover{ border-color:var(--water); }
  .drop input{ display:none; }
  .plat{ display:flex; gap:14px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .plat .ic{ width:44px; height:44px; border-radius:12px; background:linear-gradient(160deg,var(--navy),var(--navy-3)); display:grid; place-items:center; color:#fff; flex-shrink:0; }
  .plat h3{ margin:0; }
  .plat p{ font-size:12.5px; color:var(--text-faint); }
  .plat .btn{ margin-left:auto; }
  .loading{ display:flex; align-items:center; gap:10px; color:var(--text-mut); padding:30px; justify-content:center; }

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const S = {

};
const charts = {};
const $ = id => document.getElementById(id);
const nf = (v,d=0) => Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
function money(v){ if(v==null||!isFinite(v)) return '—'; const a=Math.abs(v);
  if(a>=1e6) return 'R$ '+nf(v/1e6,2)+' mi'; if(a>=1e3) return 'R$ '+nf(v/1e3,1)+' mil'; return 'R$ '+nf(v,0); }
const money2 = v => (v==null||!isFinite(v)) ? '—' : 'R$ '+nf(v,2);
const pct = (v,d=1) => (v==null||!isFinite(v)) ? '—' : nf(v*100,d)+'%';
const int = v => (v==null||!isFinite(v)) ? '—' : nf(Math.round(v));
const esc = s => s==null ? '' : String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9%]+/g,'');
const fdate = d => { if(!d) return '—'; const [y,m,dd]=String(d).slice(0,10).split('-'); return dd?`${dd}/${m}/${y}`:d; };
const fdt = d => d ? new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '—';
const ini = n => String(n||'?').split(' ').filter(Boolean).filter((w,i,a)=>i===0||i===a.length-1).map(w=>w[0]).join('').toUpperCase();
const first = n => String(n||'').split(' ')[0];
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const compLbl = c => { if(!c) return '—'; const [y,m]=c.split('-'); return MESES[+m-1]+'/'+y.slice(2); };
const nowComp = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
function greeting(){ const h=new Date().getHours(); return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'; }
function toast(t,err){ const d=document.createElement('div'); d.className='toast'+(err?' err':''); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), err?6000:3200); }
function stPill(s){ return `<span class="pill st-${STATUS_CLS[s]??0}">${esc(s)}</span>`; }

const ICON_SEARCH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
function destroyCharts(){ Object.values(charts).forEach(c=>c.destroy()); for(const k in charts) delete charts[k]; }

/* executivo "em foco": o próprio, ou o escolhido pela gestão ('' = todos) */
const execFoco = () => S.gestao ? S.ver : (S.me?.executivo||'');
const doExec = arr => { const e=execFoco(); return e ? arr.filter(r=>r.executivo===e) : arr; };

async function fetchAll(q){
  const out=[]; let from=0; const size=1000;
  while(true){ const {data,error}=await q().range(from,from+size-1); if(error) throw error; out.push(...data); if(data.length<size) break; from+=size; }
  return out;
}

   LOGIN

let signup=false;
async function toggleSignup(){
  signup=!signup;
  ['lpass2W','lexecW'].forEach(id=>$(id).classList.toggle('hidden',!signup));
  $('lbtn').textContent = signup?'Criar conta e entrar':'Entrar';
  $('ltoggle').textContent = signup?'Já tenho conta':'Primeiro acesso? Criar minha conta';
  $('lpassLbl').textContent = signup?'Crie uma senha (mín. 6 caracteres)':'Senha';
  $('lsub').textContent = signup?'Escolha seu nome, confirme o e-mail e crie sua senha.':'Entre com seu e-mail e senha de acesso.';
  $('lmsg').innerHTML='';
  if(signup){
    $('lexec').innerHTML='<option value="">Carregando…</option>';
    const {data,error}=await sb.rpc('fn_execs_sem_acesso');
    if(error){ $('lmsg').innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
    $('lexec').innerHTML='<option value="">Selecione seu nome</option>'+(data||[]).map(n=>`<option>${esc(n)}</option>`).join('');

  }
}
function sugEmail(){
  const n=$('lexec').value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().split(/\s+/).filter(Boolean);
  if(n.length) $('lemail').value=(n.length>1?n[0]+'.'+n[n.length-1]:n[0]).toLowerCase().replace(/[^a-z.]/g,'')+'@gestaocarteira.local';
}
async function doLogin(ev){
  ev.preventDefault();
  const email=$('lemail').value.trim().toLowerCase(), pass=$('lpass').value;
  const box=$('lmsg'); box.innerHTML=''; $('lbtn').disabled=true;
  try{
    if(signup){
      const exec=$('lexec').value;
      if(!exec) throw new Error('Selecione seu nome.');
      if(pass!==$('lpass2').value) throw new Error('As senhas não conferem.');
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{executivo:exec}}});
      if(error) throw error;
      if(!data.session){
        const r=await sb.auth.signInWithPassword({email,password:pass});
        if(r.error){ box.innerHTML='<div class="msg ok">Conta criada! A confirmação de e-mail está ligada no Supabase — peça para a gestão desligar "Confirm email".</div>'; toggleSignup(); return false; }
      }
    } else {
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw error;
    }
    await start();
  }catch(e){
    let m=e.message||String(e);
    if(/Invalid login/i.test(m)) m='E-mail ou senha incorretos.';
    if(/already registered/i.test(m)) m='Este e-mail já tem conta. Use "Já tenho conta" para entrar.';
    if(/Database error|não está autorizado|já tem acesso/i.test(m)) m='Não foi possível criar a conta: esse executivo já tem acesso ou o e-mail não está autorizado. Fale com a gestão (Day ou Tayene).';
    box.innerHTML=`<div class="msg err">${esc(m)}</div>`;
  } finally { $('lbtn').disabled=false; }
  return false;
}
function forgot(){
  $('lmsg').innerHTML='<div class="msg info">Peça para a gestão (Day ou Tayene) redefinir sua senha. Você recebe a senha provisória Carteira@2026 e troca no próximo acesso.</div>';
}
function openTrocaSenha(obrig){
  modal(`<div class="modal sm"><div class="mh"><div><h3>${obrig?'Crie sua senha':'Trocar senha'}</h3><p>${obrig?'Primeiro acesso: troque a senha provisória por uma só sua.':'Escolha uma nova senha (mín. 6 caracteres).'}</p></div>${obrig?'':'<button class="x" onclick="closeModal()">×</button>'}</div>

  if(obrig){ const ov=document.querySelector('.ov'); ov.onclick=null; }
}
async function saveTrocaSenha(){
  const a=$('ns1').value, b=$('ns2').value, m=t=>$('nsMsg').innerHTML=`<div class="msg err">${t}</div>`;
  if(a.length<6) return m('A senha precisa ter pelo menos 6 caracteres.');
  if(a!==b) return m('As senhas não conferem.');
  if(a==='Carteira@2026') return m('Escolha uma senha diferente da provisória.');
  $('nsBtn').disabled=true;
  const {error}=await sb.auth.updateUser({password:a,data:{trocar_senha:false}});
  if(error){ $('nsBtn').disabled=false; return m(esc(error.message)); }
  S.trocarSenha=false; closeModal(); toast('Senha alterada!');
}
async function logout(){ await sb.auth.signOut(); location.href=location.href.split('#')[0]; }

sb.auth.onAuthStateChange(async (ev)=>{
  if(ev==='PASSWORD_RECOVERY'){
    const p=prompt('Digite a nova senha (mín. 6 caracteres):');
    if(p&&p.length>=6){ const {error}=await sb.auth.updateUser({password:p}); toast(error?error.message:'Senha alterada!',!!error); }
  }
});

/* =====================================================================
   INÍCIO / CARGA DE DADOS
   ===================================================================== */
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  $('boot').classList.add('hidden');
  if(!session){ $('login').classList.remove('hidden'); $('appRoot').classList.add('hidden'); return; }
  S.user=session.user;
  const {data:me,error}=await sb.from('usuarios').select('*').eq('email',S.user.email.toLowerCase()).maybeSingle();
  if(error||!me){ $('login').classList.remove('hidden'); $('lmsg').innerHTML='<div class="msg err">Seu usuário não está ativo na Carteira Viva. Fale com a gestão.</div>'; await sb.auth.signOut(); return; }
  S.me=me; S.gestao=me.papel==='gestao'; S.validaPlr=!!me.valida_plr;
  if(S.user.user_metadata?.trocar_senha) S.trocarSenha=true;
  $('login').classList.add('hidden'); $('appRoot').classList.remove('hidden');
  $('whoLine').innerHTML=esc((S.gestao?'Gestão · ':'')+me.nome+' · '+(me.email||''))+' · <button class="link" style="color:#BFE0F5" onclick="openTrocaSenha(false)">Trocar senha</button>';
  $('main').innerHTML='<div class="loading"><div class="spin"></div>Carregando sua carteira…</div>';
  await loadAll();
  const h=location.hash.slice(1); if(h) S.tab=h;
  render();
  if(S.trocarSenha) openTrocaSenha(true);
}
async function loadAll(){
  const [acao,recup,just,plr,cargas,consumo]=await Promise.all([
    fetchAll(()=>sb.from('acao_base').select('*').order('saldo_vencido',{ascending:false,nullsFirst:false})),
    fetchAll(()=>sb.from('recuperacoes').select('*').order('criado_em',{ascending:false})),
    fetchAll(()=>sb.from('plr_justificativas').select('*').order('enviado_em',{ascending:false})),
    fetchAll(()=>sb.from('plr_resultados').select('*')),
    fetchAll(()=>sb.from('cargas').select('*').order('enviado_em',{ascending:false})),
    fetchAll(()=>sb.from('plr_consumo').select('*').order('competencia'))
  ]);
  Object.assign(S,{acao,recup,just,plr,cargas,consumo});
  if(S.gestao) S.usuarios=await fetchAll(()=>sb.from('usuarios').select('*').order('papel').order('nome'));
  S.loaded=true;
}
async function reload(part){
  if(part==='acao') S.acao=await fetchAll(()=>sb.from('acao_base').select('*').order('saldo_vencido',{ascending:false,nullsFirst:false}));
  else if(part==='recup') S.recup=await fetchAll(()=>sb.from('recuperacoes').select('*').order('criado_em',{ascending:false}));
  else if(part==='just') S.just=await fetchAll(()=>sb.from('plr_justificativas').select('*').order('enviado_em',{ascending:false}));
  else if(part==='plr') S.plr=await fetchAll(()=>sb.from('plr_resultados').select('*'));
  else if(part==='consumo') S.consumo=await fetchAll(()=>sb.from('plr_consumo').select('*').order('competencia'));
  else if(part==='cargas') S.cargas=await fetchAll(()=>sb.from('cargas').select('*').order('enviado_em',{ascending:false}));
  else if(part==='usuarios') S.usuarios=await fetchAll(()=>sb.from('usuarios').select('*').order('papel').order('nome'));
}
function execList(){
  const s=new Set(); S.acao.forEach(r=>r.executivo&&s.add(r.executivo)); S.plr.forEach(r=>s.add(r.executivo));
  S.usuarios.forEach(u=>u.executivo&&s.add(u.executivo)); return [...s].sort((a,b)=>a.localeCompare(b,'pt'));
}

  const pendR=S.recup.filter(r=>r.status==='Pendente').length, pendJ=S.just.filter(j=>j.status==='Pendente').length;

function setVer(v){ S.ver=v; S.cart.loaded=null; render(); }

};
const ico = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
function render(){
  destroyCharts();
  if(!tabsDef().some(t=>t[0]===S.tab)) S.tab='acao';
  $('viewAs').innerHTML = S.gestao ? `Ver como: <select onchange="setVer(this.value)" title="Ver como">
      <option value="">Visão geral · todos</option>${execList().map(e=>`<option ${S.ver===e?'selected':''}>${esc(e)}</option>`).join('')}</select>` : '';
  $('nav').innerHTML = tabsDef().map(([k,l,b])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${ico(k)}${l}${b?`<span class="badge">${b}</span>`:''}</button>`).join('')

}
function renderHero(){
  const e=execFoco(); const nome = e ? first(e) : (S.gestao?'time':first(S.me.nome));
  const ac=doExec(S.acao), saldo=ac.reduce((s,r)=>s+(+r.saldo_vencido||0),0);

  const plr=plrResumo(e);
  $('hero').innerHTML = `
    <div><h1>${greeting()}, ${esc(nome)}</h1>
      <p class="lead">${e&&S.gestao?'Visão do executivo · ':''}${S.gestao&&!e?'Visão geral da gestão · ':''}Sua carteira em um só lugar: plano de atuação, acompanhamento mensal, recuperação de cortados e metas PLR. Ação 1 · <b style="color:#fff">${int(ac.length)} matrículas</b> · ${money(saldo)} em saldo vencido.</p></div>

}

<script>
/* =====================================================================
   PLANO DE ATUAÇÃO (Ação 1)

function acaoFiltrada(){
  const f=S.f, q=norm(f.q);
  return doExec(S.acao).filter(r=>
    (!f.origem || r.origem===f.origem || (f.origem!=='TOP 100 + 2500' && r.origem==='TOP 100 + 2500')) &&
    (!f.sit || r.sit_ligacao===f.sit) && (!f.status || r.status===f.status) &&
    (!q || norm(r.matricula).includes(q) || norm(r.cliente).includes(q) || norm(r.bairro).includes(q)));
}
function setF(k,v){ S.f[k]=(S.f[k]===v?'':v); render(); }
function viewAcao(){

    <div class="k c2"><div class="l">Saldo vencido</div><div class="v">${money(sum(all))}</div><div class="s">soma das matrículas</div></div>
    <div class="k c3"><div class="l">Já atuadas</div><div class="v">${int(all.length-cnt('Não iniciado').length)}</div><div class="s">${all.length?pct(1-cnt('Não iniciado').length/all.length,0):'—'} da ação</div></div>
    <div class="k c1"><div class="l">Recuperado / pago / acordo</div><div class="v">${int(ganhos.length)}</div><div class="s">${money(sum(ganhos))} de saldo</div></div>
    <div class="k c5"><div class="l">Em aprovação</div><div class="v">${int(cnt('Em aprovação').length)}</div><div class="s">recuperações aguardando gestão</div></div>
  </div>
  <div class="pipe">${pipe.filter(p=>cnt(p).length||p==='Não iniciado').map(p=>`<button class="${S.f.status===p?'on':''}" onclick="setF('status','${p}')"><span class="pl">${p}</span><span class="pv">${cnt(p).length}</span></button>`).join('')}</div>
  <div class="toolbar">
    <div class="search">${ICON_SEARCH}<input placeholder="Buscar matrícula, cliente ou bairro" value="${esc(S.f.q)}" oninput="S.f.q=this.value;refreshAcaoTable()"></div>
    <div class="chips">${orig.map(([v,l])=>`<button class="chip ${S.f.origem===v?'on':''}" onclick="S.f.origem='${v}';render()">${l}</button>`).join('')}</div>
    <div class="chips">${['Ativa','Cortada'].map(v=>`<button class="chip ${S.f.sit===v?'on':''}" onclick="setF('sit','${v}')">${v}</button>`).join('')}</div>
  </div>
  <div id="acaoTb">${acaoTable(rows)}</div>`;
}
function refreshAcaoTable(){ $('acaoTb').innerHTML=acaoTable(acaoFiltrada()); }
function afterAcao(){}
function acaoTable(rows){
  if(!rows.length) return `<div class="card empty"><b>Nenhuma matrícula encontrada</b>Ajuste os filtros acima.</div>`;
  const ge=S.gestao&&!execFoco();
  return `<div class="scroll"><table><thead><tr>
    <th>Cliente / matrícula</th><th>Base</th>${ge?'<th>Executivo</th>':''}<th>Situação</th><th class="r">Saldo vencido</th><th class="r">Aging</th>
    <th>Análise / plano</th><th>Última ação</th><th>Status</th><th></th></tr></thead><tbody>
    ${rows.map(r=>`<tr>
      <td><span class="cli" title="${esc(r.cliente)}">${esc(r.cliente)}</span><span class="mat">${r.matricula} · ${esc(r.bairro||'')}</span></td>
      <td>${origemTag(r.origem)}</td>${ge?`<td>${esc(r.executivo||'—')}</td>`:''}
      <td>${sitHtml(r.sit_ligacao)}</td>
      <td class="r num">${money2(r.saldo_vencido)}</td><td class="r num">${r.aging!=null?int(r.aging)+' d':'—'}</td>
      <td class="wrap-c">${esc(r.analise||r.tratativa||'—')}${r.plano_acao?`<br><span class="mat">${esc(r.plano_acao)}</span>`:''}</td>
      <td class="wrap-c">${esc(r.acao_executivo||r.proposta||'—')}</td>
      <td>${stPill(r.status)}<br><span class="mat">${r.status_origem==='plataforma'?'auto · ':''}${fdate(r.atualizado_em)}</span></td>
      <td><button class="btn sm" onclick="openAtuar(${r.acao_id},${r.matricula})">Atuar</button></td></tr>`).join('')}
    </tbody></table></div>
    <p class="mat" style="margin-top:8px">${rows.length} matrícula(s) · ${money2(rows.reduce((s,r)=>s+(+r.saldo_vencido||0),0))}</p>`;
}
function opts(list,val,blank='—'){ const l=[...list]; if(val&&!l.includes(val)) l.unshift(val);
  return `<option value="">${blank}</option>`+l.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join(''); }

function autoStatus(r){
  if(['Em aprovação','Recuperado','Pagamento identificado','Finalizado'].includes(r.status)) return r.status;
  const ret=r.retorno_cliente||'', ac=r.acao_executivo||'';
  if(/Aceite/.test(ret)||/^Negociado/.test(ac)) return 'Acordo aceito';
  if(/Recusa/.test(ret)) return 'Proposta recusada';
  if(r.proposta||r.data_envio||r.estagio) return 'Proposta enviada';
  if(/Não Factível/i.test(r.revalidacao||'')&&!ac) return 'Não factível';
  if(/Cancelamento/.test(ac)) return 'Cancelamento de débito';
  if(/Juridica|Jurídica|Judicial/.test(ac)) return 'Encaminhado jurídico';
  if(ac||r.observacao) return r.status==='Não iniciado'?'Em atuação':r.status;
  return r.status;
}
async function openAtuar(aid,mat){
  const r=S.acao.find(x=>x.acao_id===aid&&x.matricula===mat); if(!r) return;
  const rec=S.recup.filter(x=>x.matricula===mat);
  modal(`<div class="modal">
    <div class="mh"><div><h3>${esc(r.cliente)}</h3><p>Matrícula ${r.matricula} · ${esc(r.executivo||'')} · ${r.origem}</p></div><button class="x" onclick="closeModal()">×</button></div>
    <div class="mb">
      <div class="info-grid">
        ${[['Situação',r.sit_ligacao],['Saldo vencido',money2(r.saldo_vencido)],['Saldo a vencer',money2(r.saldo_a_vencer)],['Aging',r.aging!=null?r.aging+' dias':null],
           ['Economias',r.economias],['Curva',r.curva],['Região',r.regiao],['Bairro',r.bairro],['Utilização',r.utilizacao],['Cluster cortado',r.cluster_cortado],
           ['Macro',r.macro],['Perfil',r.perfil],['Análise',r.analise],['Plano de ação',r.plano_acao],['Tratativa',r.tratativa],['OS',r.os],['Prioridade',r.prioridade]]
          .filter(x=>x[1]!=null&&x[1]!=='').map(([l,v])=>`<div><span>${l}</span><b>${esc(v)}</b></div>`).join('')}
      </div>
      <div class="fgrid">
        <div class="fld"><label>Ação do executivo</label><select id="a_acao">${opts(L_ACAO,r.acao_executivo)}</select></div>
        <div class="fld"><label>Proposta</label><select id="a_prop">${opts(L_PROPOSTA,r.proposta)}</select></div>
        <div class="fld"><label>Estágio da proposta</label><select id="a_est">${opts(L_ESTAGIO,r.estagio)}</select></div>
        <div class="fld"><label>Retorno do cliente</label><select id="a_ret">${opts(L_RETORNO,r.retorno_cliente)}</select></div>
        <div class="fld"><label>Data do envio</label><input type="date" id="a_env" value="${r.data_envio||''}"></div>
        <div class="fld"><label>Prazo de retorno</label><input type="date" id="a_pra" value="${r.prazo_retorno||''}"></div>
        <div class="fld"><label>Revalidação de recuperação</label><select id="a_rev">${opts(L_REVAL,r.revalidacao)}</select></div>
        <div class="fld"><label>Status</label><select id="a_st"><option value="__auto">Automático (pela plataforma) · atual: ${esc(r.status)}</option>${STATUS.map(s=>`<option>${s[0]}</option>`).join('')}</select>
          <span class="help">Deixe em "Automático" para a plataforma definir o status pelas informações preenchidas.</span></div>
        <div class="fld full"><label>Observação</label><textarea id="a_obs" rows="3">${esc(r.observacao||'')}</textarea></div>
      </div>
      ${rec.length?`<div class="msg info">Recuperação registrada: ${rec.map(x=>`${x.status} em ${fdate(x.criado_em)}`).join(' · ')}</div>`:''}
      <h3 style="font-family:var(--font-display);font-size:14.5px;margin:6px 0 8px">Histórico</h3>
      <div class="hist" id="histBox"><span class="mat">Carregando…</span></div>
    </div>
    <div class="mf">
      ${r.sit_ligacao==='Cortada'?`<button class="btn sec" onclick="closeModal();openRecForm(${r.matricula})">Registrar recuperação de cortado</button>`:''}
      <button class="btn sec" onclick="closeModal()">Cancelar</button>
      <button class="btn" id="a_save" onclick="saveAtuar(${aid},${mat})">Salvar</button>
    </div></div>`);
  const {data}=await sb.from('acao_historico').select('*').eq('acao_id',aid).eq('matricula',mat).order('em',{ascending:false}).limit(60);
  $('histBox') && ($('histBox').innerHTML = (data&&data.length)?data.map(h=>`<div><b>${esc(h.campo.replace('_',' '))}</b>: ${esc(h.de||'—')} → <b>${esc(h.para||'—')}</b><br><span>${fdt(h.em)} · ${esc(h.por)}${h.origem==='plataforma'?' (automático)':''}</span></div>`).join(''):'<span class="mat">Sem alterações desde o início da plataforma — status vindo da base atual.</span>');
}
async function saveAtuar(aid,mat){
  const r=S.acao.find(x=>x.acao_id===aid&&x.matricula===mat);
  const v=id=>$(id).value||null;
  const upd={acao_executivo:v('a_acao'),proposta:v('a_prop'),estagio:v('a_est'),retorno_cliente:v('a_ret'),
    data_envio:v('a_env'),prazo_retorno:v('a_pra'),revalidacao:v('a_rev'),observacao:v('a_obs')};
  const st=$('a_st').value;
  if(st==='__auto'){ upd.status=autoStatus({...r,...upd}); upd.status_origem = upd.status!==r.status?'plataforma':r.status_origem; }
  else { upd.status=st; upd.status_origem='manual'; }
  $('a_save').disabled=true;
  const {data,error}=await sb.from('acao_base').update(upd).eq('acao_id',aid).eq('matricula',mat).select().single();
  if(error){ toast('Erro ao salvar: '+error.message,true); $('a_save').disabled=false; return; }
  Object.assign(r,data); closeModal(); toast('Atuação salva · status: '+data.status); render();
}
function exportAcao(){
  const rows=acaoFiltrada().map(r=>({Matrícula:r.matricula,Cliente:r.cliente,Executivo:r.executivo,Base:r.origem,Situação:r.sit_ligacao,
    'Saldo vencido':+r.saldo_vencido||0,'Saldo a vencer':+r.saldo_a_vencer||0,Aging:r.aging,Economias:r.economias,Região:r.regiao,Bairro:r.bairro,
    Análise:r.analise,'Plano de ação':r.plano_acao,Tratativa:r.tratativa,'Ação do executivo':r.acao_executivo,Proposta:r.proposta,
    'Estágio':r.estagio,'Data envio':r.data_envio,'Prazo retorno':r.prazo_retorno,'Retorno cliente':r.retorno_cliente,Revalidação:r.revalidacao,
    Observação:r.observacao,Status:r.status,'Status por':r.status_origem,'Atualizado em':fdt(r.atualizado_em)}));
  const ws=XLSX.utils.json_to_sheet(rows), wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Ação 1');
  XLSX.writeFile(wb,`Acao1_${execFoco()||'todos'}_${new Date().toISOString().slice(0,10)}.xlsx`);
